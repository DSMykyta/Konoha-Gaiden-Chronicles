  description: 'Одна сюжетна лінія: Спільна битва в копальні Ґелеля. Сцени: Сторони сходяться біля руїн і копальні Ґелеля;
    Наруто й Темуджин зупиняють Хайдо в Залі Запечатування; Копальня Ґелеля руйнується.'
