  description: 'Одна сюжетна лінія: Бій Наруто і Саске в Долині Завершення. Сцени: Наруто наздоганяє Саске в Долині Завершення;
    Саске відкидає повернення; Бій Наруто й Саске переходить на найвищий рівень; Расенґан і Чідорі стикаються; Саске перемагає
    Наруто, але залишає його живим.'
- id: ep-y0-hokage-scroll-response
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Хірузен організовує пошук сувою
  description: >-
    Коли зникає заборонений Сувій Печатей, Хірузен організовує пошуки, усвідомлюючи небезпеку потрапляння його технік до чужих рук. Звістка про крадіжку доходить до Іруки, а після викриття Мідзукі та повернення контролю над сувоєм Хокаґе відкликає пошукові загони.

- id: ep-y0-team10-first-lunch
