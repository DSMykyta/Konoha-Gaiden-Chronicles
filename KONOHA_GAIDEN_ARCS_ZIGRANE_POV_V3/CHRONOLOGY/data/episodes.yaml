  title: Бакі бере участь у нараді Суни після викрадення Мацурі
  description: 'Одна сюжетна лінія: Бакі бере участь у нараді Суни після викрадення Мацурі. Сцени: Бакі бере участь у нараді
    Суни після викрадення Мацурі.'
- id: ep-y0-waves-departure
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Супровід Тадзуни до Країни Хвиль
  description: >-
    Після виконання D-рангових доручень Наруто вимагає серйознішої роботи. Хірузен доручає Команді 7 супровід мостобудівника Тадзуни. Дорогою на загін нападають Брати-Демони, і Какаші змушує клієнта визнати, що місія небезпечніша за заявлений ранг. Попри можливість повернутися команда вирішує продовжити супровід, переправляється через воду й прибуває в Країну Хвиль.

- id: ep-y0-zabuza-first-battle
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Перша сутичка із Забузою
  description: >-
    У тумані Команда 7 зустрічається із Забузою Момочі, найманим убивцею, який полює на Тадзуну. Какаші вступає в бій, але потрапляє до водяної в’язниці. Наруто й Саске, діючи разом, допомагають звільнити наставника, після чого той перемагає противника. Та мисливець із Кірі, який забирає нібито мертвого Забузу, насправді є Хаку, його відданим союзником.

- id: ep-y0-waves-team-briefing
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Какаші готує Команду 7 до повторної зустрічі із Забузою
  description: >-
    У домі Тадзуни Какаші пояснює учням, чому Забуза міг вижити та чому повторного нападу слід чекати найближчим часом. Розмови з родиною мостобудівника відкривають історію Кайзи й те, як Ґато зламав опір місцевих жителів. Тепер геніни захищають не лише клієнта, а й шанс цілої країни вирватися зі страху.

- id: ep-y0-waves-chakra-training
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Тренування контролю чакри
  description: >-
    Розуміючи різницю в силах із Забузою, Какаші навчає Команду 7 концентрувати чакру в ступнях і підійматися по стовбурах дерев. Сакура швидко розуміє вправу; Наруто й Саске, змагаючись між собою, досягають результату важкою працею. Це тренування зближує суперників і готує їх до бою, де однієї сили буде недостатньо.

- id: ep-y0-naruto-haku-meeting
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Наруто зустрічає Хаку під час тренувань
  description: >-
    Після виснажливого тренування Наруто знайомиться в лісі з Хаку, не розуміючи, що той допомагає Забузі. Вони говорять про людину, заради якої варто ставати сильнішим. Для Наруто ця розмова залишається випадковою зустріччю, але під час майбутнього бою на мосту набуває трагічного значення.

- id: ep-y0-bridge-final-battle
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Повторна битва на мосту
  description: >-
    Какаші, Саске й Сакура супроводжують Тадзуну до мосту, де на них чекають Забуза та Хаку; Наруто приєднується до сутички. Хаку замикає Наруто й Саске в крижаних дзеркалах, а Саске затуляє товариша від ударів, пробуджуючи в Наруто силу Дев’ятихвостого. Хаку гине, захистивши Забузу від атаки Какаші. Коли Ґато відкрито зраджує найманця, слова Наруто змушують Забузу переглянути власне ставлення до Хаку та востаннє виступити проти спільного ворога.

- id: ep-y0-tazuna-home-defense
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Напад людей Ґато на дім Тадзуни
  description: >-
    Поки основна сутичка точиться на мосту, люди Ґато нападають на дім Тадзуни й погрожують Цунамі та Інарі. Наруто протистоїть нападникам, а рішучість хлопця допомагає Інарі перестати ховатися за переконанням, що опір неможливий. Загроза родині стає для Інарі поштовхом до подальшого захисту села.

- id: ep-y0-waves-farewell
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Завершення місії в Країні Хвиль
  description: >-
    Після битви на мосту мешканці ховають Забузу й Хаку, а Команда 7 переосмислює побачене. Тадзуна завершує будівництво мосту й називає його на честь Наруто, чиї вчинки допомогли повернути людям сміливість. Виконавши місію, Какаші та троє генінів прощаються з родиною Тадзуни й повертаються в Коноху.

- id: ep-y0-waves-coupon-return
  continuity_id: main
  arc_id: arc-y0-waves-coupon-return
  title: Наруто й Саске повертаються після прощання
  description: 'Одна сюжетна лінія: Наруто й Саске повертаються після прощання. Сцени: Наруто й Саске повертаються після прощання.'
- id: ep-y0-post-waves-rivalry
  continuity_id: main
  arc_id: arc-y0-naruto-sasuke-rivalry
  title: Наруто й Саске сперечаються після повернення з Країни Хвиль
  description: >-
    Після повернення з Країни Хвиль Наруто не може забути бої із Забузою та Хаку й прагне показати, що вже наздогнав Саске. Замість злагоджено виконувати звичайні місії, він дедалі частіше вступає із Саске в суперечку; Какаші припиняє роботу команди, коли це заважає завданню. [[filler|Саске радить Наруто стати сильнішим і ображає Сакуру, коли та пробує зупинити сварку.]] Напруження між учнями стає помітним навіть їхньому наставникові.

- id: ep-y0-foreign-genin-arrival
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Іноземні геніни прибувають до Конохи
  description: >-
    У Коноху починають прибувати геніни із союзних та інших селищ для участі в іспиті на чуніна. Серед них — Ґаара, Темарі й Канкуро із Суни. Поява незнайомих шинобі змінює звичну атмосферу селища: попереду змагання, у якому нові випускники зустрінуть набагато досвідченіших супротивників.

- id: ep-y0-chunin-nominations
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Нарада щодо іспиту на чуніна
  description: >-
    Хірузен збирає наставників і повідомляє про іспит на чуніна.
    Какаші, Куренай та Асума рекомендують на нього Команди 7, 8 і 10 —
    дев’ятьох недавніх випускників. Ірука заперечує: діти, яких він
    нещодавно навчав, ще не готові до такого небезпечного випробування.
    Какаші відповідає, що відповідальність за них тепер несуть
    командири, і Хірузен приймає рекомендації.
  description_project: >-
    У проєктній лінії Райдо теж бере участь у нараді й окремо
    рекомендує Команду 9: Кіту, Рена й Сору.
- id: ep-y0-iruka-readiness-test
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Ірука перевіряє готовність Команди 7
  description: >-
    Не погоджуючись покладатися лише на рекомендацію Какаші, Ірука в аніме окремо перевіряє трьох учнів, замаскувавшись під чужого ніндзя. Наруто рятує викрадену Моегі, Сакура розпізнає гендзюцу, а Саске перемагає невідомого нападника. Після цих перевірок Ірука звітує Какаші, що Команда 7 справді готова. Ця перевірка — аніме-доповнення, а не подія манґи.

- id: ep-y0-team7-chunin-choice
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Какаші залишає вибір Команді 7
  description: >-
    Наступного ранку Какаші передає Наруто, Саске й Сакурі заяви на іспит на чуніна. Він не вимагає негайної відповіді: кожен повинен сам вирішити, чи готовий іти. Наруто та Саске беруться за можливість випробувати себе, тоді як Сакура вагається, відчуваючи різницю між власними силами й досягненнями товаришів.

- id: ep-y0-kakashi-iruka-readiness-report
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Ірука розпитує Какаші про Команду 7
  description: >-
    Після чергової місії Ірука запитує Какаші про колишніх учнів і особливо про Наруто, якого майже не бачив від часу повернення з Країни Хвиль. Какаші не приховує, що Наруто й Саске постійно змагаються та заважають одне одному, проте саме це суперництво прискорює їхній розвиток. Ірука трохи заспокоюється, хоча його турбота про дітей нікуди не зникає.

- id: ep-y0-lee-sasuke-challenge
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Рок Лі викликає Саске на бій
  description: >-
    Рок Лі наздоганяє Команду 7 та викликає Саске на короткий поєдинок, прагнучи випробувати себе проти Учіхи. Наруто пробує битися замість нього, але Лі легко його перемагає. Навіть шарінґан не допомагає Саске встигнути за швидким тайдзюцу суперника. Нінґаме перериває небезпечний прийом Лі, а Ґай з’являється, сварить учня й дивує Команду 7 ексцентричною поведінкою. Лі зізнається, що найсильніший генін їхньої команди — Неджі; Саске усвідомлює, як багато ще має вчитися.

- id: ep-y0-sand-first-encounter
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Зустріч Команди 7 з генінами Суни
  description: >-
    Конохамару, Моегі й Удон ідуть слідом за Наруто; Конохамару випадково врізається в Канкуро. Той погрожує хлопчикові, а Наруто марно намагається допомогти. Саске зупиняє Канкуро кинутою з дерева камінчиною, після чого Ґаара наказує братові припинити бій і вибачається. Сакура з’ясовує, що незнайомці прибули із Суни на іспит. Непомітно для всіх за знайомством спостерігає ще одна команда, розміщена в окремій сцені.

- id: ep-y0-chunin-written-stage
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Перший етап Ібікі
  description: >-
    На вході до екзаменаційної зали Какаші пояснює, що Команда 7 отримала допуск лише завдяки згоді кожного її учасника. Усередині дев’ятеро колишніх однокласників зустрічаються із сильними генінами інших селищ. Кабуто показує картки з даними про Рока Лі та Ґаару, а Наруто провокує залу гучною заявою, що нікому не програє. Досу, Заку й Кін атакують Кабуто після зневажливої згадки про Звук; Ібікі припиняє безлад і починає письмовий етап, де справжнім завданням стають не лише відповіді, а й приховане збирання інформації та вміння не відступати.
  description_project: >-
    У цій самій залі разом з іншими кандидатами перебувають
    Кіта, Рен і Сора; власні моменти Команди 9 доповнюють
    спільну історію письмового іспиту Ібікі.

