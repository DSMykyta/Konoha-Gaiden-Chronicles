  title: Менма руйнує село й викрадає Сакуру
  description: Наруто бачить, що перебування з батьками не захистить друзів, і виходить рятувати Сакуру.
- id: ep-s2-road-final-duel
  arc_id: arc-s2-movie-road
  continuity_id: movie-road
  title: Наруто протистоїть Менмі та Тобі
  description: Ітачі іншого світу допомагає Сакурі; Курама бореться з віддзеркаленим Дев’ятихвостим. Менма звільняється
    від контролю; Наруто та Сакура повертаються.
- id: ep-s2-road-iruka-home
  arc_id: arc-s2-movie-road
  continuity_id: movie-road
  title: Ірука вітає Наруто вдома
  description: Після прощання з віддзеркаленими батьками Наруто повертається до своєї родини в Конохі.
- id: ep-s2-hashirama-madara-river
  arc_id: arc-s2-founding-history
  continuity_id: main
  title: Хашірама й Мадара зустрічаються біля річки
  description: Обоє втратили братів у клановій війні; вони тренуються та мріють про безпечне село.
- id: ep-s2-senju-uchiha-fathers
  arc_id: arc-s2-founding-history
  continuity_id: main
  title: Батьки викривають дружбу дітей
  description: Хашірама й Мадара попереджають один одного камінцями; напад на молодших братів розриває їхню дружбу.
- id: ep-s2-izuna-mortal-wound
  arc_id: arc-s2-founding-history
  continuity_id: main
  title: Тобірама смертельно ранить Ідзуну
  description: Мадара відмовляється від миру; після смерті брата отримує його очі та продовжує війну.
- id: ep-s2-senju-uchiha-peace
  arc_id: arc-s2-founding-history-village-founding
  continuity_id: main
  title: Хашірама пропонує власне життя за мир
  description: Мадара зупиняє його; Сенджю й Учіха укладають угоду.
- id: ep-s2-konoha-founded
  arc_id: arc-s2-founding-history-village-founding
  continuity_id: main
  title: Клани будують спільне село
  description: Мадара пропонує назву Коноха; до союзу приєднуються Сарутобі, Шімура та інші клани. Вибір керівника
    відходить від його особистого наміру передати посаду Мадарі.
- id: ep-s2-madara-leaves-konoha
  arc_id: arc-s2-founding-history-village-founding
  continuity_id: main
  title: Мадара залишає Коноху
  description: Він читає плиту Учіха, втрачає підтримку клану та відмовляється від спільного шляху.
- id: ep-s2-founders-valley-duel
  arc_id: arc-s2-founding-history-village-founding
  continuity_id: main
  title: Мадара повертається з Курамою
  description: Сусаноо вкриває звіра; Хашірама руйнує захист і звільняє лиса від контролю. Дерев’яний клон відволікає
    Мадару; долина отримує сліди їхнього бою.
- id: ep-s2-madara-hidden-survival
  arc_id: arc-s2-founding-history-village-founding
  continuity_id: main
  title: Ідзанаґі дозволяє Мадарі вижити
  description: Він зберігає тканини Хашірами та зникає з відомої селу історії.
- id: ep-s2-kaguya-god-tree
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Каґуя прибуває до людей
  description: Напруження між правителями приводить до переслідування; вона їсть плід Божественного дерева та отримує
    чакру.
- id: ep-s2-kaguya-tsukuyomi
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Каґуя підкорює людей Цукуйомі
  description: Божественне дерево забирає полонених; її сини починають бачити приховану ціну порядку.
- id: ep-s2-hagoromo-gamamaru
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Брати слухають Ґамамару
  description: Хаґоромо вчиться сенджюцу й дізнається про людей у Божественному дереві.
- id: ep-s2-kaguya-sealed
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Брати запечатують Каґую
  description: Після тривалого бою Чібаку Тенсей завершує протистояння; Чорний Зецу лишається прихованим.
- id: ep-s2-hagoromo-ninshu
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Хаґоромо поширює ніншю
  description: Він відновлює міст, допомагає поселенням та передає людям спосіб розуміти один одного через чакру.
- id: ep-s2-indra-asura-childhood
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Індра створює печаті та техніки
  description: Асура відстає в навчанні; Чорний Зецу посилює віддалення Індри від інших.
- id: ep-s2-brothers-succession-trials
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Сини отримують завдання допомогти поселенням
  description: Індра працює сам, а Асура знаходить допомогу людей та усуває шкоду Божественного дерева.
- id: ep-s2-asura-chosen
  arc_id: arc-s2-ancient-history
  continuity_id: main
  title: Хаґоромо обирає Асуру
  description: Індра вбиває прибічників, відкриває Манґекьо та нападає на брата; їхній конфлікт продовжується через
    нащадків.
- id: ep-s2-kakashi-reconstruction-memory
  arc_id: arc-s2-reconstruction-frames
  continuity_id: main
  title: Какаші помічає мандрівну музикантку
  description: Відбудова села повертає його до спогадів про знайомство з Командою 7 та справу Ханаре.
- id: ep-s2-nekomata-nekobaa-memory
  arc_id: arc-s2-reconstruction-frames
  continuity_id: main
  title: Некобаа розглядає старе фото братів
  description: Розмова з Некоматою повертає їх до завдання з відбитком лапи.
- id: ep-s2-kosuke-reconstruction-memory
  arc_id: arc-s2-reconstruction-frames
  continuity_id: main
  title: Косуке згадує прикордонну місію
  description: Під час відбудови він дивиться на Скелю Хокаґе та згадує Наруто поруч із колишніми наставниками.
- id: ep-s2-team10-reconstruction
  arc_id: arc-s2-reconstruction-frames
  continuity_id: main
  title: Команда 10 збирає худобу для мешканців
  description: Шикамару згадує спільне визволення заручниці з Командою 7.
- id: ep-s2-taka-childhood-route-memory
  arc_id: arc-s2-reconstruction-frames
  continuity_id: main
  title: Саске проходить знайомою дорогою
  description: Місце повертає його до місії охорони Нахо та суперництва з Наруто.
- id: ep-s2-kosuke-lost-comrades
  arc_id: arc-s2-history-kosuke-lost-comrades
  continuity_id: main
  title: Косуке втрачає товаришів через власне рішення
  description: Прагнення підвищення закінчується їхньою смертю; він обирає назавжди залишитися геніном.
- id: ep-s2-kosuke-minato-leg
  arc_id: arc-s2-history-kosuke-minato-leg
  continuity_id: main
  title: Мінато перев’язує Косуке ногу
  description: Він відмовляється залишати товариша; пізніше ці слова нагадує Наруто.
- id: ep-s2-hanare-kakashi-childhood
  arc_id: arc-s2-history-hanare-kakashi-childhood
  continuity_id: main
  title: Какаші допомагає загубленій Ханаре
  description: Він показує спосіб знайти напрямок, який залишається в її пам’яті.
- id: ep-s2-tenten-finds-weapons-path
  arc_id: arc-s2-history-tenten-finds-weapons-path
  continuity_id: main
  title: Тентен випробовує медицину й виклик
  description: Невдалі спроби наслідувати Цунаде допомагають Ґаю помітити її здібності до просторових технік зі
    зброєю.
- id: ep-s2-lee-drunk-restaurant
  arc_id: arc-s2-history-lee-drunk-restaurant
  continuity_id: main
  title: Лі випадково випиває алкоголь
  description: П’яний Кулак руйнує ресторан; Ґай бере відповідальність перед власником.
- id: ep-s2-lee-seasickness-training
  arc_id: arc-s2-history-lee-seasickness-training
  continuity_id: main
  title: Ґай тренує Лі на човні
  description: Морська хвороба має замінити сп’яніння; учень визнає вдячність за допомогу наставника.
- id: ep-s2-shino-suika-first-loss
  arc_id: arc-s2-history-shino-suika-first-loss
  continuity_id: main
  title: Суйка перемагає Шіно зблизька
  description: Втрата впевненості змушує його уникати команди.
- id: ep-s2-shino-suika-rematch
  arc_id: arc-s2-history-shino-suika-rematch
  continuity_id: main
  title: Команда 8 повертається до Суйки
  description: Шіно рятує товаришів та застосовує навчену тайджюцу; Куренай спостерігає за загоном.
- id: ep-s2-naruto-teaches-konohamaru-rasengan
  arc_id: arc-s2-history-naruto-teaches-konohamaru-rasengan
  continuity_id: main
  title: Наруто навчає Конохамару Расенґану
  description: Пояснення трьох етапів перетворює їхню звичну гру з техніками на справжнє навчання.
- id: ep-s2-kumo-kage-departure
  arc_id: arc-s2-summit
  continuity_id: main
  title: Райкаґе вирушає до саміту
  description: А бере Даруї й Сі та домовляється зустріти загін Самуї дорогою.
- id: ep-s2-kiri-kage-departure
  arc_id: arc-s2-summit
  continuity_id: main
  title: Мідзукаґе вирушає до саміту
  description: Мей бере Чоджюро та Ао й залишає Кірі.
- id: ep-s2-iwa-kage-departure
  arc_id: arc-s2-summit
  continuity_id: main
  title: Цучікаґе вирушає до саміту
  description: Акацучі допомагає Онокі в дорозі; Куруцучі супроводжує їх.
- id: ep-s2-power-main
  arc_id: arc-s2-power
  continuity_id: main
  title: Power — main
  description: Кабуто знищує Тоніку
- id: ep-s2-first-war-history-main
  arc_id: arc-s2-first-war-history
  continuity_id: main
  title: First War History — main
  description: Курама ковтає братів Кінкаку й Ґінкаку
- id: ep-s2-kimimaro-jugo-friendship
  arc_id: arc-s2-history-kimimaro-jugo-friendship
  continuity_id: main
  title: Кімімаро стає опорою Джюґо
  description: Він стримує його напади й запрошує до Орочімару; обіцянка клітки визначає подальші рішення Джюґо.
- id: ep-s2-sai-shin-picturebook
  arc_id: arc-s2-history-sai-shin-picturebook
  continuity_id: main
  title: Сай малює історію себе та Шіна
  description: У Корені вони зберігають зв’язок як брати; смерть Шіна залишає книгу без останньої сторінки.
- id: ep-s2-komushi-sasori-puppet
  arc_id: arc-s2-history-komushi-sasori-puppet
  continuity_id: main
  title: Комуші помирає після втрати руки
  description: Сасорі створює йому протез; після отруєння та прохання матері робить із друга людську маріонетку.
- id: ep-s2-sakumo-sees-guy
  arc_id: arc-s2-history-sakumo-sees-guy
  continuity_id: main
  title: Сакумо вказує Какаші на потенціал Ґая
  description: Наполегливість хлопця дає батькові підставу назвати його майбутнім сильним суперником.
- id: ep-s2-temujin-village-destroyed
  arc_id: arc-s2-history-temujin-village-destroyed
  continuity_id: main
  title: Хайдо знищує поселення Темуджіна
  description: Він убиває батьків хлопця, приховує свою роль і виховує його як прибічника.
- id: ep-s2-koyuki-child-rescued
  arc_id: arc-s2-history-koyuki-child-rescued
  continuity_id: main
  title: Какаші рятує малу Коюкі
  description: Переворот Дото руйнує палац і забирає життя батька Коюкі; Какаші виносить її з країни.
- id: ep-s2-choji-protection-oath
  arc_id: arc-s2-history-choji-protection-oath
  continuity_id: main
  title: Чоджі дає батькові обіцянку
  description: Він має берегти товаришів і майбутнє клану; ця настанова повертається під час бою з Асумою.
- id: ep-s2-sasuke-suigetsu-promise
  arc_id: arc-s2-history-sasuke-suigetsu-promise
  continuity_id: main
  title: Саске обіцяє звільнити Суйґецу
  description: Той лишається в резервуарі до загибелі Орочімару.
- id: ep-s2-jiraiya-nadeshiko-duel
  arc_id: arc-s2-history-jiraiya-nadeshiko-duel
  continuity_id: main
  title: Джирая залишає двобій наступним учням
  description: Бій із очільницею Надешіко завершується обіцянкою продовжити його через спадкоємців.
- id: ep-s2-shizuka-sagiri-loss
  arc_id: arc-s2-history-shizuka-sagiri-loss
  continuity_id: main
  title: Шізука втрачає Саґірі
  description: Їхньому зв’язку противляться старші села; загибель коханого змушує її відмовитися від нового шлюбу.
- id: ep-s2-bunpuku-shukaku
  arc_id: arc-s2-history-bunpuku-shukaku
  continuity_id: main
  title: Бунпуку говорить із Шукаку як із товаришем
  description: Попри ув’язнення він не звинувачує звіра; його слова лишаються в пам’яті Шукаку.
- id: ep-s2-duy-eight-gates-sacrifice
  arc_id: arc-s2-history-duy-eight-gates-sacrifice
  continuity_id: main
  title: Дай захищає трійцю від мечників Туману
  description: Восьмі Ворота дають змогу затримати нападників; Ґай, Ґенма й Ебісу залишають поле, а Дай гине.
- id: ep-s2-guy-academy-effort
  arc_id: arc-s2-history-guy-academy-effort
  continuity_id: main
  title: Ґай намагається потрапити до Академії
  description: Він не проходить відбір і тренується до виснаження; Дай продовжує підтримувати його.
- id: ep-s2-road-telescope-preparation
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Тобі вивчає бажання Наруто
  description: Він спостерігає через техніку телескопа й готує пробний варіант Цукуйомі.
- id: ep-s2-road-bath-invitation
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Лі збирає друзів для Наруто
  description: Повернувшись із місії, він кличе товаришів до лазні.
- id: ep-s2-road-public-bath
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Похід до лазні закінчується сваркою
  description: Акамару спричиняє ковзання Чоджі, а Лі провалюється крізь стелю; Наруто захищає його, але сам потрапляє
    під підозру Сакури.
- id: ep-s2-road-evening-cards
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Друзі приходять грати в карти
  description: Після їхнього відходу Наруто знову лишається сам; спостереження дає Тобі потрібний образ для пастки.
- id: ep-s2-road-sakura-skyfall
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Іно знаходить іншу Сакуру
  description: Дівчина падає з неба й непритомніє на гілці; Іно забирає її до Конохи.
- id: ep-s2-road-sakura-hospital
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Цунаде оглядає Сакуру з амнезією
  description: Її спогади про знайомих не відповідають поведінці людей у цьому світі.
- id: ep-s2-road-sakura-search-pendant
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Іно допомагає шукати підвіску
  description: Зустрічі зі знайомими не повертають пам’ять; Сакура помічає втрату прикраси.
- id: ep-s2-road-sakura-parents-return
  arc_id: arc-s2-movie-road-prologue
  continuity_id: movie-road
  title: Кідзаші повертає підвіску Сакурі
  description: Вона обіймає батьків, потім каже Іно, що, мабуть, є іншою Сакурою, й зникає у світлі.
- id: ep-s2-yugao-hayate-training
  arc_id: arc-s2-history-yugao-hayate-training
  continuity_id: main
  title: Юґао тренується з Хаяте
  description: Спільне кенджюцу залишає рухи, за якими вона згодом упізнає колишнього товариша.
- id: ep-s2-chen-student-training
  arc_id: arc-s2-history-chen-student-training
  continuity_id: main
  title: Чен навчає хлопця без нінджюцу
  description: Учень стає шинобі завдяки тайдзюцу, але не встигає опанувати Дракон Конохи до війни.
- id: ep-s2-chen-student-death
  arc_id: arc-s2-history-chen-student-death
  continuity_id: main
  title: Учень Чена гине на війні
  description: Його відправляють на фронт; загибель змушує Чена залишити життя шинобі.
- id: ep-s2-chen-fakes-death
  arc_id: arc-s2-history-chen-fakes-death
  continuity_id: main
  title: Чен ставить власну порожню могилу
  description: Він удає свою смерть після втрати єдиного учня й відмовляється навчати нових.
- id: ep-s2-kabuto-grave-robbing
  arc_id: arc-s2-kabuto-prewar-research
  continuity_id: main
  title: Кабуто збирає останки для Едо Тенсей
  description: Після вживлення клітин Орочімару він розкопує могили й готує матеріал для майбутніх оживлень.
- id: ep-s2-madara-rinnegan-awakens
  arc_id: arc-s2-history-madara-rinnegan-awakens
  continuity_id: main
  title: Мадара пробуджує Ріннеґан наприкінці життя
  description: Сила Хашірами дає йому нові очі й доступ до Ґедо Мазо.
- id: ep-s2-madara-nagato-eyes
  arc_id: arc-s2-history-madara-nagato-eyes
  continuity_id: main
  title: Мадара пересаджує очі Наґато
  description: Дитина отримує Ріннеґан, не знаючи його походження; це відбувається до загибелі її батьків.
- id: ep-s2-madara-instructs-obito
  arc_id: arc-s2-history-madara-instructs-obito
  continuity_id: main
  title: Мадара навчає Обіто плану Ока Місяця
  description: Мадара передає Обіто знання, техніки й роль свого наступника для майбутнього повернення.
- id: ep-s2-madara-life-support-ends
  arc_id: arc-s2-history-madara-life-support-ends
  continuity_id: main
  title: Мадара від’єднується від Ґедо Мазо
  description: Він помирає, покладаючи майбутнє воскресіння на Ріннеґан Наґато та дії Обіто.
- id: ep-s2-itachi-orochimaru-life-death
  arc_id: arc-s2-history-itachi-orochimaru-life-death
  continuity_id: main
  title: Ітачі питає про життя і смерть
  description: Після побаченої війни він зустрічає Орочімару біля могил.
- id: ep-s2-itachi-cliff-crows
  arc_id: arc-s2-history-itachi-cliff-crows
  continuity_id: main
  title: Ітачі стрибає зі скелі та зупиняє падіння
  description: Побачивши ворона, він користується кунаєм і повертається до життя.
- id: ep-s2-sasuke-birth
  arc_id: arc-s2-history-sasuke-birth
  continuity_id: main
  title: Народжується Саске
  description: Ітачі отримує молодшого брата й починає дбати про нього.
- id: ep-s2-itachi-great-fireball
  arc_id: arc-s2-history-itachi-great-fireball
  continuity_id: main
  title: Ітачі швидко опановує Велику Вогняну Кулю
  description: Фуґаку навчає його після переселення клану.
- id: ep-s2-itachi-dokan-clone
  arc_id: arc-s2-history-itachi-dokan-clone
  continuity_id: main
  title: Ітачі лишає клона в Академії
  description: Старші учні нападають на нього; вчителі дізнаються про рівень Ітачі й пропонують ранній випуск.
- id: ep-s2-itachi-izumi-dumplings
  arc_id: arc-s2-history-itachi-izumi-dumplings
  continuity_id: main
  title: Ідзумі ділиться данґо з Ітачі
  description: Вона вітає його з підвищенням; він згодом вирушає на місію з Командою 2.
- id: ep-s2-fugaku-mangekyo-loss
  arc_id: arc-s2-history-fugaku-mangekyo-loss
  continuity_id: main
  title: Фуґаку втрачає товариша на війні
  description: Його загибель пробуджує Манґекьо; Фуґаку зберігає це в таємниці від більшості клану.
- id: ep-s2-itachi-captain-mission
  arc_id: arc-s2-history-itachi-captain-mission
  continuity_id: main
  title: Ітачі виконує наказ Данзо як капітан АНБУ
  description: Разом із двома підлеглими він іде на вбивство; Данзо розпитує про невдоволення Учіха.
- id: ep-s2-fugaku-shows-tablet
  arc_id: arc-s2-history-fugaku-shows-tablet
  continuity_id: main
  title: Фуґаку показує Ітачі свої очі
  description: Він пояснює план перевороту та можливість безкровного захоплення влади; Ітачі передає попередження
    керівництву села.
- id: ep-s2-hidan-akatsuki-recruitment
  arc_id: arc-s2-history-hidan-akatsuki-recruitment
  continuity_id: main
  title: Акацукі випробовує безсмертя Хідана
  description: Конан виступає приманкою; Хідан руйнує одне серце Какудзу й стає його напарником.
- id: ep-s2-sakura-ino-hideout
  arc_id: arc-s2-history-sakura-ino-hideout
  continuity_id: main
  title: Сакура приводить Іно до свого сховку
  description: Іно допомагає з квітами; розмова про Саске започатковує їхнє суперництво.
- id: ep-s2-academy-hinata-bullies
  arc_id: arc-s2-history-academy-hinata-bullies
  continuity_id: main
  title: Наруто втручається заради Хінати
  description: Чоджі й Шікамару сперечаються про його вчинок; Наруто перериває сварку, і трійця сміється.
- id: ep-s2-kakashi-sakumo-grave-child
  arc_id: arc-s2-history-kakashi-sakumo-grave-child
  continuity_id: main
  title: Какаші розповідає батьковій могилі про друзів
  description: Після спільної вечері Рін та Обіто лишаються поруч, а Ґай продовжує викликати Какаші на двобої.
- id: ep-s2-jiraiya-tsunade-failed-rescue
  arc_id: arc-s2-history-jiraiya-tsunade-failed-rescue
  continuity_id: main
  title: Джирая влаштовує невдалий порятунок Цунаде
  description: Він просить Орочімару зіграти нападника, але задум не працює.
- id: ep-s2-sannin-kiri-night-fight
  arc_id: arc-s2-history-sannin-kiri-night-fight
  continuity_id: main
  title: Трійця відбиває нічний напад Кірі
  description: Розмова про мрії біля вогню закінчується атакою шинобі Туману.
- id: ep-s2-kawarama-funeral
  arc_id: arc-s2-founders-childhood-additions
  continuity_id: main
  title: Сенджю ховають Кавараму
  description: Хашірама заперечує проти відправлення дітей на війну; Бутсума вдаряє його.
- id: ep-s2-itama-killed
  arc_id: arc-s2-founders-childhood-additions
  continuity_id: main
  title: Ітама гине від рук Учіха
  description: Хашірама приходить запізно й знаходить молодшого брата мертвим.
- id: ep-s2-toneri-father-death
  arc_id: arc-s2-last-film-history
  continuity_id: main
  title: Тонері лишається сам після смерті батька
  description: Після смерті батька Тонері живе в замку сам, оточений маріонетками.
- id: ep-s2-hamura-moon-departure
  arc_id: arc-s2-ancient-lunar-history
  continuity_id: main
  title: Хамура переходить на Місяць
  description: Після запечатування Десятихвостого він лишається охороняти Ґедо Мазо.
- id: ep-s2-lunar-branch-war
  arc_id: arc-s2-lunar-branch-history
  continuity_id: main
  title: Побічна гілка знищує головну
  description: Неправильне тлумачення заповіту Хамури приводить до створення спільного Тенсейґана та війни місячного
    клану.
- id: ep-s2-gaara-extraction-complete
  arc_id: arc-s2-rescue-sealing-end
  continuity_id: main
  title: Триденне вилучення Шукаку завершується
  description: Ґаара помирає; Акацукі готуються відбивати загін порятунку.
- id: ep-s2-shikamaru-tenten-to-voyage
  arc_id: arc-s2-prewar-support-route
  continuity_id: main
  title: Шикамару й Тентен виходять до морського загону
  description: Шикамару й Тентен прямують до морського загону Наруто.
- id: ep-s2-shikamaru-tenten-home
  arc_id: arc-s2-prewar-support-route
  continuity_id: main
  title: Підкріплення повертається до Конохи
  description: Після допомоги біля Мокудзу Шикамару й Тентен повертаються до Конохи.
- id: ep-s2-onoki-mu-madara
  arc_id: arc-s2-onoki-madara-history
  continuity_id: main
  title: Мадара принижує молодого Онокі та Мю
  description: Він відкидає рівноправну угоду Іви з Хашірамою й вимагає підкорення; поразка лишається в пам’яті
    Онокі.
- id: ep-s2-kabuto-body-splicing
  arc_id: arc-s2-kabuto-sage-preparation
  continuity_id: main
  title: Кабуто поєднує матеріал експериментів Орочімару
  description: Він привласнює властивості піддослідних і готує нове тіло для власних технік.
- id: ep-s2-kabuto-ryuchi-training
  arc_id: arc-s2-kabuto-sage-preparation
  continuity_id: main
  title: Кабуто навчається сенджюцу в Рючі
  description: Біла Змія-Мудрець дає йому шлях до Режиму Мудреця; це навчання передує його воєнному бою з братами
    Учіха.
- id: ep-s2-obito-graduation-support
  arc_id: arc-s2-obito-academy-additions
  continuity_id: main
  title: Рін підтримує Обіто перед випуском
  description: Його допомога літнім мешканцям приводить до запізнень; Рін нагадує про навчання й підтримує його
    шлях шинобі.
- id: ep-s2-first-kage-summit
  arc_id: arc-s2-first-kage-summit
  continuity_id: main
  title: Хашірама збирає перших Каґе
  description: Він пропонує співпрацю й розподіл хвостатих звірів; Тобірама наполягає на оплаті. Суна вже має Шукаку;
    суперечка показує, що створення сіл саме по собі не забезпечило довіри.
- id: ep-s2-pakura-maki-training
  arc_id: arc-s2-pakura-maki-history
  continuity_id: main
  title: Пакура тренує Макі після перемоги над Івою
  description: Учениця просить продовжити заняття; наставниця закликає її стати сильною заради близьких і села.
- id: ep-alt-s2-ova-exam-field
  arc_id: arc-alt-s2-ova-chunin-fire
  continuity_id: alt-ova-chunin-fire
  title: Другий етап у Суні
  description: Конохамару, Моегі та Удон проходять випробування серед небезпек полігону. Наруто відбиває напад чудовиська, після чого команда продовжує шлях на відбіркові бої.
- id: ep-alt-s2-ova-exam-finals-rules
  arc_id: arc-alt-s2-ova-chunin-fire
  continuity_id: alt-ova-chunin-fire
  title: Правила позачергового іспиту
  description: Темарі оголошує, що цей іспит має підготувати більше шинобі до війни. Вона пояснює правила, та Наруто з Конохамару сперечаються, не дослухавши заборони.
- id: ep-alt-s2-ova-naruto-konohamaru-fight
  arc_id: arc-alt-s2-ova-chunin-fire
  continuity_id: alt-ova-chunin-fire
  title: Наруто проти Конохамару
  description: Конохамару використовує Великий Расенґан, тіньових клонів та успадковані техніки свого клану. Попри перевагу Наруто він завдає одного удару.
- id: ep-alt-s2-ova-disqualification
  arc_id: arc-alt-s2-ova-chunin-fire
  continuity_id: alt-ova-chunin-fire
  title: Заборонена техніка й новий чунін
  description: Наруто входить у Режим мудреця й порушує оголошене правило. Суддя віддає перемогу Конохамару, який отримує звання чуніна.
