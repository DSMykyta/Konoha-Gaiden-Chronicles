  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Наруто опановує Техніку Призову
  description: 'Одна сюжетна лінія: Наруто опановує Техніку Призову. Сцени: Какаші передає тренування Наруто Ебісу; Джирая
    перебирає тренування Наруто; Джирая починає вчити Наруто Техніки Призову; Наруто продовжує практику призову; Наруто все
    ще не може викликати бойову жабу; Наруто викликає Ґамабунту.'
- id: ep-y0-sasuke-chidori-training
