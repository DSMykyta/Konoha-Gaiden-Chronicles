  title: Перший обід Команди 10
  description: >-
    Під час перерви Іно вже намагається очолити розмову нової Команди 10, тоді як Шикамару реагує мляво, а Чоджі думає про спільну їжу. Їхні різні характери проявляються ще до зустрічі з Асумою; Шикамару також помічає Наруто, який стежить за Саске.

