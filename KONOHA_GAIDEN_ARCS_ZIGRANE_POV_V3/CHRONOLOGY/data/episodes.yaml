schema_version: 1
episodes:
  - id: "ep-y0-naruto-monument"
    continuity_id: "main"
    arc_id: "arc-y0-scroll-of-seals"
    title: "Витівка Наруто й Ірука"
    description: "Витівка на Монументі Хокаґе, покарання Іруки, повернення до класу та рамен після прибирання."

  - id: "ep-y0-graduation-failure"
    continuity_id: "main"
    arc_id: "arc-y0-scroll-of-seals"
    title: "Провал випускного іспиту"
    description: "Наруто провалює випускний іспит, після чого Мідзукі використовує його розчарування."

  - id: "ep-y0-scroll-theft"
    continuity_id: "main"
    arc_id: "arc-y0-scroll-of-seals"
    title: "Викрадення Сувою Печатей"
    description: "Мідзукі підштовхує Наруто викрасти Сувій Печатей, а Коноха починає пошук."

  - id: "ep-y0-mizuki-confrontation"
    continuity_id: "main"
    arc_id: "arc-y0-scroll-of-seals"
    title: "Ірука, Мідзукі й Наруто"
    description: "Ірука знаходить Наруто, Мідзукі розкриває таємницю Дев’ятихвостого, а Наруто перемагає його й стає геніном."

  - id: "ep-y0-konohamaru"
    continuity_id: "main"
    arc_id: "arc-y0-scroll-of-seals"
    title: "Наруто й Конохамару"
    description: "Перший день Наруто як геніна до формування Команди 7: зустріч із Конохамару."

  - id: "ep-y0-before-team-assignment"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Перед розподілом команд"
    description: "Окремий епізод у класі безпосередньо перед оголошенням складів команд."

  - id: "ep-y0-team-formation"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Розподіл команд у класі"
    description: "Ірука оголошує склади Команд 7, 8, 9 і 10. Тут лишається тільки лінія класу."

  - id: "ep-y0-jonin-outside-academy"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Джоніни перед Академією"
    description: "Окрема паралельна лінія Асуми, Куренай і Райдо перед Академією; вона не є частиною епізоду розподілу в класі."

  - id: "ep-y0-sasuke-impersonation"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Наруто підміняє Саске"
    description: "Після розподілу Наруто нейтралізує Саске й видає себе за нього перед Сакурою."

  - id: "ep-y0-waiting-for-sensei"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Очікування наставників"
    description: "Команди чекають наставників у класі; Асума й Куренай забирають свої команди, Райдо — Команду 9, а Команда 7 лишається чекати Какаші й готує пастку."

  - id: "ep-y0-kakashi-background-check"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Какаші досліджує нову Команду 7"
    description: "Окрема ретроспективна лінія Какаші: доручення Команди 7 та перевірка відомостей про нових учнів."

  - id: "ep-y0-team7-introduction"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Перша розмова Команди 7"
    description: "Какаші знайомиться з Наруто, Саске й Сакурою на даху."

  - id: "ep-y0-team9-introduction"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Перша розмова Команди 9"
    description: "Райдо знайомиться з Кітою, Реном і Сорою в крамниці данґо."

  - id: "ep-y0-kita-home-after-formation"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Кіта вдома після розподілу"
    description: "Окремий вечірній епізод Кіти після першої зустрічі Команди 9."

  - id: "ep-y0-kakashi-pretest"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Какаші готує випробування"
    description: "Окрема лінія Какаші перед тестом Команди 7: попередні невдалі команди, Меморіальний камінь і розмова з Тензо."

  - id: "ep-y0-team7-exam"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Випробування Какаші — Команда 7"
    description: "Тест із дзвіночками від пояснення правил до рішення Какаші зарахувати Команду 7."

  - id: "ep-y0-iruka-checks-kakashi"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Ірука перевіряє Какаші"
    description: "Паралельний епізод у резиденції Хокаґе: Ірука з’ясовує історію попередніх випробувань Какаші."

  - id: "ep-y0-raido-evaluation"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Перевірка Райдо — Команда 9"
    description: "Одна безперервна перевірка Команди 9, що переходить між кількома сценами: Поле 8, Поле 9, яр і катакомби."

  - id: "ep-y0-team-reports"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Звіти наставників"
    description: "Окремий епізод із підсумковими звітами після випробувань нових команд."

  - id: "ep-y0-students-after-tests"
    continuity_id: "main"
    arc_id: "arc-y0-genin-formation"
    title: "Учні після випробувань"
    description: "Окремий вечірній епізод: Наруто, Кіба й Кіта порівнюють, як пройшли випробування їхніх команд."

  - id: "ep-y0-chunin-preliminaries"
    continuity_id: "main"
    arc_id: "arc-y0-chunin-exams"
    title: "Попередні поєдинки іспиту на чуніна"
    description: "Оголошення попереднього раунду, серія індивідуальних поєдинків, паралельне запечатування Проклятої Печатки Саске та жеребкування фіналу."

  - id: "ep-y0-hayate-investigation"
    continuity_id: "main"
    arc_id: "arc-y0-chunin-exams"
    title: "Останнє завдання Хаяте"
    description: "Від проникнення Кабуто до шпиталю через доручення Хірузена й прощання з Юґао до підслуханого плану вторгнення, загибелі Хаяте та ранкової наради."

  - id: "ep-y0-valley-of-end"
    continuity_id: "main"
    arc_id: "arc-y0-sasuke-retrieval"
    title: "Бій Наруто і Саске в Долині Завершення"
    description: "Безперервна послідовність від зустрічі Наруто із Саске до фінального зіткнення та відходу Саске."
