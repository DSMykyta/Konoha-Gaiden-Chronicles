schema_version: 1
episodes:
- id: ep-y0-naruto-monument
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Витівка Наруто й Ірука
  description: >-
    Наруто розмальовує обличчя Хокаґе, сподіваючись змусити Коноху звернути на себе увагу. Ірука ловить його, карає прибиранням і повторенням техніки в класі, але згодом запрошує на рамен. За розмовою стає зрозуміло, що за витівками Наруто стоять самотність і вперте бажання колись стати Хокаґе.

- id: ep-y0-graduation-failure
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Провал випускного іспиту
  description: >-
    На випускному іспиті Наруто не може виконати звичайну Техніку Клонування й знову чує рішення про провал. Поки однокласників вітають рідні, він залишається один на гойдалці біля Академії. Цим розчаруванням користується Мідзукі, пропонуючи обманливий шлях до протектора.

- id: ep-y0-scroll-theft
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Викрадення Сувою Печатей
  description: >-
    Мідзукі переконує Наруто, нібито таємне випробування із Сувоєм Печатей дозволить йому закінчити Академію. Хлопець пробирається до резиденції Хокаґе, викрадає заборонений сувій і ховається у лісі. Не знаючи справжніх намірів Мідзукі, він намагається опанувати Техніку Множинних Тіньових Клонів.

- id: ep-y0-mizuki-confrontation
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Ірука, Мідзукі й Наруто
  description: >-
    Ірука знаходить Наруто із викраденим сувоєм, але їхню розмову перериває Мідзукі, який прагне забрати знахідку. Він розкриває хлопцеві таємницю Дев’ятихвостого й намагається переконати, що навіть Ірука його ненавидить. Поранений наставник стає на захист Наруто; почувши його щире визнання, хлопець повертається, перемагає Мідзукі за допомогою тіньових клонів і отримує від Іруки протектор геніна.

- id: ep-y0-konohamaru
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Наруто й Конохамару
  description: >-
    Після випуску Наруто оформлює реєстраційне фото у Хірузена й знайомиться з його онуком Конохамару, який намагається перемогти діда та вийти з його тіні. Хлопчик просить Наруто навчити його ефектної техніки, але втручання Ебісу завершується демонстрацією Гаремної Техніки. Наруто пояснює, що стати Хокаґе неможливо коротким шляхом: відтоді Конохамару бачить у ньому не лише вчителя, а й суперника. Перед днем розподілу він знову викликає Наруто на поєдинок.

- id: ep-y0-team-formation
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: День розподілу в Академії
  redirect_ids: [ep-y0-naruto-impersonation, ep-y0-sakura-searches-sasuke]
  description: >-
    Ранок перед першим розподілом починається звичайними справами Наруто й суперництвом Сакури та Іно. В Академії випадковий поцілунок Наруто й Саске тільки загострює напругу; Ірука оголошує Команди 7, 8 і 10. [[project|Окремо він називає Команду 9 — Кіту, Рена й Сору.]] Під час перерви Наруто під виглядом Саске намагається зблизитися із Сакурою, але її слова про самотність відкривають болючу тему для обох хлопців. Після обіду наставники забирають свої команди, а Наруто, Сакура й Саске залишаються чекати Какаші.

- id: ep-y0-jonin-outside-academy
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: Джоніни перед Академією
  description: >-
    Поки Ірука в аудиторії оголошує нові трійки, Асума, Куренай і Райдо перебувають перед Академією. Кіта помічає їх із вікна, ще не знаючи, що Райдо очолить його Команду 9. Це паралельний погляд на день розподілу, а не окрема зустріч усіх генінів із наставниками.

- id: ep-y0-kakashi-background-check
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: Какаші досліджує нову Команду 7
  description: >-
    Чернеткова ретроспективна лінія про те, як Хірузен доручає Какаші Команду 7, а той збирає відомості про майбутніх учнів. Імпортований запис поєднує кілька різних місць і потребує звірки з джерелами та поділу на окремі сцени; його не слід читати як підтверджену безперервну подію дня розподілу.

- id: ep-y0-team7-introduction
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: Перша розмова Команди 7
  description: >-
    Какаші нарешті приходить до трійки, що найдовше чекала в класі, й виводить її на дах для знайомства. Наруто мріє стати Хокаґе, Сакура говорить переважно про Саске, а Саске називає відновлення клану й помсту своєю метою. Помітивши розбіжність між учнями, наставник призначає випробування на виживання та попереджає, що вони можуть повернутися до Академії.

- id: ep-y0-team9-introduction
  continuity_id: main
  arc_id: arc-y0-team9-first-day
  title: Перший день Команди 9
  redirect_ids: [ep-y0-kita-home-after-formation]
  description: Перша розмова з Райдо в крамниці данґо та вечір Кіти вдома після знайомства з командою.
- id: ep-y0-kakashi-pretest
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: Какаші готує випробування
  description: >-
    Ретроспективні відомості про Какаші нагадують його попередні відмови іншим генінам, відвідування меморіалу загиблих і розмову з Тензо. Ці фрагменти пояснюють, чому наставник вирішив перевірити здатність нової трійки не покидати товаришів, але точне розташування та послідовність частини згадок ще не підтверджені.

- id: ep-y0-team7-exam
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: Випробування Какаші — Команда 7
  description: >-
    Какаші пропонує трьом учням відібрати лише два дзвіночки до полудня. Наруто атакує прямо й потрапляє в пастки, Сакура вибуває через гендзюцу, а Саске майже дістає дзвіночок, але також зазнає невдачі. Після завершення часу Какаші пояснює, що вони надто зосередилися на особистому успіху, й забороняє годувати покараного Наруто. Коли Саске та Сакура все одно діляться обідом, захищаючи товариша, наставник визнає їх командою й зараховує випробування.

- id: ep-y0-iruka-checks-kakashi
  continuity_id: main
  arc_id: arc-y0-genin-formation
  title: Ірука перевіряє Какаші
  description: >-
    Стривожений призначенням Какаші наставником Наруто, Ірука перевіряє відомості про попередні генінські команди, які Какаші не пропустив. Його сумніви створюють паралельну лінію до випробування Команди 7, не змінюючи результату самого тесту.

