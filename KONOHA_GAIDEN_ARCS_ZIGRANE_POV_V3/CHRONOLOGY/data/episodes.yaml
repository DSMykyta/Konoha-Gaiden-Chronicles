  title: Сенджі, Шібукі та Наруто проти Суїєна
  description: 'Суїєн захоплює заручників і вимагає Воду Героїв. Сенджі намагається визволити мешканців, Наруто атакує нападника, а Шібукі змушений долати страх. Наприкінці бою сила Води Героїв обертається проти Суїєна; Какаші затримує його спільників.'
- id: ep-alt-gelel-naruto-temujin
