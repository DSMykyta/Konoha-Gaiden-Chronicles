  description: 'Одна сюжетна лінія: Наруто намагається дістатися туалету. Сцени: Наруто шукає туалет під час турніру.'
- id: ep-y0-hiruzen-iruka-after-exam
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Хірузен та Ірука після іспиту
  description: >-
    Після провалу Наруто Хірузен нагадує Іруці, що той теж виріс без батьків після нападу Дев’ятихвостого. Розмова підводить наставника до усвідомлення, чому бажання Наруто бути поміченим настільки болісне і чому простого покарання недостатньо.

- id: ep-y0-ebisu-searches-konohamaru
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Ебісу втрачає свого учня
  description: >-
    Ебісу вважає вплив Наруто на онука Хірузена шкідливим і намагається повернути Конохамару до звичайного навчання. Та хлопчик ухиляється від нагляду й іде за Наруто, змушуючи наставника шукати зниклого учня.

- id: ep-y0-hiruzen-iruka-konohamaru
  continuity_id: main
  arc_id: arc-y0-scroll-of-seals
  title: Хірузен та Ірука про випуск Наруто
  description: >-
    Поки Наруто проводить час із Конохамару, Ірука розмовляє з Хірузеном про його випуск і сподівання на прийняття в селі. Третій Хокаґе пояснює, що заборона говорити дітям про Дев’ятихвостого не знищила страху дорослих. Навіть отримавши протектор, Наруто ще має здолати упередження односельців.

- id: ep-y0-tora-retrieval
  continuity_id: main
  arc_id: arc-y0-d-rank-missions
  title: Команда 7 повертає загублену Тору
  description: Пошук і впіймання кішки до отримання місії Тадзуни; точний день пошуку не встановлено.
- id: ep-y0-gato-zabuza-response
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Ґато й Забуза після невдалої засідки
  description: >-
    Після невдачі нападу на загін Тадзуни Ґато й Забуза оцінюють перешкоду у вигляді Какаші та Команди 7. Ця окрема лінія противників показує, що супровід мостобудівника — частина більшого конфлікту, хоча точні місце та час їхньої розмови не встановлені.

- id: ep-y0-zabuza-recovery
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Хаку відновлює Забузу після першого бою
  description: >-
    Хаку забирає пораненого Забузу після першої сутички, і його показна смерть виявляється частиною обману. Поки Забуза відновлюється, вони готуються знову атакувати Какаші та Тадзуну. Їхні стосунки розкривають приховану людську сторону найманця й відданість Хаку.

- id: ep-y0-waves-bridge-workers
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Будівництво мосту під загрозою Ґато
  description: >-
    Будівництво мосту триває під постійним тиском Ґато. Залякані робітники, зокрема Ґіїчі, втрачають віру в успіх і залишають роботу, ставлячи під загрозу задум Тадзуни. Ця лінія пояснює, чому захист мосту потребує не лише перемоги ніндзя, а й відновлення волі самих мешканців.

- id: ep-y0-sakura-wave-market
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Сакура й Тадзуна повертаються з ринку
  description: >-
    Сакура супроводжує Тадзуну на ринок і на власні очі бачить бідність та страх, спричинені владою Ґато. За межами битв вона починає розуміти, що означає місія для родини мостобудівника й усієї Країни Хвиль.

- id: ep-y0-inari-naruto-dispute
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Інарі сперечається з Наруто
  description: >-
    Інарі переконаний, що Ґато неможливо перемогти, й свариться з Наруто, який не хоче миритися з безсиллям. Суперечка відкриває біль хлопця через долю Кайзи, а Какаші допомагає йому побачити, що впертість Наруто виростає з власного досвіду самотності та боротьби.

- id: ep-y0-waves-morning-concern
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Команда непокоїться через нічне тренування Наруто
  description: >-
    У домі Тадзуни хвилюються через Наруто, який не повернувся після виснажливого нічного тренування. Розмова відбувається паралельно до його перебування в лісі й підкреслює, наскільки напружено Команда 7 готується до повернення Забузи.

- id: ep-y0-inari-rallies-villagers
  continuity_id: main
  arc_id: arc-y0-land-of-waves
  title: Інарі збирає мешканців на захист мосту
  description: >-
    Після нападу людей Ґато Інарі перестає чекати, що хтось урятує країну замість її жителів. Він звертається до односельців, говорить із матір’ю та збирає людей, щоб підтримати захисників мосту. Їхня поява демонструє перехід від заляканості до спільного спротиву.

- id: ep-y0-chunin-entrance-screen
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Команда 7 проходить попередню перевірку біля реєстрації
  description: >-
    Біля входу до зали реєстрації Ізумо й Котецу під виглядом генінів стримують кандидатів та залякують їх небезпеками іспиту. Наруто, Саске й Сакура помічають, що гендзюцу приховує правильний номер поверху. Коли Саске й один із перевіряльників кидаються в бій, Рок Лі раптово перериває зіткнення. Лі намагається сподобатися Сакурі, але отримує відмову. Після відходу Команди 7 Ізумо й Котецу знімають маскування та оцінюють тих, хто зумів пройти перевірку.

- id: ep-y0-chunin-mentors-wait
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Наставники обговорюють письмовий іспит
  description: >-
    Коли геніни пишуть перший етап, їхні наставники збираються окремо та обговорюють суворість випробування Ібікі. Вони не присутні в екзаменаційній залі й не знають, як конкретно поводяться учні. Розмова наставників є паралельною лінією того самого дня, а не продовженням сцени кандидатів.

- id: ep-y0-team8-forest-trial
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Команда 8 полює на сувої в Лісі Смерті
  description: Хіната, Кіба, Акамару й Шіно здобувають другий сувій та спостерігають за іншими командами.

- id: ep-y0-team-guy-forest-search
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Команда Ґая шукає другий сувій
  description: Лі й Неджі окремо шукають суперників у лісі.

- id: ep-y0-shibire-forest-failure
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Команда Шібіре порушує заборону відкривати сувій
  description: Міноджі й Шібіре відкривають сувій у лісі та вибувають із випробування.

- id: ep-y0-sakura-ino-hospital-visit
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Сакура й Іно відвідують Саске та Лі
  description: Сакура й Іно відвідують Саске та Лі.

- id: ep-y0-finalists-training
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Фіналісти готуються до вирішальних боїв
  description: Фіналісти готуються до вирішальних боїв.

- id: ep-y0-finals-eve-preparation
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Переддень фіналу
  description: Учасники та їхні родини проводять день перед фіналом.
- id: ep-y0-iwa-snake-in-cave
  continuity_id: main
  arc_id: arc-y0-iwa-prisoner
  title: Змія в печері
  description: Команда 7 отримує начебто звичайну місію супроводу, але у Відділі розвідки та допитів Какаші дізнається про можливе втручання Кореня. Перед виходом команда вперше бачить психологічно зламаного полоненого, якого повинна доставити до кордону.
- id: ep-y0-iwa-road-to-border
  continuity_id: main
  arc_id: arc-y0-iwa-prisoner
  title: Дорога до кордону
  description: Команда 7 веде полоненого через Країну Вогню, постійно очікуючи нападу Кореня. Побутові труднощі конвою поступово показують дітям, наскільки глибоко зламаний шпигун, а вночі команда дістається місця обміну.
- id: ep-y0-iwa-after-exchange
  continuity_id: main
  arc_id: arc-y0-iwa-prisoner
  title: Після обміну
  description: Після виконання місії діти намагаються осмислити побачений стан полоненого. У нічному таборі Какаші пояснює їм, якими методами Коноха добуває інформацію від ворогів і яку роль у цьому відіграє Міката.
- id: ep-y0-iwa-return-from-border
  continuity_id: main
  arc_id: arc-y0-iwa-prisoner
  title: Повернення з кордону
  description: Наступного ранку Команда 7 повертається до Конохи. Отриманий від Іви сувій необхідно перевірити перед завершенням дипломатичного протоколу, тому команда знову потрапляє до Відділу розвідки та допитів — тепер уже після того, як знає, що сталося з їхнім полоненим.
- id: ep-y0-team9-archive-order
  continuity_id: main
  arc_id: arc-y0-team9-archive3b
  title: Робота в архівному корпусі
  description: 'Команда 9 переходить від звичайних складів і доставок до обліку матеріалів на об’єкті з обмеженим доступом. Райдо розподіляє роботу: Кіта звіряє й маркує коробки, Сора веде реєстр, а Рен допомагає пересувати важкі стелажі.'
- id: ep-y0-team9-archive-discovery
  continuity_id: main
  arc_id: arc-y0-team9-archive3b
  title: Неврахована схованка
  description: За стелажем у секторі 3-Б команда знаходить коробки з медичними бірками та небезпечним вмістом. Кількість знайденого не збігається зі старим записом, а смуга в пилу веде до коридору, де вивозять майно на списання. Сора звертає на це увагу адміністраторки, і вивезення негайно зупиняють.
- id: ep-y0-team9-archive-aftercare
  continuity_id: main
  arc_id: arc-y0-team9-archive3b
  title: Після карантину
  description: Після виходу з небезпечного сектора команда проходить медичну перевірку й знезараження. Адміністраторка наказує дітям мовчати про побачене, але Райдо пояснює, що справу передають на інший рівень, і відводить учнів на обіцяне данго. За столом до них приєднуються Асума та Куренай.
- id: ep-y0-archive-audit
  continuity_id: main
  arc_id: arc-y0-archive-leak
  title: Перевірка після 3-Б
  description: Поки Команда 9 повертається до своїх завдань, адміністраторка фіксує зупинене списання й передає знахідку фахівцям. Лабораторія відділяє реальну небезпеку від старого маркування, а перевірка обліку та доступів пов’язує приховані матеріали з актуальними витоками закритих родинних і медичних даних.
- id: ep-y0-archive-undercover
  continuity_id: main
  arc_id: arc-y0-archive-leak
  title: Цивільне прикриття
  description: Хірузен дає Какаші й Мікаті різні частини однієї операції. Какаші готує перехоплення та охорону периметра, а Міката працює в цивільному реєстрі під виглядом нового співробітника. Спостереження, звірка матеріалів і фотографії передачі сувою виводять їх на старшу архівістку та зв’язкового з Країни Землі.
- id: ep-y0-archive-arrests
  continuity_id: main
  arc_id: arc-y0-archive-leak
  title: Затримання в архіві
  description: Після доповіді Мікати Хірузен затверджує операцію. Какаші закриває зовнішній периметр, а оперативники затримують джерело витоку та зв’язкового Іви. Серед решти працівниць він відокремлює двох співучасниць від чотирьох непричетних архівісток, включно з Юміко, і звітує про перекриття каналу.
- id: ep-y0-archive-iwa-interrogation
  continuity_id: main
  arc_id: arc-y0-archive-leak
  title: Допит зв’язкового Іви
  description: Затриманих передають Відділу розвідки та допитів. Міката психологічно ламає зв’язкового Іви без видимих тілесних ушкоджень, а Ібікі зводить отримані відомості та завершує потрібну для Конохи роботу. Звіт про шпигуна надходить Хірузену.
- id: ep-y0-archive-exchange-decision
  continuity_id: main
  arc_id: arc-y0-archive-leak
  title: Рішення про обмін
  description: Після завершення допиту Коноха залишає шпигуна під вартою та відкриває переговори з Івою. Умови обміну, прикордонну точку й порядок передачі погоджують окремо від слідчої операції. Після дипломатичного підтвердження полоненого готують до конвою Команди 7.
- id: ep-games-t9-home-notes
  continuity_id: main
  arc_id: arc-games-t9-first-skills
  title: Після перевірки Райдо
  description: Після перевірки Райдо Кіта обговорює нові команди зі своїм другом Кібою. Удома Нобарі показує йому власний медичний конспект і демонструє тонкий контроль чакри.
- id: ep-games-t9-first-weapons
  continuity_id: main
  arc_id: arc-games-t9-first-skills
  title: Своя зброя
  description: Пробні вправи показують різні сильні сторони учнів. Іщін підбирає їм зброю, з якою можна будувати власні прийоми.
- id: ep-games-t9-first-work
  continuity_id: main
  arc_id: arc-games-t9-first-skills
  title: Командні ролі та D-ранги
  description: Сора починає узгоджувати рух трійки, поки Райдо зберігає відповідальність за рішення на місії. Оплачувана робота перевіряє дисципліну без бойової загрози.
- id: ep-games-t9-thread
  continuity_id: main
  arc_id: arc-games-t9-thread-blink
  title: Клинок і нитка
  description: Райдо відділяє корисний тонкий контроль від небезпечних спроб обійти звичайну практику.
- id: ep-games-t9-fire
  continuity_id: main
  arc_id: arc-games-t9-thread-blink
  title: Залишкова чакра і опіки
  description: Демонстрація Асуми надихає Кіту на самостійні спроби. Приховані травми змушують повернутися до обережної практики та допомоги Нобарі.
- id: ep-games-t9-first-blink
  continuity_id: main
  arc_id: arc-games-t9-thread-blink
  title: Перший просторовий зсув
  description: Відсутність Райдо дає учням досвід роботи поруч з іншими командами. Випадковий стрибок Кіти переводять у контрольовану коротку вправу.
- id: ep-games-t9-wave-reunion
  continuity_id: main
  arc_id: arc-games-t9-preexam
  title: Після Країни Хвиль
  description: Друзі зустрічаються після повернення Команди 7 й бачать, як перша складна місія змінила Наруто.
- id: ep-games-t9-preexam-check
  continuity_id: main
  arc_id: arc-games-t9-preexam
  title: Особисті прийоми й перевірка Какаші
  description: Рен упізнає рух без зору, Сора працює над приховуванням справжньої атаки, а тимчасова перевірка Какаші оцінює вже сформовану координацію.
- id: ep-games-t9-death-forest
  continuity_id: main
  arc_id: arc-y0-chunin-exams
  title: Команда 9 — п’ять днів у Лісі Смерті
  description: Паралельна участь Команди 9 у загальному іспиті на чуніна, 2–6 липня 61 року. Письмовий етап 1 липня описано у спільній сцені іспиту Ібікі; тут Команда 9 знаходить потрібний сувій, але біля завершення маршруту виявляє порожній сховок і не встигає виправити втрату.
- id: ep-games-t9-anko-new-command
  continuity_id: main
  arc_id: arc-games-t9-anko-transfer
  title: Наказ і передача команди
  description: Хірузен оголошує зміну наставника відразу після провалу другого етапу. Райдо передає Анко записи про учнів.
- id: ep-games-t9-anko-first-assessment
  continuity_id: main
  arc_id: arc-games-t9-anko-transfer
  title: Перша перевірка Анко
  description: Анко перевіряє витривалість і прийоми трійки та записує результат спарингів.
- id: ep-games-t9-nobari-morning
  continuity_id: main
  arc_id: arc-games-t9-nobari-medical-mission
  title: Ранок із Командою 8
  description: За відсутності Анко Куренай проводить спільне тренування перед медичним завданням.
- id: ep-games-t9-nobari-medical-mission
  continuity_id: main
  arc_id: arc-games-t9-nobari-medical-mission
  title: Завдання й дорога до поселення
  description: Асума пояснює медичний D-ранг. Нобарі очолює вихід через ворота Конохи й веде трійку до поселення.
- id: ep-games-t9-nobari-hospital
  continuity_id: main
  arc_id: arc-games-t9-nobari-medical-mission
  title: Робота польового шпиталю
  description: Нобарі допомагає лікарям і розподіляє роботу учнів. Сора послаблює біль, Кіта доліковує рани, Рен
    переносить людей і матеріали.
- id: ep-games-t9-nobari-evacuation
  continuity_id: main
  arc_id: arc-games-t9-nobari-medical-mission
  title: Евакуація й повернення
  description: Під час підготовки перевезення лікар показує Нобарі загоєний опік. Рен несе заснулого Кіту; трійка
    повертається з Нобарі.
- id: ep-games-t9-nobari-debrief
  continuity_id: main
  arc_id: arc-games-t9-nobari-medical-mission
  title: Нобарі за столом наставників
  description: Після місії Нобарі зустрічається з Куренай, Асумою та Райдо й дізнається про давній висотний блінк
    Кіти.
- id: ep-games-t9-nobari-followup
  continuity_id: main
  arc_id: arc-games-t9-nobari-medical-mission
  title: Наступні заняття з Восьмою
  description: Після медичної місії Куренай спостерігає самостійну програму Сори. Спаринги закінчуються спільним
    обідом двох команд.
- id: ep-games-t9-fence-check
  continuity_id: main
  arc_id: arc-games-t9-death-forest-fence
  title: Тридцять позначок огорожі
  description: Звичайний D-ранг виявляє тріщину, людську кров і слід кігтів. Анко обмежує роботу учнів і йде перевіряти внутрішній сектор сама.
- id: ep-games-t9-b4-design
  continuity_id: main
  arc_id: arc-games-t9-death-forest-fence
  title: Схема Б-4
  description: Вертикальні стрибки й перша узгоджена підміна стають основою командної атаки. Поранення Анко перериває її звичайний нагляд.
- id: ep-games-t9-touno-start
  continuity_id: main
  arc_id: arc-games-t9-touno-asuma
  title: Тимчасовий наставник
  description: Команда обирає Тоуно й продовжує D-ранги. Його вимірювання показують реальні витрати блінку, але довіра ще не сформована.
- id: ep-games-t9-touno-end
  continuity_id: main
  arc_id: arc-games-t9-touno-asuma
  title: Межі співпраці
  description: Неоголошене продовження роботи завершує довіру до тимчасового наставника. Команда залишається разом і користується дозволеною підтримкою інших загонів.
- id: ep-games-t9-asuma-anchor
  continuity_id: main
  arc_id: arc-games-t9-touno-asuma
  title: Асума і контроль ресурсу
  description: Асума допомагає Кіті розібрати страх і витрату чакри. Після невдалого лікування Кіта зберігає подаровану пляшку як пам’ятку про підтримку наставника; згодом проба паперу виявляє дві стихії.
- id: ep-games-t9-anko-back
  continuity_id: main
  arc_id: arc-games-t9-anko-return
  title: Після трьох тижнів лікування
  description: Анко приймає звіти про тимчасову роботу й дозволяє зберегти корисні заняття з Асумою та Куренай.
- id: ep-games-t9-new-burns
  continuity_id: main
  arc_id: arc-games-t9-anko-return
  title: Вітер, клинок і віддалений вогонь
  description: Успіх із вітром спонукає Кіту знову перевірити межі. Райдо та Куренай зупиняють небезпечні напрямки й допомагають побачити реальний рух чакри.
- id: ep-games-t9-tanigawa-mission
  continuity_id: main
  arc_id: arc-games-t9-tanigawa
  title: Постановочний напад
  description: Анко планує перевірку на C-ранзі, але команда реагує раніше за очікуваний сигнал і травмує нападників.
- id: ep-games-t9-tanigawa-home
  continuity_id: main
  arc_id: arc-games-t9-tanigawa
  title: Після першої крові
  description: Дорослі допомагають трійці пережити повернення, а хлопці намагаються зрозуміти, що зробили зі знайомими людьми.
- id: ep-games-t9-sealed-departure
  continuity_id: main
  arc_id: arc-games-t9-long-base2
  title: Запечатаний маршрут
  description: Радники передають наказ, до якого Цунаде не має повного доступу. Команда йде разом, а її родини залишаються без відомостей про маршрут.
- id: ep-games-t9-base2-first
  continuity_id: main
  arc_id: arc-games-t9-long-base2
  title: Перша База 2
  description: Нічне спостереження за фермою веде до входу у дві будівлі. Всередині команда знаходить більше людей, ніж бачила зовні, полоненого з Проклятою Печаткою та записи лабораторії.
- id: ep-games-t9-base18-entry
  continuity_id: main
  arc_id: arc-games-t9-long-base18
  title: Центральний комплекс
  description: Трійка входить у лабораторну мережу й стикається з масштабом дослідів, якого не було видно на першій базі.
- id: ep-games-t9-base18-after
  continuity_id: main
  arc_id: arc-games-t9-long-base18
  title: Після лабораторії
  description: Збережені матеріали й знищення комплексу не прибирають конфлікту всередині трійки. Звичайна їжа допомагає їм знову говорити одне з одним.
- id: ep-games-kakashi-first-meetings
  continuity_id: main
  arc_id: arc-games-kakashi-yumiko-first
  title: Випадкові зустрічі
  description: Обід, вечір із колегами та забуті продукти створюють знайомство, в якому жоден із двох ще не почувається впевнено.
- id: ep-games-kakashi-park-name
  continuity_id: main
  arc_id: arc-games-kakashi-yumiko-first
  title: Парк і сусідка Сакури
  description: Какаші забирає звіт у знайомих колег із Відділу допитів. Сакура пояснює, де працює незнайома жінка, а спроба заговорити з нею в парку закінчується ще однією незручністю.
- id: ep-games-kakashi-after-archive
  continuity_id: main
  arc_id: arc-games-kakashi-yumiko-first
  title: Після службової зустрічі
  description: Після звільнення непричетних працівниць архіву Сакура називає Какаші ім’я Юміко. Безрезультатний пошук приводить його до порожнього балкона й розмови з Шікаку.
- id: ep-games-kakashi-garden-yumiko
  continuity_id: main
  arc_id: arc-games-kakashi-after-iwa
  title: Звичайний D-ранг
  description: Команда прибирає подвір’я та старі меблі навпроти будинку Сакури. Учениця пояснює Какаші причину відсутності Юміко, а згодом Куренай розпитує його про бажання поговорити з нею.
- id: ep-games-kakashi-return-lunch
  continuity_id: main
  arc_id: arc-games-kakashi-yumiko-return
  title: Обід після відсутності
  description: Зустріч відновлює контакт, а розмова з колегами показує, як багато Какаші вже вкладає в його продовження.
- id: ep-games-kakashi-shukuba-contact
  continuity_id: main
  arc_id: arc-games-kakashi-shukuba
  title: Цивільний маршрут
  description: Наставник маскує бойовий склад групи, щоб провести коротку передачу інформації й вийти без зайвих підозр.
- id: ep-games-kakashi-shukuba-leads
  continuity_id: main
  arc_id: arc-games-kakashi-shukuba
  title: Очікування і новий архівний слід
  description: Після переданого запрошення Какаші чекає Юміко з Паккуном, але вона не приходить. Розмова з братом Такумі змушує його припинити очікування. Окремо розбір сувою відкриває новий слід до адміністративних документів.
- id: ep-games-kakashi-iwa-mines-brief
  continuity_id: main
  arc_id: arc-games-kakashi-shukuba
  title: Прихована диверсія
  description: Інформація з Шукуби веде до найманців у шахтах біля кордону Трави. Хірузен обирає операцію, яка має приховати участь Конохи.
- id: ep-games-kakashi-mines-infiltration
  continuity_id: main
  arc_id: arc-games-kakashi-iwa-mines
  title: Без видимих слідів
  description: Група входить на ворожу територію з розділеними ролями. Міката відтворює місцевого патрульного, щоб пройти сигнальні бар’єри.
- id: ep-games-kakashi-mines-collapse
  continuity_id: main
  arc_id: arc-games-kakashi-iwa-mines
  title: Хаос і обвал
  description: Постановочна п’яна бійка збирає увагу варти на Мікаті. Поки основа шахт руйнується, група прибирає сліди підміни.
- id: ep-games-kakashi-mines-return
  continuity_id: main
  arc_id: arc-games-kakashi-iwa-mines
  title: Повернення й відновлення
  description: Ґенма доставляє виснаженого Мікату до Ібікі. Какаші збирає звіти та призначає ранкову доповідь, а ввечері колеги відзначають повернення з шахт.
- id: ep-games-kakashi-team9-start
  continuity_id: main
  arc_id: arc-games-kakashi-team9-escort
  title: Перед виходом
  description: Тимчасовий командир перевіряє координацію трійки й мусить виправити власне перше враження.
- id: ep-games-kakashi-team9-road
  continuity_id: main
  arc_id: arc-games-kakashi-team9-escort
  title: Справжній контакт
  description: Засідка й спільна дорога показують, що звички трійки виникли з взаємної підтримки, а не лише із суворої муштри.
- id: ep-games-kakashi-valley-consequences
  continuity_id: main
  arc_id: arc-games-kakashi-after-valley
  title: Після повернення Наруто
  description: Шпиталь і звіт уже не можуть повернути колишній склад Команди 7. Какаші залишається з власною відповідальністю за тих, хто живий.
- id: ep-games-kakashi-overwork
  continuity_id: main
  arc_id: arc-games-kakashi-after-valley
  title: Виснаження і підтримка друзів
  description: Після серії бойових завдань Цунаде наказує Какаші відпочити. У банку він несподівано бачить Юміко, а ввечері друзі у Нобарі шукають адміністративний спосіб отримати відомості про Команду 9.
- id: ep-time-slip-129
  continuity_id: main
  arc_id: arc-time-slip-performers
  title: Село Прихованого Листа
  source_series: 'Boruto: Naruto Next Generations'
  source_episode: 129
  source_scope: past_only
- id: ep-time-slip-130
  continuity_id: main
  arc_id: arc-time-slip-performers
  title: Геніни, збір!
  source_series: 'Boruto: Naruto Next Generations'
  source_episode: 130
  source_scope: past_only
- id: ep-time-slip-131
  continuity_id: main
  arc_id: arc-time-slip-performers
  title: Сила Дев’ятихвостого
  source_series: 'Boruto: Naruto Next Generations'
  source_episode: 131
