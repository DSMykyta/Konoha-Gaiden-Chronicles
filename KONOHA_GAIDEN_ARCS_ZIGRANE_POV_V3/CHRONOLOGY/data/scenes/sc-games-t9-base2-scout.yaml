  text: 'На підході до двох будівель Рен помилково відчуває лише двох малих охоронців замість чотирьох. Трійка діє за своєю схемою: Кіта й Рен беруть зовнішню частину, Сора — більшу будівлю. Контакт закінчується загибеллю охоронців, озброєних людей усередині та беззбройного дослідника. Перший результат уже не схожий на постановочну засідку: загиблих неможливо повернути медичною вправою.'
