  title: Нобарі приймає справи й розподіляє роботу
  text: Перед входом у склад-шпиталь Нобарі попереджає Рена. Сора підтримує її словами «Хаяші-сенсей права», але
    Рен заходить. Лікарі вводять Нобарі в курс справ; вона допомагає з важчими випадками, Сору спрямовує на знеболення,
    Кіту — на оброблені рани, Рена — до старшого санітара.
