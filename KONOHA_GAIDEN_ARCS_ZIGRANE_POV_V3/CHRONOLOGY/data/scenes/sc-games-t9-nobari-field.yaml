  title: Нобарі веде Команду 9 на медичну місію
  text: 'У складі, перетвореному на шпиталь, Нобарі розподіляє роботу. Сора короткими циклами послаблює біль гендзюцу, Кіта під наглядом матері стягує краї вже оброблених ран, Рен носить воду, перев’язки й поранених. Після виснажливої зміни лікар показує Нобарі нову шкіру на плечі й щоці пацієнта: після роботи Кіти очікуваного грубого рубця немає. Сам Кіта вже спить від виснаження й не чує цього висновку.'
