- id: ev-games-t9-nobari-kita-treatment
  display_rank: 200
  title: Кіта стягує краї опіків і розсічень
  text: Лікар залишає Кіті край уже обробленої рани й спостерігає перші рухи медичної чакри. Кіта розповідає, що
    щодня обпалює руки на вогняних тренуваннях і сам відновлює їх. Лікар перевіряє результат і дозволяє продовжити
    під наглядом Нобарі. Кіта стягує краї опіків і розсічень; Нобарі коригує надмірну витрату чакри.
