  title: Джоніни звітують Цунаде про розвиток Команди 9
  text: Увечері Анко, Куренай, Асума, Какаші та Ірука збираються в кабінеті Цунаде. Анко повідомляє про підміни живих людей і зміни трійки за час лікування. Асума додає результат чакрового паперу — вітер і вогонь у Кіти. Наставники зіставляють ці спостереження з роботою учнів поруч з іншими командами. Цунаде отримує службовий звіт, якого раніше їй ще не передавали.
