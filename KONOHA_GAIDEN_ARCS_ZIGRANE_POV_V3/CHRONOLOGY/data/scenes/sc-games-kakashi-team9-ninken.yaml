  text: На третьому полігоні Какаші викликає нінкенів і перевіряє координацію Команди 9. Трійка використовує вже відпрацьовані комбінації, сенсорику Рена та блінки Кіти. Недоречний жарт Какаші про матір Рена різко обриває розмову; хлопець відходить, а Сора зупиняє зверхні пояснення капітана. Перед виходом Какаші мусить визнати, що невдало прочитав їхні стосунки й підготовку.
