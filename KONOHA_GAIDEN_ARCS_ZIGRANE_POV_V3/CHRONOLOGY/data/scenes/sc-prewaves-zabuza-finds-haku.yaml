description: "Осиротілий Хаку виживає на холодних вулицях Країни Води, відчуваючи, що ні для кого не має значення. Забуза помічає хлопчика і пропонує йому піти з ним, відкрито визнаючи цінність його спадкових здібностей. Хаку погоджується служити йому заради відчуття потрібності. Пізніше, коли Забуза залишає батьківщину, Хаку йде поруч."
