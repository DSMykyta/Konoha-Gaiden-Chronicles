  title: Какаші звітує про перекриття каналу витоку
  text: 'Какаші передає Хірузену результат зовнішньої операції: джерело витоку та зв’язкового Іви взято, двох співучасниць ізольовано, а непричетних працівниць відпущено. Вилучені матеріали й затримані вже у Відділі розвідки та допитів. Доступ до закритих фондів залишається обмеженим, доки адміністрація виправляє виявлені порушення обліку. Силову частину справи завершено; отримання відомостей від шпигуна переходить до Ібікі та Мікати.'
