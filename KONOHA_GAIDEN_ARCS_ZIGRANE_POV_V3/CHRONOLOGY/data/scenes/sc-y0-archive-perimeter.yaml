  title: Какаші перекриває виходи з архівного корпусу
  text: За затвердженим ордером Какаші організовує охорону виходів і контроль зовнішнього периметра. Чуніни займають потрібні проходи, поки внутрішня група готується до затримання. Обмеження мають перекрити втечу зв’язкового та винесення документів, а не перетворити весь цивільний персонал на полонених. Після узгодження дій Какаші дає оперативникам можливість одночасно ізолювати підозрюваних і зберегти доказову базу.
