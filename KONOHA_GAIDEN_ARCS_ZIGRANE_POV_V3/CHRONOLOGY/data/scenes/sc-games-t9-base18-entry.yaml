  text: На третьому місяці місії команда виходить до центрального комплексу з лабораторією та складом. Кіта й Рен усувають охорону, включно з бійцем із наґінатою; підміна не залишає йому можливості провести звичайний двобій. Сора бере внутрішній напрямок. Після попередньої бази трійка вже очікує дослідів над людьми, але ще не знає їхнього масштабу.
