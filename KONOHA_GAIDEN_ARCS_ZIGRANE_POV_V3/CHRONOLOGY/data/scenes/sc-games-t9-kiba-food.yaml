  title: Кіба чекає Кіту після перевірки Райдо
  text: 'Після перевірки на дев’ятому полі Кіта зустрічає свого друга Кібу з Акамару. Кіба приніс дві порції рисових кульок і віддає одну Кіті. Вони обговорюють уже проведені перевірки своїх команд: суворість Райдо, поведінку Рена й спостереження Сори. Кіба запрошує подивитися на денне тренування Команди 8, але Кіта відмовляється. Після розмови вони розходяться, а Кіба повертається до денного тренування своєї команди.'
