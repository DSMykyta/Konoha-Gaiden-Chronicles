description: "Під час сутички з місцевими дітьми Інарі намагається врятувати свого собаку Почі, якого кинули у воду, але сам тоне. Мандрівний рибалка Кайза витягає хлопця на берег і говорить із ним про страх та відповідальність за тих, кого любиш. Відтоді він поступово стає для Інарі близькою людиною, а згодом і названим батьком."
