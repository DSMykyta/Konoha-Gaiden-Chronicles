- id: ev-y0-iwa-forced-stop
  title: Зупинка полоненого змушує команду чекати засідки
  text: Полонений просить зупинитися через фізіологічну потребу. Какаші розцінює вимушений розрив формації як ідеальний момент для атаки й розставляє Саске, Сакуру та Наруто по секторах. Нападу не відбувається. Через кайданки ситуація стає для полоненого додатковим приниженням, і діти ще виразніше бачать, наскільки він втратив колишню гідність і здатність чинити спротив.
