  text: Через чакроподавлюючі кайданки полонений не може пересуватися по деревах разом із шинобі, тому конвой іде землею. Какаші веде групу, Саске закриває тил, Наруто й Сакура тримають фланги. Після попередження Мікати Какаші сприймає весь маршрут як потенційну зону засідки й постійно контролює оточення.
