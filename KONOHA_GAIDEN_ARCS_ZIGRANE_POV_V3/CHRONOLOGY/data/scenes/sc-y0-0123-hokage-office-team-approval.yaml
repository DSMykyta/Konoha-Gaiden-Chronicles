  - id: "ev-y0-0123-raido-accepts-team9"
    title: "Райдо бере Команду 9"
    text: |-
      Райдо дивиться на теку ще до того, як Хірузен відкриває її.

      — Випробування склали, — каже він. — Коли треба було думати, працювали як одне. Не тягнули ковдру на себе, не намагалися геройствувати. На переправі й у катакомбах самі розподілили ролі. На спостереженні теж швидко зрозуміли, що від них потрібно.

      Він замовкає, ніби наступна частина звіту важить більше за попередню.

      — Але команда дуже слабка. Рен преться вперед і віддає рівновагу після першого ж серйозного удару. Сора точна, але їй бракує сили, щоб зупинити противника. Кіта має чакру й техніку, але під тиском може просто перестати діяти. У справжньому бою кожен із них зараз має спосіб померти за кілька секунд.

      Хірузен повільно перегортає одну сторінку. Потім повертає її назад. Його пальці залишаються на верхньому куті звіту Команди 9.

      — Випробування вони склали, — повторює він.

      Райдо мовчить.

      Хірузен не тягнеться до останньої теки. Дим від люльки тонкою смугою піднімається між ними. Десь за зачиненими дверима проходить черговий, і його кроки стихають у коридорі. Райдо опускає погляд на три прізвища внизу сторінки, потім знову дивиться на Хокаґе.

      — Тож ти береш команду? — питає Хірузен тим самим спокійним голосом.

      Ще кілька секунд Райдо нічого не відповідає. Щелепа в нього ледь напружується.

      — Так, — нарешті каже він. — Беру.

      Тільки тоді Хірузен прибирає руку зі звіту, ставить третю позначку й відкладає теку до двох попередніх.
