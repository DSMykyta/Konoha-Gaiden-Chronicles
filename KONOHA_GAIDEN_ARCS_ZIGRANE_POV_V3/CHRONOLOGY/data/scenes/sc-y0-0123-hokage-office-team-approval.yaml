  - id: "ev-y0-0123-hiruzen-approves-four-teams"
    title: "Хірузен затверджує команди"
    text: |-
      Чотири теки лежать тепер окремим рівним стосом. Хірузен дивиться на них, а потім по черзі на кожного з наставників.

      — Від цього вечора вони вже не просто випускники Академії, — каже він. — Вони ваші геніни. Ви сьогодні вирішили, що готові взяти за них відповідальність. Пам’ятайте про це тоді, коли вони почнуть робити речі, яких ви від них не чекали.

      Він бере люльку зі столу, але не поспішає затягуватися.

      — Не намагайтеся зробити з них молодші копії себе. Навчіть їх думати, поки є час подумати; діяти, коли часу вже немає; і повертатися з місії разом. Решту вони навчаться самі — якщо ви дасте їм можливість дожити до цього.

      Хірузен ставить печатку на останньому аркуші й закриває теку.

      — Завтра почнете з D-рангів. Вільні.

      Асума вже повертається до дверей, коли голос Хірузена наздоганяє його:

      — І, Асума. Вечеря місією не вважається.

      На мить навіть Райдо посміхається краєм рота. Потім двері за чотирма джонінами зачиняються, а Хірузен залишається перед чотирма новими записами в реєстрі команд Конохи.
