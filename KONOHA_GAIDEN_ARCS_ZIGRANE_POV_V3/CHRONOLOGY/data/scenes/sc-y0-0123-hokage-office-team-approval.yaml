  - id: "ev-y0-0123-kurenai-accepts-team8"
    title: "Куренай бере Команду 8"
    text: |-
      На обкладинці наступного звіту стоїть номер Вісім.

      — Склали, — каже Куренай. Вона на секунду всміхається сама до себе. — Якщо чесно, я досі трохи не вірю власним очам.

      Хірузен піднімає брову.

      — Це добре чи погано?

      — Добре. Вони різні настільки, що мали б заважати одне одному. А вийшло навпаки. Шіно думає наперед, Кіба тягне їх у рух, Хіната бачить те, чого двоє інших не помічають. На вистежуванні вони почали підлаштовуватися один під одного ще до того, як я встигла це вимагати. І коли на полі з’явилася зайва команда з замаскованим джоніном, вони виконали наказ і не дали себе відволікти.

      Краєм ока Куренай дивиться на Райдо. Той лише важко видихає через ніс.

      — Беру Восьму, — закінчує вона вже без усмішки. — Без сумнівів.

      Хірузен ставить другу позначку. Наступна тека лежить просто під його долонею — номер Дев’ять.
