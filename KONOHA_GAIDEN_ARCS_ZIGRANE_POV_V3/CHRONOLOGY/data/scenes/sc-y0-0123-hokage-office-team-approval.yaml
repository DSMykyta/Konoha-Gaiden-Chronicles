  - id: "ev-y0-0123-kakashi-accepts-team7"
    title: "Какаші бере Команду 7"
    text: |-
      — Склали, — каже Какаші.

      Рука Хірузена, що вже лягла на край теки, на мить завмирає. Він підводить очі на Какаші поверх клубка диму.

      — Усі троє?

      — Усі.

      Це коротке слово зависає в кабінеті трохи довше, ніж мало б. Хірузен добре пам’ятає попередні роки й однакові короткі рапорти Какаші: не готові, не пройшли, повернути до Академії. Тепер же Какаші говорить без звичної байдужої паузи.

      — Коли довелося вибирати між формальною ціллю випробування і товаришами, вони вибрали товаришів, — продовжує він. — Не одразу. І не красиво. Але зрештою зрозуміли, що поодинці програють ще до початку справжньої місії. Я беру Сьому.

      У кутиках очей Хірузена з’являються тонкі зморшки. Він нічого не коментує одразу, лише ставить коротку позначку в звіті.

      — Отже, цього разу ти знайшов те, що шукав.

      Какаші ледь знизує плечем. Хірузен не наполягає й підсуває до себе наступну теку.
