  - id: "ev-y0-0123-asuma-accepts-team10"
    title: "Асума бере Команду 10"
    text: |-
      — Ну, з моєю все простіше, — озивається Асума, ніби навмисне розрізаючи тишу. — Десяту беру, звісно.

      Хірузен кладе перед собою останню теку.

      — І яке випробування ти їм дав?

      Асума на мить затримує сигарету зубами.

      — Я зводив їх на якінику.

      Куренай повільно повертає до нього голову. Відкрите око Какаші відривається від стелі. Райдо просто дивиться на Асуму так, ніби чекає другої половини речення.

      Її немає.

      — Це було випробування? — уточнює Хірузен.

      — Не зовсім.

      Куренай тихо видихає щось середнє між сміхом і стогоном. Асума піднімає долоню, не даючи їй почати.

      — Це Іно-Шіка-Чо. Їхні родини відточували цю зв’язку поколіннями. Мені було важливіше побачити, чи саме ці троє можуть сидіти за одним столом, слухати одне одного й не пересваритися раніше, ніж отримають першу місію. Можуть. Решту я перевірю на роботі.

      Хірузен дивиться на нього поверх останньої теки. Кілька секунд у кабінеті знову тихо.

      — Сподіваюся, хоча б рахунок оплатив ти.

      — Звісно.

      Какаші прикриває око, Куренай нарешті дозволяє собі всміхнутися, а Райдо хитає головою. Хірузен ставить четверту позначку.
