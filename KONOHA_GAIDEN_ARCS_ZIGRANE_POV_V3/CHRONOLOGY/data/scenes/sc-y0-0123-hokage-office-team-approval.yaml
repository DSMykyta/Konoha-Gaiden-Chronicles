  - id: "ev-y0-0123-hiruzen-four-mentors-remain"
    title: "Лишилися четверо"
    text: |-
      У кабінеті Хокаґе пахне тютюном, старим папером і свіжим чорнилом. На краю столу перед Хірузеном лежить невеликий стос звітів, а поруч — уже відкладені повідомлення від інших джонінів-наставників. Какаші, Куренай, Райдо й Асума стоять перед столом півколом; після довгого дня ніхто не намагається виглядати бадьорішим, ніж є.

      Хірузен неквапливо випускає дим із люльки й торкається пальцями відкладених паперів.

      — Решта вже здали відмови, — каже він. — Їхні команди повернуться до Академії.

      Він переводить погляд на чотири теки, що залишилися перед ним.

      — Отже, лишилися ви.

      Першою він підтягує до себе теку з номером Сім. Какаші відриває погляд від вікна ще до того, як Хірузен устигне назвати його ім’я.
