  text: Трійка спостерігає за двома будинками з узлісся. З меншого виходять двоє, з більшого — лише жінка; її рухи насторожують Сору. Команда лишається в мокрій траві до ночі, їсть холодний рис і не розпалює вогню. Сора продовжує варту, поки Кіта й Рен відпочивають. Рішення входити вони приймуть на світанку після додаткової перевірки.
