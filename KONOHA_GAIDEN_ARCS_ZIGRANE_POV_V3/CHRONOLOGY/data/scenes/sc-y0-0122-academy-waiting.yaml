events:
  - id: "ev-y0-0122-team10-departs"
      title: "Асума забирає Команду 10"
      text: "Асума забирає Іно, Шикамару й Чоджі з класу."
      prose: |-
        Після перерви випускники знову сиділи по своїх місцях.
        
        Двері відчинилися. У проході став Асума.
        
        — Команда десять.
        
        Іно підхопилася першою. Шикамару підвівся слідом; Чоджі згорнув пакет із чипсами й засунув його в кишеню.
        
        Асума відійшов від дверей. Усі троє вийшли за ним у коридор.
        
        Двері зачинилися, але ненадовго.
      origin: "A"
      extent: "interval"
      display_rank: 100
      involvement:
