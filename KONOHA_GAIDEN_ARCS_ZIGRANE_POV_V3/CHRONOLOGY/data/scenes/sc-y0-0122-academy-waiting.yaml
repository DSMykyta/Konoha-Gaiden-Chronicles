  - id: "ev-y0-0122-naruto-prepares-trap"
    title: "Наруто готує пастку для Какаші"
    text: "Після виходу Команди 9 Наруто, Саске й Сакура залишаються чекати Какаші. Наруто готує пастку над дверима для запізнілого наставника."
    prose: |-
      Він почекав, доки кроки Команди 9 стихнуть у коридорі, і різко підвівся.
      
      — Раз він так спізнюється...
      
      Наруто схопив стиранку з полиці біля дошки.
      
      Сакура простежила, як він потягнувся до верхнього краю дверей.
      
      — Наруто, не треба.
      
      Він поставив стиранку так, щоб вона трималася на самому краю, зіскочив униз і відбіг до парти.
      
      Саске глянув на двері, потім знову відвернувся.
      
      Наруто сів, поклав долоні на коліна й втупився в ручку.
      
      Сакура лишилася стояти ще секунду, тоді сіла теж.
    origin: "M"
    extent: "interval"
    display_rank: 550
    involvement:
      - entity_id: "c-naruto"
        role: "focus"
        mode: "physical"
      - entity_id: "c-sasuke"
