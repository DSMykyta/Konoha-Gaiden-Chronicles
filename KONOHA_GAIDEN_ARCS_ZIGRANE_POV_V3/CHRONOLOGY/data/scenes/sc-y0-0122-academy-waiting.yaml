  - id: "ev-y0-0122-trap-hits-kakashi"
      title: "Пастка Наруто спрацьовує на Какаші"
      text: "Коли Какаші відчиняє двері класу, підготовлена Наруто пастка спрацьовує: стиранка для дошки падає Какаші на голову."
      prose: |-
        Стиранка зісковзнула з верхнього краю дверей і впала Какаші просто на голову.
        
        Наруто зареготав.
        
        Сакура різко підвелася.
        
        — Сенсей, це Наруто!
        
        Саске лишився сидіти.
        
        Какаші нахилився, підняв стиранку з підлоги й подивився на трьох генінів.
        
        Кілька секунд ніхто не говорив.
      origin: "M"
      extent: "interval"
