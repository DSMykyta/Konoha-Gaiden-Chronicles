  - id: "ev-y0-0122-naruto-prepares-trap"
    title: "Наруто готує пастку для Какаші"
    text: "Після виходу Команди 9 Наруто, Саске й Сакура залишаються чекати Какаші. Наруто готує пастку над дверима для запізнілого наставника."
    prose: |-
      Кроки Команди 9 стихли в коридорі.

      Наруто різко підвівся.

      — Раз він так спізнюється...

      Він схопив стиранку з полиці біля дошки, підсунув до дверей стілець і став на нього.

      — Наруто, не треба, — сказала Сакура.

      Наруто примостив стиранку над дверима, зіскочив на підлогу, відсунув стілець і відбіг до парти. Саске глянув на двері й знову відвернувся.

      Наруто сів, поклав долоні на коліна й утупився в ручку. Сакура постояла ще секунду й теж сіла.
    origin: "M"
    extent: "interval"
    display_rank: 550
    involvement:
