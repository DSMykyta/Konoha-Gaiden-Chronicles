  - id: "ev-y0-0122-raido-question"
    title: "Райдо звертається до Сакури"
    text: "Райдо входить до класу, питає «Дев’ята?», а Сакура відповідає: «Сьома»."
    prose: |-
      Час ішов.
      
      Наруто сповзав дедалі нижче по спинці стільця. Сакура сиділа, підперши щоку долонею. Саске дивився у вікно.
      
      Кіта, Рен і Сора лишалися в іншій частині класу. Блокнот Сори лежав відкритим на парті.
      
      Кроки в коридорі зупинилися.
      
      Двері відсунулися.
      
      На порозі стояв Райдо.
      
      Він провів поглядом по тих, хто залишився.
      
      — Дев’ята?
      
      Сакура підняла руку.
      
      — Сьома.
      
      Райдо перевів очі далі.
    origin: "P"
    extent: "interval"
    display_rank: 400
    involvement:
      - entity_id: "c-raido"
        role: "focus"
        mode: "physical"
      - entity_id: "c-sakura"
        role: "focus"
        mode: "physical"
    evidence_ids:
      - "evd-raido-question"
  - id: "ev-y0-0122-team9-departs"
    title: "Райдо забирає Команду 9"
    text: "Райдо знаходить Кіту, Рена й Сору та веде Команду 9 з аудиторії."
    prose: |-
      Кіта вже підводився.
      
      Рен штовхнув руки в кишені й вийшов із-за парти. Сора закрила блокнот, сховала олівець і встала останньою.
      
      Райдо відступив убік.
      
      — За мною.
      
      Кіта пройш у коридор. Рен рушив слідом. Сора обійшла край парти й вийшла за ними.
      
      Райдо затримався на порозі лише на мить, потім зачинив двері.
      
      У класі лишилися троє.
      
      Наруто підняв голову до дверей.
    origin: "P"
    extent: "interval"
    display_rank: 500
