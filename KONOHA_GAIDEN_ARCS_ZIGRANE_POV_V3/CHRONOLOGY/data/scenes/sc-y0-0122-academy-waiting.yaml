  - id: "ev-y0-0122-kakashi-arrives"
    title: "Какаші приходить до Команди 7"
    text: "Після виходу Команди 9 Какаші нарешті приходить до класу й відчиняє двері, за якими його чекають Наруто, Саске й Сакура."
    prose: |-
      Коридор довго мовчав. Потім за дверима пролунали кроки.

      Наруто миттю випростався, Сакура повернула голову, Саске підняв очі.

      Кроки зупинилися просто перед класом. Ручка опустилася, двері повільно поїхали вбік.

      У прорізі з’явилося сріблясте волосся Какаші.
