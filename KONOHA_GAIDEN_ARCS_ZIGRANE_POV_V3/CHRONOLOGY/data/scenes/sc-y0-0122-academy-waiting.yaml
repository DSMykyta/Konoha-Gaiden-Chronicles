  - id: "ev-y0-0122-team8-departs"
    title: "Куренай забирає Команду 8"
    text: "Куренай забирає Хінату, Кібу й Шіно з класу; перед виходом Кіба коротко киває Кіті."
    prose: |-
      За кілька хвилин у прорізі з’явилася Куренай.
      
      — Восьма.
      
      Хіната підвелася й поправила рукави. Шіно вже йшов до проходу. Кіба штовхнув стілець назад коліном і наздогнав їх між партами.
      
      Куренай рушила коридором.
      
      Кіба ступив за поріг, але на півкроку затримався. Озирнувся через плече.
      
      Кіта сидів біля спорожнілого сусіднього місця.
      
      Кіба коротко кивнув йому.
      
      Кіта відповів таким самим рухом.
      
      Кіба повернувся й зник за дверима разом із Куренай, Хінатою та Шіно.
      
      У класі стало тихіше. Порожні місця тепер тягнулися цілими шматками рядів.
    origin: "A"
    extent: "interval"
    display_rank: 200
