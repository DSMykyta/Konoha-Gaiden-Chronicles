  - id: "ev-y0-0122-naruto-prepares-trap"
      title: "Наруто готує пастку для Какаші"
      text: "Після виходу Команди 9 Наруто, Саске й Сакура залишаються чекати Какаші. Наруто готує пастку над дверима для запізнілого наставника."
      prose: |-
        Наруто кілька секунд дивився на зачинені двері.
        
        Потім підвівся, взяв стиранку для дошки й поставив її на верхній край дверей.
        
        Сакура дивилася на нього з-за парти.
        
        Саске сидів на місці.
        
        Наруто повернувся до них, широко посміхнувся й сів чекати.
      origin: "M"
      extent: "interval"
      display_rank: 550
      involvement:
        - entity_id: "c-naruto"
            role: "focus"
            mode: "physical"
        - entity_id: "c-sasuke"
            role: "participant"
            mode: "physical"
        - entity_id: "c-sakura"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-7"
      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-raido-question"
      title: "Райдо звертається до Сакури"
      text: "Райдо входить до класу, питає «Дев’ята?», а Сакура відповідає: «Сьома»."
      prose: |-
        Минуло ще трохи часу.
        
        Двері знову відчинилися. На порозі з’явився Райдо. Погляд ковзнув по тих, хто лишився.
        
        — Дев’ята?
        
        Сакура, сидячи біля Саске й Наруто, підняла руку.
        
        — Сьома.
        
        Райдо перевів погляд далі в клас.
      origin: "P"
      extent: "interval"
      display_rank: 400
      involvement:
        - entity_id: "c-raido"
            role: "focus"
            mode: "physical"
        - entity_id: "c-sakura"
            role: "focus"
            mode: "physical"
      evidence_ids:
        - "evd-raido-question"
  - id: "ev-y0-0122-team9-departs"
      title: "Райдо забирає Команду 9"
      text: "Райдо знаходить Кіту, Рена й Сору та веде Команду 9 з аудиторії."
      prose: |-
        Кіта підвівся. За ним зі своїх місць встали Рен і Сора; Сора прибрала блокнот.
        
        Райдо відступив від дверей, пропускаючи їх у коридор.
        
        — За мною.
        
        Кіта вийшов першим. Рен рушив за ним, Сора — останньою.
        
        Райдо зачинив двері.
        
        У класі залишилися Наруто, Саске й Сакура.
      origin: "P"
      extent: "interval"
      display_rank: 500
      involvement:
