  - id: "ev-y0-0122-trap-hits-kakashi"
    title: "Пастка Наруто спрацьовує на Какаші"
    text: "Коли Какаші відчиняє двері класу, підготовлена Наруто пастка спрацьовує: стиранка для дошки падає Какаші на голову."
    prose: |-
      Стиранка зірвалася згори й глухо вдарила Какаші по голові, після чого відскочила на підлогу.

      Наруто зігнувся навпіл від реготу.

      — Попався!

      Сакура підскочила.

      — Сенсей! Це він! Я казала йому не робити цього!

      Саске лишився сидіти.

      Какаші подивився на стиранку біля ноги, потім на Наруто, Сакуру й Саске. Наруто ще хихикав.

      Какаші нахилився, підняв стиранку й поклав її на найближчу парту.

      У класі стало тихо.
