    title: "Команда 7 виходить із Какаші"
    text: "Какаші забирає Наруто, Саске й Сакуру з класу."
    prose: |-
      Какаші затримав погляд на трійці ще секунду.
      
      — За мною.
      
      Він розвернувся й пішов коридором.
      
      Саске встав першим. Сакура відразу рушила за ним.
      
      Наруто вискочив із-за парти й наздогнав їх уже біля дверей.
      
      За мить клас спорожнів остаточно.
      
      Двері лишилися відчиненими, а кроки нової Команди 7 віддалялися коридором.
