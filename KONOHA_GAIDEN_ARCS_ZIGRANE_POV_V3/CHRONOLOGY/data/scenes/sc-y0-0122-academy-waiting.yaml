  - id: "ev-y0-0122-raido-question"
    title: "Райдо звертається до Сакури"
    text: "Райдо входить до класу, питає «Дев’ята?», а Сакура відповідає: «Сьома»."
    prose: |-
      Час ішов. Наруто сповзав дедалі нижче по спинці стільця, Сакура сиділа, підперши щоку долонею, Саске дивився у вікно.

      Кіта, Рен і Сора лишалися в іншій частині класу. Блокнот Сори лежав відкритим на парті.

      У коридорі зупинилися кроки, двері відсунулися. На порозі стояв Райдо.

      Він обвів поглядом тих, хто залишився.

      — Дев’ята?

      Сакура підняла руку.

      — Сьома.

      Райдо перевів очі далі.
