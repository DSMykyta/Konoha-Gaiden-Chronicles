      title: "Команда 7 виходить із Какаші"
      text: "Какаші забирає Наруто, Саске й Сакуру з класу."
      prose: |-
        Какаші розвернувся в коридор.
        
        — За мною.
        
        Саске підвівся першим. Сакура швидко пішла слідом. Наруто вискочив із-за парти останнім.
        
