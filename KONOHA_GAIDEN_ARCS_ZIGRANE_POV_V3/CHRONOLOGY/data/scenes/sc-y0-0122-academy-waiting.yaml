  - id: "ev-y0-0122-team10-departs"
    title: "Асума забирає Команду 10"
    text: "Асума забирає Іно, Шикамару й Чоджі з класу."
    prose: |-
      Першим наставником у дверях з’явився Асума. Він сперся плечем об одвірок.

      — Команда десять.

      Іно підвелася так швидко, що стілець від’їхав назад. Чоджі скрутив пакет із чипсами й сховав у кишеню, Шикамару встав останнім.

      Асума відступив у коридор. Іно пройшла першою, Чоджі за нею; Шикамару, вже виходячи, позіхнув у кулак.

      Двері лишилися відчиненими.
