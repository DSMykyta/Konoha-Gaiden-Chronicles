events:
  - id: "ev-y0-0122-team10-departs"
    title: "Асума забирає Команду 10"
    text: "Асума забирає Іно, Шикамару й Чоджі з класу."
    prose: |-
      Першим наставником, що з’явився в дверях, був Асума.
      
      Він сперся плечем об одвірок і обвів клас поглядом.
      
      — Команда десять.
      
      Іно підвелася так швидко, що стілець від’їхав назад. Чоджі скрутив пакет із чипсами й сховав у кишеню. Шикамару встав останнім.
      
      Асума відступив у коридор.
      
      Іно пройшла повз нього першою, Чоджі за нею. Шикамару, вже виходячи, позіхнув у кулак.
      
      Двері лишилися відчиненими.
    origin: "A"
    extent: "interval"
    display_rank: 100
    involvement:
