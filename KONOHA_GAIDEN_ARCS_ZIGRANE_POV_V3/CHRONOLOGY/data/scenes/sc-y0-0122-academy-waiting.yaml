  - id: "ev-y0-0122-team9-departs"
    title: "Райдо забирає Команду 9"
    text: "Райдо знаходить Кіту, Рена й Сору та веде Команду 9 з аудиторії."
    prose: |-
      Кіта вже підводився. Рен засунув руки в кишені й вийшов із-за парти; Сора закрила блокнот, сховала олівець і встала останньою.

      Райдо відступив убік.

      — За мною.

      Кіта пройш у коридор, Рен рушив слідом, Сора вийшла за ними. Райдо зачинив двері.

      У класі лишилися Наруто, Саске й Сакура. Наруто ще кілька секунд дивився на двері.
