  - id: "ev-y0-0122-team8-departs"
      title: "Куренай забирає Команду 8"
      text: "Куренай забирає Хінату, Кібу й Шіно з класу; перед виходом Кіба коротко киває Кіті."
      prose: |-
        Наступною в клас зайшла Куренай.
        
        — Команда вісім.
        
        Хіната підвелася. Шіно мовчки рушив до проходу. Кіба зіскочив із місця й пішов за ними.
        
        Уже біля дверей він обернувся до Кіти й коротко кивнув.
        
        Потім вийшов услід за Куренай.
        
        У класі стало помітно вільніше.
      origin: "A"
      extent: "interval"
      display_rank: 200
      involvement:
