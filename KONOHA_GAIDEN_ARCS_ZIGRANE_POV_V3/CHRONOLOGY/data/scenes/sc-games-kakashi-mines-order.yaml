  title: Хірузен доручає Какаші приховано зруйнувати шахти найманців Іви
  text: 'На основі розвідданих Коноха встановлює місце перебування найманців Іви в покинутих шахтах біля кордону Трави. Відкритий удар може стати приводом до війни. Хірузен доручає Какаші провести диверсію без видимих ознак участі селища: обвал має виглядати як зсув ґрунту та внутрішній хаос табору. Ібікі залучає Мікату до прихованої частини операції.'
