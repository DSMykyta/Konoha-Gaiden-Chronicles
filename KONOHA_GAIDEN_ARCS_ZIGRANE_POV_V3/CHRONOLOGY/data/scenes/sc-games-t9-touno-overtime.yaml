  text: Після ранкового прополювання Тоуно вимагає ще одне завдання понад оголошений час. Кіта першим відмовляється й іде, бо має погоджене заняття з Асумою. Сора посилається на пункт 4.12 про заздалегідь визначений графік, а Рен підтримує напарників. Трійка залишає місце роботи разом. Тоуно не може замінити попередню домовленість новою вимогою без їхньої згоди.
