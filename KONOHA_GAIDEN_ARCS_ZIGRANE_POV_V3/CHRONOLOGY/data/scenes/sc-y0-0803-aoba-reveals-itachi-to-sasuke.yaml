    text: "Після бою з Акацукі Саске приходить провідати непритомного Какаші. Ґай, Асума й Куренай свідомо не хочуть говорити йому, що Ітачі повернувся до Конохи. У цей момент Аоба заходить до кімнати й уголос питає, чи правда, що Ітачі Учіха повернувся й полює на Наруто. Він одразу розуміє, що сказав це при Саске, але вже запізно."
