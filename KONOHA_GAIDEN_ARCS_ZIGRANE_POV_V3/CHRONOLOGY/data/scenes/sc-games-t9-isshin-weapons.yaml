  text: 'Іщін готує для Рена парні сокири, для Сори — ніж під ліву руку, а для Кіти — легкий прямий клинок із порожнистою конструкцією. Вибір спирається на хват, рух і особливості кожного учня. Райдо не змушує трьох битися однаково: нова зброя має підтримати їхні відмінності та дати основу для подальших спільних вправ.'
