  title: Іщін приносить Команді 9 власну зброю
  text: Іщін приходить на тренувальне поле з трьома пакунками. Рен отримує пару коротких сокир, Сора — ніж під ліву руку, Кіта — легкий порожнистий прямий меч. Коваль врахував їхні руки й манеру рухатися. Райдо перевіряє баланс і пояснює, як доглядати за зброєю; після проб із позиченими клинками трійка може будувати прийоми зі своїми інструментами.
