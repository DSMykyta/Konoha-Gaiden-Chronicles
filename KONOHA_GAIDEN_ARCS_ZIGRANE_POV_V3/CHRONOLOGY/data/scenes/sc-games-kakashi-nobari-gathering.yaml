  title: Друзі збираються в Нобарі й говорять про закритий наказ Команди 9
  text: Куренай забирає Какаші з квартири на зустріч у Нобарі, де вже сидять Райдо й Асума. Нобарі не знаходить у відкритих реєстрах маршрут Команди 9 та переказує розмову з Юмеко Ямано про зникле фінансування. Какаші пропонує використати перевірку бюджету Нобу як формальний привід для втручання Цунаде. Дорослі складають план тиску на адміністрацію, проте місця перебування трійки досі не знають.
