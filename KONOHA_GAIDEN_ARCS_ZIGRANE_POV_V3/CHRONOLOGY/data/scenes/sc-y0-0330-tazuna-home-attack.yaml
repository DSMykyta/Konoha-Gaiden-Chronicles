  legacy_ids:
  - V10-000032
  title: Наруто рятує Інарі й Цунамі
  text: "Наруто, який дорогою знайшов пораненого дикого кабана й зарубані дерева та простежив сліди нападників до будинку, встигає завадити викраденню Цунамі. Він використовує техніку заміщення, звільняє матір Інарі та знешкоджує обох людей Ґато. Перед тим як поспішити на міст, Наруто вибачається перед Інарі за образу й визнає, що хлопець виявив справжню мужність."
