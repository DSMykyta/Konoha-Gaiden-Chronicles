  title: Інарі стає на захист Цунамі
  text: "Почувши намір викрасти матір, Інарі згадує Кайзу, який ризикував собою заради інших, і докори Наруто. Попри страх він вибігає назустріч озброєним найманцям, вимагаючи відпустити Цунамі. Його сміливість відволікає нападників і дає Наруто нагоду втрутитися."
