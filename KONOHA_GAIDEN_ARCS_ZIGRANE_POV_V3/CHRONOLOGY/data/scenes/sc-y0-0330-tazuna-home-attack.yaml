  title: Люди Ґато викрадають Цунамі
  text: "Поки Какаші, Саске й Сакура охороняють Тадзуну на мосту, двоє найманців Ґато приходять до його дому, щоб забрати в заручники Цунамі. Вараджі й Зорі погрожують Інарі мечами. Щоб урятувати сина, Цунамі готова пожертвувати собою та погоджується піти з ними; чоловіки не бачать у хлопчику небезпеки."
