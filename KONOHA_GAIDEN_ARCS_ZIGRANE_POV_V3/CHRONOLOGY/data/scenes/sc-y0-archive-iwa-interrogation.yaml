- id: ev-y0-mikata-interrogates-iwa-contact
  title: Міката допитує зв’язкового Іви
  text: 'Міката працює зі шпигуном, якого взяли на передачі архівних документів. Його метод зосереджений на психологічному зламі: полонений поступово втрачає впевненість, здатність чинити спротив і опору на власну роль ворожого оперативника. Ібікі контролює отримання та перевірку потрібних Конохі відомостей. Видимих каліцтв для цього не завдають, але наслідки допиту залишаються глибокими: саме в такому покірному й наляканому стані чоловіка згодом побачить Команда 7.'
