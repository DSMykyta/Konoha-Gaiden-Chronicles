- id: ev-y0-archive-detainees-delivered-to-ibiki
  title: Оперативники передають затриманих Ібікі
  text: 'Вилучені документи та затриманих доставляють із архіву до Відділу розвідки та допитів. Ібікі приймає справу старшої архівістки й зв’язкового Іви, звіряє матеріали операції та розділяє їхню подальшу обробку. Шпигуна залишають у тимчасовому утриманні, а роботу з ним отримує Міката. Генінів до цієї частини справи не залучають: зв’язкового спочатку потрібно допитати й лише потім вирішувати його подальшу долю.'
