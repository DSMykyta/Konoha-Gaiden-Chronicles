- id: ev-y0-0706-shikamaru-defeats-kin
  legacy_ids:
  - V10-000046-G
  title: Шикамару перемагає Кін
  text: Кін уникає Тіньового наслідування й атакує Шикамару сенбонами з дзвіночками, використовуючи звук для ґенджюцу.
    Шикамару подовжує свою тінь уздовж тіні нитки, яку тримає Кін, і захоплює її. Він кидає сюрикен та відхиляється назад;
    змушена повторити рух, Кін ударяється головою об близьку стіну й непритомніє. Шикамару оголошують переможцем.
