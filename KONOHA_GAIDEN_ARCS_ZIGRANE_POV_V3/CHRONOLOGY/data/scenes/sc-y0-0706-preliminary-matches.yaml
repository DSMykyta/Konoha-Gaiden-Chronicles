- id: ev-y0-0706-sasuke-defeats-yoroi
  legacy_ids:
  - V10-000046
  title: Саске перемагає Йорої
  text: Проклята Печатка паралізує Саске й завдає сильного болю, коли він намагається формувати чакру, тому він не може
    покладатися на нінджюцу чи ґенджюцу. Йорої поглинає його чакру й отримує перевагу також у ближньому бою. Саске стримує
    печатку та перемагає новою комбінацією «Левове комбо», використовуючи тайджюцу. Анко спостерігає поруч із Хірузеном
    і вражена тим, що Саске здатен сам придушити печатку, подібну до її власної.
