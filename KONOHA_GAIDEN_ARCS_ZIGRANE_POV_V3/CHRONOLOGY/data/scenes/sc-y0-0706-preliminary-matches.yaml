  title: Темарі перемагає Тентен
  text: Тентен атакує метальною зброєю й технікою «Два дракони», а потім знову спрямовує зброю нитками. Темарі відбиває
    атаки вітром великого віяла, здіймає Тентен у вихор і змушує впасти на віяло. Тентен непритомніє; Темарі оголошують
    переможницею. Бакі спостерігає за виступом своєї учениці.
