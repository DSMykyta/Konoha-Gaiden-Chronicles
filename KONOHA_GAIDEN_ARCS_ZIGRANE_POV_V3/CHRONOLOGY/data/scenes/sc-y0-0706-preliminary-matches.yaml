  title: Канкуро перемагає Місумі
  text: Місумі обвиває супротивника гнучким тілом і намагається зламати йому шию, але замість Канкуро захопив маріонетку
    Карасу. Канкуро використовує близькість Місумі, щоб затиснути його маріонеткою та перемогти. Місумі виживає завдяки
    здатності вигинати тіло; Бакі спостерігає за виступом свого учня.
