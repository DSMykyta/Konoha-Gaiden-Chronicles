  title: Ґаара перемагає й тяжко травмує Лі
  text: У дев’ятому поєдинку автоматичний піщаний захист Ґаари відбиває атаки тайджюцу Лі. Лі знімає важкі обтяжувачі
    з ніг і завдяки збільшеній швидкості долає цей захист, але виявляє на тілі Ґаари ще й піщану броню. Лі підкидає супротивника
    серією ударів і застосовує Передній лотос. Зрештою Ґаара перемагає та тяжко ушкоджує руку й ногу Лі; Бакі спостерігає
    за виступом свого учня.
