- id: ev-y0-0706-sakura-ino-double-ko
  legacy_ids:
  - V10-000046-E
  title: Сакура й Іно вибувають разом
  text: 'Сакура та Іно починають четвертий поєдинок, стримуючи удари, але після виклику Сакури переходять до серйозного
    бою. Іно зрізає волосся та використовує пасма з чакрою як пастку: удавано промахнувшись Перенесенням свідомості,
    заманює Сакуру в пута й захоплює її тіло другою спробою. Коли Іно намагається змусити її здатися, Наруто підбадьорює
    Сакуру, а та витісняє Іно зі своєї свідомості. Виснажені суперниці обмінюються останніми ударами й одночасно непритомніють.
    Хаяте оголошує, що жодна не проходить далі.'
