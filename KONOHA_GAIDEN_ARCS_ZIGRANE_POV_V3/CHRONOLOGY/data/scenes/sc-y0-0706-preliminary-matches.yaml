- id: ev-y0-0706-naruto-defeats-kiba
  legacy_ids:
  - V10-000046-H
  title: Наруто перемагає Кібу
  text: 'Кіба й Акамару атакують Наруто, використовуючи димові бомби, бойові пігулки, звірині перетворення та «Ікло за
    іклом». Наруто протидіє клонами й перетвореннями: спершу маскується під Акамару, а пізніше під прикриттям диму набуває
    вигляду третього Кіби та змушує супротивника вдарити справжнього Акамару. Кіба продовжує тиснути швидкістю, але Наруто
    випадково пускає гази перед його обличчям, приголомшуючи загострений нюх. Наруто завершує бій «Комбо Наруто Узумакі»
    з тіньовими клонами, створеним за зразком переможної комбінації Саске.'
