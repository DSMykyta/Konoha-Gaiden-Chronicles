- id: ev-y0-0706-neji-defeats-hinata
  legacy_ids:
  - V10-000046-I
  title: Неджі тяжко ранить Хінату
  text: У восьмому поєдинку Неджі намагається переконати Хінату здатися, але підтримка Наруто допомагає їй продовжити
    бій. Обоє використовують Б’якуґан і М’який кулак. Неджі перекриває точки чакри на її руках, роблячи її удари неефективними,
    та тяжко ранить її, але Хіната знову підводиться. Після її слів про долю побічної гілки Неджі намагається завдати
    смертельного удару; Какаші, Куренай, Ґай і Хаяте зупиняють його. Хіната падає із зупинкою серця, і медики забирають
    її для невідкладної допомоги. Наруто обіцяє перемогти Неджі.
