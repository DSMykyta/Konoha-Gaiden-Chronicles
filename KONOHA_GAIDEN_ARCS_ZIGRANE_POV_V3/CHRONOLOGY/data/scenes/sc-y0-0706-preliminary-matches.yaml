- id: ev-y0-0706-shino-defeats-zaku
  legacy_ids:
  - V10-000046-C
  title: Шіно перемагає Заку
  text: 'Заку атакує Шіно повітряними ударами з долоні однієї руки. Шіно оточує його комахами, змушуючи захищатися з
    двох боків. Заку дістає другу руку з перев’язі й намагається атакувати обома, але комахи вже перекрили трубки в його
    руках: тиск ушкоджує руки зсередини, і Шіно перемагає. В аніме руки залишаються на місці; манґа показує тяжче ушкодження.'
