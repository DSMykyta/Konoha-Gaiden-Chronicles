- id: ev-y0-0701-candidates-sign-waivers-receive-scrolls
  title: Кандидати підписують відмови від відповідальності й отримують сувої
  text: Анко вимагає від кожного кандидата підписати згоду, що Коноха та екзаменатори не відповідають за можливу смерть під
    час етапу. Після цього команди обмінюють форми на запечатані сувої Неба або Землі й розходяться до окремих воріт.
