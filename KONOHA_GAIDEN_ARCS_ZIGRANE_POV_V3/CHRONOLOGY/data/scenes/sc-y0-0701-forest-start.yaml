- id: ev-y0-0701-anko-cuts-naruto-shiore-returns-kunai
  title: Анко ранить Наруто; «Шіоре» повертає їй кунай
  text: Коли Наруто демонстративно заявляє, що Ліс Смерті його не лякає, Анко миттєво проводить кунаєм по його щоці й попереджає,
    що самовпевнені кандидати гинуть першими. Замаскований під геніна Трави Шіоре Орочімару підходить ззаду й повертає Анко
    її кунай — їхня перша пряма зустріч на цьому іспиті.
