description: >-
  Хірузен повідомляє наставникам, що за сім днів почнеться іспит на чуніна.
  Перед ним виступають Какаші, Куренай і Асума: кожен рекомендує свою
  команду — 7, 8 і 10 відповідно. Ірука заперечує проти висунення
  дев’яти недавніх випускників Академії. Какаші пояснює, що вони вже
  не учні Іруки, а шинобі під його командуванням; Хірузен погоджується.
description_project: >-
  У версії Конохи з Командою 9 на цій самій нараді Райдо окремо
  висуває Кіту, Рена й Сору. Це проєктне доповнення до канонічної
  сцени, а не подія з манґи чи аніме.
