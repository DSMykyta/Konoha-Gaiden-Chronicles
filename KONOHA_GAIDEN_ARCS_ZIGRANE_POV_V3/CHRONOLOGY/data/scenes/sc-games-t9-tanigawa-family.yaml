  title: Іщін приймає Кіту й Рена після Таніґави
  text: Після повернення й миття вдома в Нобарі Кіта та Рен приходять ночувати до Іщіна. Батько годує їх і розпитує про вагу, яку Рен несе на місіях; хлопці пояснюють, як команда враховує це в своїх планах. Уночі Рен зізнається Кіті, що боїться і завданих знайомим ран, і можливої нездатності захистити друзів наступного разу. Вони обіцяють не губити й прикривати одне одного.
