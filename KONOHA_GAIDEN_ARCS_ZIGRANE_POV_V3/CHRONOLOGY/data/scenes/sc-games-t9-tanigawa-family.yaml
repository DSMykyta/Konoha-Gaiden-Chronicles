  text: Після повернення трійка проходить звичайний домашній догляд і збирається на вечерю в Іщіна. Розмова про вагу Кіти й Сори та можливість Рена переносити обох повертає їх до конкретної турботи про команду. Вночі хлопці обговорюють поранення знайомого Котецу й обіцяють захищати одне одного. Сора окремо йде стежити за поверненням Анко до службового звіту.
