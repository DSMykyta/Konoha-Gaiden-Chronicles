  text: Юміко повертається від батьків і приходить обідати до забігайлівки. Побачивши її, Какаші ховає жилет і зброю та повертається до столу без бойового спорядження. Він відкриває обличчя, спершу помилково приймає її ніяковість за страх і нарешті починає розмову. Хоча ім’я вже знає від Сакури, він дає Юміко представитися самій, розповідає про нінкенів, оплачує обидва обіди й називає свої звичні дні — вівторок та п’ятницю.
