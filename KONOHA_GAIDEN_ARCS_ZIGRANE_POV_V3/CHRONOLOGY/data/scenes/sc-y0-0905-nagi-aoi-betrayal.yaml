    text: "Ідате пояснює, чому ненавидить шинобі. Під час давнішого іспиту на чуніна його старший брат Ібікі був екзаменатором і поставив команді жорстке фінальне випробування; Ідате обрав особистий шанс на підвищення всупереч інтересам товаришів, після чого Ібікі провалив усю команду й сказав, що Ідате не готовий бути шинобі. Скориставшись його відчаєм, наставник Аої переконав Ідате викрасти секретний сувій і Меч Бога Грому, пообіцявши підвищення. Коли Аої втік до Аме, Ібікі з двома АНБУ переслідував їх; людей Ібікі вбили, самого Ібікі схопили й катували заради відомостей із сувою. Ібікі допоміг братові втекти, але пожежа розділила їх, і Ідате вважав, що залишив брата помирати."
