  - id: "ev-y0-0122-kita-talks-with-mother"
    title: "Кіта розповідає матері про Райдо"
    text: "Кіта Хаяші каже Нобарі Хаяші, що наставником Команди 9 став Райдо Наміаші. Нобарі щиро радіє за сина, але дивується самому призначенню: Райдо служив в охороні Хокаґе, тому вона не очікувала, що його знімуть із цієї роботи й дадуть команду генінів."
    prose: |-
      Нобарі Хаяші повернулася пізно. Вона ще не встигла як слід роззутися, а вже принесла на кухню кілька грубих папок і розклала їх біля тарілки. Кіта Хаяші поставив перед нею вечерю й сів навпроти.

      Вона перегортала сторінки майже машинально, поки не згадала про розподіл.

      — А хто в тебе сенсей?

      — Райдо Наміаші.

      Папка вислизнула з її руки й глухо впала на підлогу.

      Нобарі кілька секунд дивилася на Кіту, наче перевіряла, чи правильно почула, а тоді втома на її обличчі раптом поступилася широкій усмішці.

      — Райдо? Серйозно? Оце тобі пощастило. Він дуже класний.

      Вона нахилилася, підняла папку, але вже не відкрила її. Усмішка лишилася, зате в погляді з’явилося здивування.

      — Тільки це дивно. Він же в охороні Хокаґе. Я була певна, що він там і залишиться.

      Нобарі задумливо постукала пальцями по обкладинці.

      — Виходить, його зняли з поста й дали учнів... Не схоже на випадкове призначення.

      Кіта згадав спокійний голос Райдо в крамниці данґо й те, як легко той називав речі про їхні родини, яких ніхто йому сьогодні не розповідав.

      — Він сказав, що знає тебе. Що ви вчилися разом.

      Нобарі тихо засміялася.

      — Знає. І я його знаю. Тому й кажу: з наставником тобі пощастило.

      Після цього Кіта вже розповів про Команду 9 і про те, як Райдо поводився з ними. Нобарі слухала уважніше, ніж читала принесені додому звіти, час від часу усміхаючись, але до дивного переведення Райдо з охорони Хокаґе ще кілька разів поверталася подумки.
