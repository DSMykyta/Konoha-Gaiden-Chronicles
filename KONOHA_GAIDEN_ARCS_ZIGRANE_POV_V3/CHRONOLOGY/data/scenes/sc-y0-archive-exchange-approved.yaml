  title: Коноха й Іва погоджують обмін шпигуна
  text: 'Надходить остаточне підтвердження угоди з Івою: полоненого передадуть на північному кордоні Країни Вогню, а представники Країни Землі віддадуть погоджений запечатаний сувій. Хірузен затверджує службовий протокол, Ібікі передає підготовку полоненого його куратору Мікаті. Чоловік залишається ізольованим у чакроподавлюючих кайданках. Наступного ранку Команда 7 отримає офіційне доручення на конвой; учні ще не знають, як саме цього шпигуна знайшли й допитали.'
