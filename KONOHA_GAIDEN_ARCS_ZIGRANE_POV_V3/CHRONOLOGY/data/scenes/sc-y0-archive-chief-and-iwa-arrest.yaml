- id: ev-y0-archive-chief-and-iwa-contact-arrested
  title: Міката затримує старшу архівістку та зв’язкового Іви
  text: Коли старша архівістка та зв’язковий знову сходяться для передачі документів, Міката й чуніни ізолюють їх у межах перекритого корпусу. Сувій і пов’язані матеріали вилучають як докази; сховати папери або піти через зовнішні виходи вже неможливо. Зв’язкового беруть живим і встановлюють його роль у отриманні закритих даних. Старшу архівістку затримують як джерело витоку, а решту працівниць відводять для окремої перевірки участі.
