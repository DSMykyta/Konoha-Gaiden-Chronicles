  text: Після трьох тижнів лікування Анко повертається до трійки й читає рапорти про роботу з Тоуно, його відмову та тимчасові місії з іншими командами. На спільному фото Сора наполягає, щоб залишитися з блокнотом у руках; Анко приймає знімок. Учні показують нові прийоми й підміну людей. Анко бачить результати додаткових занять і дозволяє Кіті продовжувати уроки Асуми, а команді — корисну роботу з Куренай.
