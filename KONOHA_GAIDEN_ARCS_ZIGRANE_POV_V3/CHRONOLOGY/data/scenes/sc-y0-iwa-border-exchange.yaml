  title: Команда 7 проводить обмін із шинобі Іви
  text: Уночі команда доходить до погодженої точки на північному кордоні й зустрічає двох шинобі Іви. Какаші передає їм полоненого й ключ від кайданок, натомість отримує запечатаний сувій. Представники Іви бачать стан свого шпигуна, але обмін проходить без розмов і без конфлікту. Очікуваного нападу Кореня не стається. Після завершення процедури Какаші відводить команду на кілька кілометрів від кордону для ночівлі.
