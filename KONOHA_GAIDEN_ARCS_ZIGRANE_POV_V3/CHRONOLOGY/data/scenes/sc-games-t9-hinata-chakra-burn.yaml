  title: Хіната допомагає побачити чакру під час нових опіків Кіти
  text: Кіта пробує підпалити стовп без вогняної кулі й обпалює власні долоні. Куренай охолоджує руки й просить Хінату простежити повторну слабку спробу Б’якуґаном. Хіната бачить чакру в долонях та на стовпі без видимого каналу між ними; чакра на цілі зникає, і руки знову спалахують. Куренай припиняє вправу й веде Кіту до шпиталю. Механізм лишається нез’ясованим.
