description: >-
  На порозі письмового етапу Команди 7, 8 і 10 зустрічаються
  з іншими кандидатами. Кабуто знайомить новачків із суперниками
  через картки з інформацією. Наруто голосно обіцяє перемогти всіх;
  після цього команда Звуку атакує Кабуто, а Ібікі припиняє сутичку
  й починає іспит.
description_project: >-
  Кіта, Рен і Сора з Команди 9 перебувають серед тих самих кандидатів.
  Вони проходитимуть письмовий етап одночасно з іншими генінами.
