    text: "Після того як Наруто відмовляється відступати й решта кандидатів лишається, Ібікі оголошує, що десятого письмового питання не існувало. Він знімає пов’язку й показує шрами від тортур на голові, пояснюючи, чому інформація на місії може коштувати життя. Перші дев’ять завдань перевіряли здатність добувати її непомітно, а десяте — сам вибір під тиском: чунін мусить ухвалювати рішення, навіть коли ставка — життя команди й невідомі наслідки."
