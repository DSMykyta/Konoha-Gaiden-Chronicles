  text: 'Команда 9 знаходить шинобі Дощу, які вже виснажені попереднім боєм. Сора відволікає їх рикошетами кунаїв, Рен створює приманку, а Кіта переміщується до сувою й забирає його. Трійка відходить, уникаючи затяжної сутички. Здобич виявляється ще одним небесним сувоєм: для проходження етапу їм досі потрібен земний.'
