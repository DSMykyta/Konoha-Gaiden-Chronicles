  text: Команда передає чиновника та документи в адміністративній будівлі прикордонного міста й отримує акт виконання. Какаші знімає дві кімнати в рьокані та вирішує повертатися вранці. За вечерею Сора й Кіта віддають Ренові частину своїх великих порцій. Капітан спостерігає за звичним побутом трійки й поступово переглядає попередню оцінку їхньої замкненості.
