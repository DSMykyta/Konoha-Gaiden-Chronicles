- id: ev-y0-specialists-identify-protected-stolen-materials
  title: Фахівці знаходять викрадені матеріали під небезпечним забрудненням
  text: У захищеній лабораторії коробки перевіряють окремо від старих медичних бірок. Серед вмісту виявляють приховані пакети закритих архівних матеріалів; їхні ознаки обліку не відповідають вантажу часів евакуації К-12. Небезпечне забруднення було використане навмисно, щоб захистити схованку від стороннього втручання, тому проведене для Команди 9 знезараження було необхідним. Медики передають інспектору висновок і безпечні для звірки відомості про документи. Походження схованки стає предметом службового розслідування, а не новим дорученням генінам.
