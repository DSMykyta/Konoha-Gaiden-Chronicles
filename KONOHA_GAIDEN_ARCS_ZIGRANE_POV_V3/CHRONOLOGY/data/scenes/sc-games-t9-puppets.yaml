  title: Команда 9 вчиться керувати механічними ляльками
  text: |-
    Райдо ставить на траву три дерев'яні навчальні маріонетки з простими шарнірами та хрестовинами керування.

    — Координація пальців. Сьогодні без кунаїв.

    Кіта захоплюється одразу: у ляльки окремо рухаються кисті, лікті й коліна, але посадити її так, щоб вона не впала, виявляється непросто. Сора за кілька хвилин складає рухи в послідовність. Рен тримається, доки його маріонетка втретє не ляскає себе дерев'яною долонею по обличчю.

    — Та СТІЙ ти!

    Він смикає хрестовину. Ліва рука ляльки хрускає в лікті й повисає.

    — ТЕЦУ! Це казенне спорядження! За це ПЛАТИТИ треба!

    Рен одразу перестає злитися. Дивиться на зламаний шарнір, потім на Райдо.

    — Я не хотів.

    Райдо ще мить стоїть із відкритим ротом. Видихає, забирає ляльку й починає складати уламки.

    — Бачу, що не хотів.

    Рен стоїть так, ніби вже готовий віддати всі свої майбутні місійні гроші. Райдо бурмоче собі під ніс:

    — Все. Більше не буду вам круті штуки показувати. Ви їх ламаєте.

    — Я один зламав, — тихо каже Рен.

    — Оце зараз узагалі не допомогло.
