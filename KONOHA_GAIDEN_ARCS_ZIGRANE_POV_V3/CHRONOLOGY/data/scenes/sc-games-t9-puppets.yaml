  text: 'Райдо приносить навчальні механічні ляльки й задає вправи на точні рухи пальців. Кіта добре відчуває тонке керування, Сора уважно перевіряє механізм, а Рен ламає державний інвентар надмірним зусиллям. Райдо зупиняє його: силу потрібно дозувати, а пошкоджене майно доведеться врахувати. Вправа показує різницю між грубою потужністю й точністю.'
