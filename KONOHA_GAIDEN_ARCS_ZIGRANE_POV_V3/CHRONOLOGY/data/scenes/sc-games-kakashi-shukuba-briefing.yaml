  text: 'Команда 7 отримує C-рангове завдання з ризиком переходу в B: забрати носій інформації у агента в Шукубі. Через найманців і шпигунів у місті Хірузен наказує йти в цивільному одязі, сховати зброю та прибрати ознаки шинобі. Какаші відповідає за маскування, зв’язок і відхід. Група має вийти за годину.'
