description: >-
  Ізумо й Котецу не пускають кандидатів до нібито екзаменаційної зали, приховавши гендзюцу справжній поверх. Команда 7 помічає обман; після спроби Саске пройти крізь заставу Рок Лі перериває бій і звертається до Сакури. Коли Команда 7 відходить, перевіряльники лишаються в коридорі й обговорюють кандидатів окремо.
