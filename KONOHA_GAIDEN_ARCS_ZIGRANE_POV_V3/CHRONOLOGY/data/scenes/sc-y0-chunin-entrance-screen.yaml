  title: Рок Лі зупиняє сутичку біля реєстрації
  text: Ізумо й Котецу, замасковані під генінів, не пропускають кандидатів та відмовляють їх від іспиту. Команда Ґая спершу
    вдає безпорадність. Команда 7 розпізнає гендзюцу, що приховує справжній поверх. Саске й Котецу переходять до ударів, але
    Рок Лі зупиняє обох. Лі пропонує Сакурі зустрічатися й отримує відмову. Коли Команда 7 іде далі, перевіряльники знімають
    маскування й відзначають здібності кандидатів.
