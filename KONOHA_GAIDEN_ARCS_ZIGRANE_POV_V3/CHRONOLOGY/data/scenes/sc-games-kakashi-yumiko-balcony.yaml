  title: Какаші знаходить порожній балкон Юміко
  text: На третій день безрезультатного пошуку Какаші піднімається на балкон Юміко. Світло не горить, двері зачинені; біля порожнього крісла лишилася ковдра. Він не знаходить її й іде далі. Звичні спостереження шинобі не допомогли встановити контакт із жінкою, і цього вечора він звертається по пораду до Шікаку.
