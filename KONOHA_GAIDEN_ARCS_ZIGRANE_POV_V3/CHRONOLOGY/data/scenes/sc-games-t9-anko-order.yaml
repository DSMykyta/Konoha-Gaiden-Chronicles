  text: Після похорону Хірузена адміністрація виконує залишене ним запечатане розпорядження. Команду 9 передають від Райдо до Анко. Для учнів це зміна реального щоденного командира, а не чергова тимчасова заміна на полігоні. Райдо повертається до своїх службових обов’язків; трійка мусить пристосувати вже сформовану взаємодію до іншої манери керівництва.
