- id: ev-y0-team9-sorts-technical-archive
  title: Команда 9 звіряє коробки й переносить стелажі
  text: Райдо й Рен пересувають важкі дубові стелажі, звільняючи проходи між рядами. Кіта маркує тридцять коробок і звіряє дати та номери партій із реєстраційним списком, а Сора веде записи й вчитується навіть у старі господарські накладні. Райдо пояснює, що тут зберігають звіти про ремонти, списання зброї та постачання, які переносять униз, щоб звільнити верхні рівні. Після зсуву меблів відкривається доступ до прилеглого сектора 3-Б, якого немає в їхньому робочому наряді.
