  title: Команда 9 тяжко ранить шинобі в постановочній засідці
  text: Трійка виявляє прихованих нападників у котячих масках і б’є до того, як Анко подає очікуваний сигнал. Удари завдають тяжких травм Ґенмі, Котецу й Ізумо. Кіта та Сора надають медичну допомогу, поки Рен переживає власну участь у нападі. До евакуації залучають АНБУ. Навчальна засідка більше не виглядає безпечною вправою для жодної зі сторін.
