- id: ev-y0-team9-finds-archive-cache
  title: Команда 9 виявляє небезпечну схованку в секторі 3-Б
  text: За старим стелажем команда знаходить потемнілу коробку з медичним маркуванням К-12 — року нападу Дев’ятихвостого. Райдо оглядає ремінець і плями на кришці, накладає карантинний талісман і наказує не відкривати вміст. Кіта позначає біологічну небезпеку, Сора записує місце знахідки, а Рен ліхтариком перевіряє нішу, не торкаючись підозрілих речей. Після обережного розвантаження стелажа вони бачать ще три коробки з бірками евакуаційного медичного вантажу. Райдо опечатує їх і через архіваріуса викликає госпітальну групу. Учні бачать реальну карантинну загрозу; що саме ховається під старим маркуванням, ще має встановити перевірка.
