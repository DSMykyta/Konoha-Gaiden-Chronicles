- id: ev-y0-sora-stops-archive-disposal
  title: Сора виявляє нестачу вантажу й зупиняє списання
  text: 'Адміністраторка приходить із двома медиками й наказує припинити роботи в 3-Б. Сора показує їй дерев’яну бірку: у старому записі значаться п’ять одиниць тимчасового медичного вантажу, а перед ними лише чотири. Архіваріус запевняє, що ряд роками не чіпали. Тим часом із сусіднього коридору чути колеса візка з майном на списання, і Сора помічає в пилу смугу, що тягнеться від схованки саме туди. Адміністраторка негайно зупиняє вивезення. Райдо забирає учнів із сектора: подальша перевірка вантажу та обліку вже виходить за межі їхнього D-рангу.'
