- id: ev-y0-0801-naruto-defeats-neji
  legacy_ids:
  - V10-000064
  title: Наруто перемагає Неджі
  text: Наруто починає бій кунаями й прямою атакою; Неджі ухиляється та відповідає М’яким Кулаком. Він розбиває групи
    тіньових клонів і твердить, що доля визначається народженням. Наруто відмовляється здаватися та створює масових клонів.
    Наруто відтягує одного клона, обманюючи Неджі щодо справжнього тіла. Неджі відбиває атаки Обертанням і закриває чакрові
    точки Шістдесятьма Чотирма Долонями. Згадавши наполегливість Лі й Хінати, Наруто підводиться. Неджі показує прокляту
    печатку та пояснює підлеглість побічної гілки Хюґа й своє бачення смерті батька. Згодом Наруто відновлює доступ до
    чакри Дев’ятихвостого, використовує атаку з-під землі й перемагає Неджі.
  origin: M
