  title: Ґенма проводить фінальну частину іспиту
  text: Після загибелі Хаяте фінал проводить Ґенма. Наруто помічає відсутність Саске, а Шикамару — Досу; Ґенма оголошує
    перший бій Наруто проти Неджі.
