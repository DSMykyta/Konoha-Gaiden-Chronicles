title: "Родина Хаку гине через страх перед його спадковою силою"
description: "Відлюдне поселення Країни Води пам'ятає жахи міжусобних воєн і боїться носіїв кеккей-ґенкай. Мати Хаку приховує від чоловіка свою здатність створювати кригу. Коли малий Хаку показує, що успадкував цей дар, батько вбиває дружину і намагається вбити сина, але наляканий хлопчик мимоволі застосовує свою силу й убиває батька. Залишившись сиротою, Хаку не бачить сенсу в житті, доки не зустріне Забузу."
