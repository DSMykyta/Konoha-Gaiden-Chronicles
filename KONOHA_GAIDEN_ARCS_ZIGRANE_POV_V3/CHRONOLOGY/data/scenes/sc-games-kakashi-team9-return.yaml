  title: Команда 9 завершує ескорт і швидко повертається з Какаші
  text: Після ночівлі група повертається до Конохи без чиновника й рухається значно швидше. Кіта оглядає маршрут після блінків у повітря, а Рен підхоплює його на падінні. На привалі вони діляться рисом із Какаші. З розмови капітан дізнається, що Кіта й Сора бережуть вагу для можливого відступу на плечах Рена, а не через встановлений ними ліміт техніки. Повернувшись, трійка готує звіт про ескорт.
