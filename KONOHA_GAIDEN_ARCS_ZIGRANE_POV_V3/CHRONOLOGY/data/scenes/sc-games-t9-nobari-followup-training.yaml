  title: Команди проводять спаринги без кланових технік
  text: На наступному спільному занятті Кіба стає проти Рена, Хіната — проти Сори, Шіно — проти Кіти. Рен перемагає
    Кібу, Хіната виграє в Сори й підтримує її після поєдинку, Шіно без комах перекриває Кіті шлях до центра. Куренай
    спостерігає збоку.
