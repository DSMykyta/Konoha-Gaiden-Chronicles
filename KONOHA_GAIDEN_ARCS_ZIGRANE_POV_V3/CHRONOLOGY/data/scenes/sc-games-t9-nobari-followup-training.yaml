  title: Сора веде звичайну програму трійки перед Куренай
  text: Після медичної місії Куренай просить Команду 9 показати звичайне самостійне тренування. Сора розподіляє
    вправи, чергує контроль, метання й спаринги. Рен зупиняється на її коротку команду, Кіта коригує політ куная
    чакрою. Куренай спостерігає й запитує, хто склав порядок.
