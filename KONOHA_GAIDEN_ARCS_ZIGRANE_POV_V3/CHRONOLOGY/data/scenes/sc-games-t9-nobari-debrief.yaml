  text: Після повернення Нобарі приходить до ізакаї й розповідає Куренай, Асумі та Райдо про роботу дітей у тимчасовому шпиталі. Вона дізнається про висоту неконтрольованого блінка на полі Асуми й лякається ризику, якого раніше не знала. Райдо вже знайомий із переміщеннями Кіти; він просить показати журнал Сори, щоб стежити за розвитком техніки після зміни наставника.
