    title: "Наруто випадково цілує Саске"
    text: "Перед розподілом Сакура й Іно сперечаються за місце біля Саске; Наруто залазить на парту й дивиться на нього впритул. Однокласник випадково зачіпає Наруто ззаду, той падає вперед і цілує Саске; дівчата в класі одразу зриваються на Наруто."
    prose: |-
      Клас Академії гудів ще до того, як почався розподіл. Стільці скреготіли по підлозі, хтось перегукувався через два ряди, біля парти Саске вже тіснилися дівчата.
      
      Сакура прослизнула вперед і відтиснула Наруто плечем.
      
      — Саске, я сяду поруч.
      
      — Ще чого! — Іно вклинилася збоку.
      
      За нею підтягнулися ще двоє. Саске сидів між ними, ліктями на парті, і не відповідав.
      
      Наруто обійшов натовп, поставив коліно на край парти й нахилився просто до Саске. Той підняв очі.
      
      Вони завмерли один навпроти одного.
      
      Хлопець із заднього ряду проходив між партами й зачепив Наруто спиною.
      
      Наруто хитнувся вперед.
      
      Гомін урвався.
      
      Їхні губи зіткнулися на одну коротку мить.
      
      Наруто й Саске відсахнулися одночасно. Саске різко витер рот рукавом. Наруто сповз із парти.
      
      Сакура повільно повернула до нього голову.
      
      Іно — слідом.
      
      — Наруто.
      
      Він устиг відступити на півкроку.
      
      За секунду його вже закрив натовп дівчат.
      
      Коли двері класу відсунулися, Наруто сидів на своєму місці з кількома ґулями на голові. Ірука зайшов зі списком у руці й зупинився біля кафедри.
