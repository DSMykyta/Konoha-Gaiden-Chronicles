    title: "Наруто випадково цілує Саске"
    text: "Перед розподілом Сакура й Іно сперечаються за місце біля Саске; Наруто залазить на парту й дивиться на нього впритул. Однокласник випадково зачіпає Наруто ззаду, той падає вперед і цілує Саске; дівчата в класі одразу зриваються на Наруто."
    prose: |-
      Клас гудів ще до початку розподілу: стільці шкребли підлогу, через ряди летіли репліки, біля парти Саске вже зібрався тісний півкруг. Сакура прослизнула вперед, відтиснувши Наруто плечем.
      
      — Саске, я сяду поруч.
      — Ще чого! — Іно вклинилася збоку.
      
      За нею підтягнулися ще кілька дівчат. Саске сидів між ними, сперши руки на парту, і мовчав. Наруто обійшов натовп, поставив коліно на край парти й нахилився до нього; Саске підняв очі, і вони на секунду завмерли майже впритул.
      
      Хтось проходив між рядами позаду Наруто й зачепив його спиною. Наруто хитнувся вперед. Гомін урвався. Їхні губи зіткнулися.
      
      Обидва відсахнулися. Саске різко витер рот рукавом, Наруто зісковзнув із парти. Сакура повільно повернула до нього голову, Іно — слідом.
      
      — Наруто.
      
      Він устиг відступити на півкроку, перш ніж дівчата зімкнулися навколо нього.
      
      Коли двері класу відсунулися, Наруто вже сидів на своєму місці з кількома ґулями на голові. Ірука зайшов зі списком у руці, дійшов до кафедри й поклав аркуш перед собою.
      
      — На місця.
