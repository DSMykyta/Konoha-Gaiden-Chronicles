    title: "Наруто випадково цілує Саске"
    text: "Перед розподілом Сакура й Іно сперечаються за місце біля Саске; Наруто, роздратований увагою дівчат до Саске, залазить на парту й дивиться на нього впритул. Однокласник випадково штовхає Наруто, той падає вперед і цілує Саске; дівчата в класі одразу зриваються на Наруто."
    prose: |-
      Клас ще не встиг стихнути після ранкового гамору. Сакура й Іно майже одночасно опинилися біля Саске й уже сперечалися, кому сидіти ближче. Саске не відповідав жодній. Він сидів, сперши руки на парту, з таким виглядом, ніби все це відбувалося десь не з ним.

      Наруто дивився на них через кілька рядів і хмурився дедалі сильніше. Нарешті не витримав, підійшов і заліз колінами на парту навпроти Саске.

      — Чого ти на мене витріщився? — холодно кинув Саске.

      Наруто нахилився ще ближче. Між ними лишилося кілька сантиметрів.

      Хтось позаду зачепив його спиною.

      Наруто хитнувся вперед.

      На мить у класі стало зовсім тихо.

      Потім він відсахнувся від Саске так різко, що ледь не злетів із парти. Саске витер рот рукавом. Сакура, Іно й решта дівчат одночасно повернулися до Наруто.

      — Наруто!

      Гамір вибухнув удруге — тепер уже навколо нього. Коли Ірука нарешті домігся тиші, Наруто сидів побитий і насуплений, а Саске дивився вперед так, ніби хотів стерти останні кілька хвилин із пам’яті.
