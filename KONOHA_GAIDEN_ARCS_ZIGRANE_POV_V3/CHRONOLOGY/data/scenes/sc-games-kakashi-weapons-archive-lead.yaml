  title: Какаші, Ібікі та Міката знаходять слід прихованого постачання
  text: Ібікі показує Какаші розшифровану схему постачання чакропровідної сталі та вибухових печаток. Гроші йдуть через приватні фонди у столиці, а товар повертається до Конохи під виглядом будівельних матеріалів. Міката пояснює, що чисті офіційні закупівлі не виключають підроблених цивільних дозволів, і пропонує перевірку під приводом розбіжностей у D-рангових звітах. Какаші погоджується зайти до архіву; результат цієї перевірки ще невідомий.
