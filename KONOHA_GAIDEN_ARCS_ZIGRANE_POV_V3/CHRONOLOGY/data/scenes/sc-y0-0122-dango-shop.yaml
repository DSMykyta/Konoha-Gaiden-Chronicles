  - id: "ev-y0-0122-dango-introductions"
    title: "Райдо розпитує Кіту, Рена й Сору"
    text: "За чаєм і данґо Райдо знайомиться з учнями ближче: розпитує їх про мотивацію та навички й без зайвого наголосу показує, що вже знає їхні родини — Юмеко Ямано як відому художницю, Ішіна Тецу як коваля, в якого замовляв зброю, а Нобарі Хаяші як свою колишню однокласницю."
    prose: |-
      Коли напруження навколо таці трохи спало, Райдо взяв чашку з чаєм і перевів погляд на Сору Ямано. Він не починав із формального представлення й не заглядав у папери — говорив так, ніби частину відповідей уже знав.

      — Твій батько тримає банк, — сказав він майже буденно. — А Юмеко Ямано малює.

      Сора лише кивнула. Райдо запитав, чому дівчина із заможної цивільної родини взагалі пішла в Академію. Вона витримала коротку паузу й відповіла так само спокійно:

      — Я люблю знання.

      Райдо не став оцінювати відповідь. Лише прийняв її й повернувся до Рена Тецу.

      — Ішін Тецу все ще кує зброю?

      Рен одразу пожвавішав.

      Райдо згадав, що не раз замовляв у його батька кунаї: хороша сталь, правильний баланс. Для Рена цього вистачило, щоб гордо випростатися, але наступне питання наставника було вже про нього самого. Рен коротко назвав свою сильну сторону — тайдзюцу — і без особливого сорому визнав, що з ніндзюцу в нього майже нічого.

      Нарешті Райдо подивився на Кіту Хаяші. Погляд на мить став менш службовим.

      — Нобарі Хаяші. Ми з нею вчилися в одному класі.

      Кіта розгубився сильніше, ніж від будь-якого попереднього питання. Райдо лише додав, що хороший контроль чакри в такому разі його не дивує, і не став розвивати тему далі.

      Розмова тривала без урочистих представлень: кілька коротких запитань, кілька відповідей, чай, данґо — і відчуття, що новий наставник уже знає про кожного трохи більше, ніж вони очікували.
