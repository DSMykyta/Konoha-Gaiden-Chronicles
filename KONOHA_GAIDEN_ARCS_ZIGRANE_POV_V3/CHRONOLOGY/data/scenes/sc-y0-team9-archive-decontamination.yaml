- id: ev-y0-team9-undergoes-decontamination
  title: Команда 9 проходить знезараження після архіву
  text: 'Медики відводять команду до тимчасового карантинного боксу та розділяють огляд за ширмами. Одяг, взуття й спорядження забирають на дезінфекцію: небезпечний пил міг осісти на тканині й шкірі навіть без відкриття коробок. Райдо сам виконує приписи й заспокоює Рена, який хвилюється, що вони вже встигли вдихнути забруднення. Після огляду команда отримує змінний медичний одяг і чекає дозволу на вихід. Райдо обіймає учнів і обіцяє данго; Сора присувається ближче до решти. Коли перевірка закінчується, їм повертають знезаражені речі та спорядження й відпускають із боксу.'
