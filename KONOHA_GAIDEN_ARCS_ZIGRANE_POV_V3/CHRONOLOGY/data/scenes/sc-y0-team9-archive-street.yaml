  title: Райдо пояснює учням наказ мовчати
  text: За поворотом Сора запитує, чи не погрожували їм як свідкам порушення. Райдо пояснює, що серйозна архівна перевірка означає окремі рапорти, комісію та офіційні допити; адміністрації простіше прибрати генінів із подальшого оформлення справи. Він не оголошує знахідку безпечною й не повертає дітей до сектора, але відділяє бюрократичне поводження з командою від загрози їхньому життю. Подальшою перевіркою займуться фахівці, а їхня робота на сьогодні завершена.
