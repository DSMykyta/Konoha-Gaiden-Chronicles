  text: 'Після здачі складського D-рангу Райдо приводить учнів до канцелярії. Нобарі оформлює виплату й говорить із Кітою про витрати на спорядження. Перша зароблена сума виявляється невеликою: її потрібно співвіднести з ціною рукавичок та інших потрібних речей. Трійка виходить із резиденції з власними грошима й домовляється про їжу.'
