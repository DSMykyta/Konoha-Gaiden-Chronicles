- id: ev-y0-0123-sakura-finds-buried-sasuke
  title: Саске й Сакура знаходять одне одного після окремих невдач
  text: Опритомнівши, Сакура бачить голову закопаного Саске й знову непритомніє, прийнявши її за відрубану. Саске звільняється
    й приводить Сакуру до тями. Сакура пропонує спробувати пройти випробування наступного року. Саске відмовляється відступати,
