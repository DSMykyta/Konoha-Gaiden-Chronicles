- id: ev-y0-0123-naruto-attacks-kakashi
  legacy_ids:
  - V10-000010-B
  title: Наруто атакує Какаші без командної підтримки
  text: Після початку тесту Наруто відкрито атакує Какаші, поки Саске й Сакура ховаються. Какаші ухиляється, читаючи «Іча-Іча»,
    а потім атакою «Тисяча років болю» відкидає Наруто у воду. Наруто повертається з води й оточує Какаші тіньовими клонами.
    Один клон заходить ззаду й утримує наставника; Наруто намагається скористатися захватом. Какаші вислизає із захвату. Наруто
    припускає, що наставник перетворився на одного з клонів, і клони починають атакувати одне одного; Наруто розвіює їх.
