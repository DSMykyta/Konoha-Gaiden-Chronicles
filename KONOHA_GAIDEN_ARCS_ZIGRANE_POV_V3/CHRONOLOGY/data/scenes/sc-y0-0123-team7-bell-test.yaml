  legacy_ids:
  - V10-000010-E
  title: Какаші пояснює провал і дає другу спробу
  text: Какаші збирає учнів і заявляє, що вони не стануть ніндзя. Наруто вимагає пояснення; Саске атакує наставника, але Какаші
    притискає його до землі. Какаші пояснює, що перевіряв командну роботу, та розбирає індивідуальні помилки учнів. Він звертає
    їхню увагу на пам’ятний камінь загиблим ніндзя й нагадує про наслідки небезпечних місій. Какаші дає другу спробу після
    обіду. Саске й Сакура можуть їсти, але прив’язаному за спробу вкрасти обіди Наруто їжу заборонено; кожен, хто поділиться
    з ним, теж провалить тест.
