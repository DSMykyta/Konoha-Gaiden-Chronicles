  legacy_ids:
  - V10-000010-F
  title: Какаші зараховує Команду 7 після спільного рішення учнів
  text: Какаші повертається й удає гнів через порушення заборони. Учні разом заявляють, що вони одна команда й поділять наслідки.
    Після спільної відповіді учнів Какаші зараховує Команду 7. Він пояснює, що покинути товаришів гірше, ніж порушити наказ,
    і каже, що вони стали першою командою, яка пройшла його випробування. Какаші оголошує першу місію на наступний день і
    відпускає учнів додому. Коли він, Саске й Сакура йдуть, Наруто просить зняти його зі стовпа.
