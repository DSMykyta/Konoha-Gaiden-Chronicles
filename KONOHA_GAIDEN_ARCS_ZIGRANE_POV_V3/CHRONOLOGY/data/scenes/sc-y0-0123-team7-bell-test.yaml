title: Випробування Команди 7 з дзвіночками
description: >-
  Троє генінів атакують наставника поодинці, прагнучи відібрати один із двох дзвіночків, і кожен зазнає невдачі. Какаші розкриває справжню мету тесту: не перемога над ним, а вміння діяти разом і не залишати товариша без допомоги. Саске й Сакура порушують наказ не годувати Наруто, і саме це рішення приносить усій трійці успіх.
