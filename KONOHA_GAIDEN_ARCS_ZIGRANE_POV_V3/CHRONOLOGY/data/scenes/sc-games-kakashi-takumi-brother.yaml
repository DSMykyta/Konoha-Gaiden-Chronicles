  text: 'Після невдалого очікування Какаші зустрічає молодшого брата Такумі. Хлопець дякує за повернення тіла загиблого шинобі. Для Какаші це нагадування про ту частину його роботи, яку цивільні родини переживають без бойової дистанції. Смерть Такумі не стає новою місією цього дня: зустріч повертає до вже пережитої втрати.'
