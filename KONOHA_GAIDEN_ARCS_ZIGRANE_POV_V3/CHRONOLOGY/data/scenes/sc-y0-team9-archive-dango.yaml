- id: ev-y0-team9-shares-archive-day-with-mentors
  title: Команда 9 розповідає наставникам про архівний день
  text: 'Райдо замовляє тацю данго, і команда намагається позбутися присмаку медичних пігулок після карантину. До столу підходять Асума й Куренай. Рен одразу розповідає про небезпечну знахідку та знезараження, Сора важко зітхає через його галасливість, а Кіта ховає збентеження за чашкою чаю. Райдо підтверджує, що вони працювали в архівному корпусі, і по суті оцінює результат: Сора зупинила незаконне списання, Рен утримав важкий стелаж, Кіта виконав потрібне маркування. Асума й Куренай слухають уже як наставники команди, яка впоралася з непередбаченою ситуацією.'
