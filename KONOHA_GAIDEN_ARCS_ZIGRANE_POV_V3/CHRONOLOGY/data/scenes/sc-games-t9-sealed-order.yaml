  title: Команда 9 вирушає за запечатаним наказом радників
  text: Через два дні після Долини Завершення Хомура та Кохару передають запечатаний наказ. Цунаде не може відкрити його повністю й не знає всього маршруту. Кіта, Рен і Сора виходять із Конохи без свого щоденного наставника, зберігаючи звичний клин і власні домовленості. Звичайне очікування наступного короткого D-рангу змінюється тривалою місією без відкритого зв’язку з родинами.
