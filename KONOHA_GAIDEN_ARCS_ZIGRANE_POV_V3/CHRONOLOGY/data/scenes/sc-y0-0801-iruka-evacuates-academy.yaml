    title: "Ірука веде учнів у сховище за Монументом"
    text: "Під час нападу на Коноху Ірука разом з іншими шинобі, серед яких Анко, евакуює учнів Академії та цивільних у захищені проходи й сховища за Монументом Хокаґе. Ірука запевняє дітей, що викладачі захищатимуть їх навіть ціною власного життя. Коли на зображенні Третього Хокаґе з’являється тріщина, Конохамару тривожно реагує, а Ірука розуміє, що бій Хірузена триває."
