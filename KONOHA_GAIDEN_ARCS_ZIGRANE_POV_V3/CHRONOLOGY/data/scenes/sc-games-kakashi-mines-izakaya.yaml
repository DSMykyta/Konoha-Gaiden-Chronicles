  title: Какаші оплачує спільний вечір після шахт
  text: Після завершення звітів колеги збираються в ізакаї за рахунок Какаші. Напруження прихованого виходу змінюється звичними жартами й розмовою людей, які бачили одне одного в небезпечній роботі. Вечір відділяє виконану диверсію від наступних завдань і знову повертає Какаші до його незавершених особистих питань.
