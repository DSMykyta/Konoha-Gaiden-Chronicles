    title: "Бакі не може вирушити разом із трійкою"
    text: "Темарі й Канкуро заперечують проти того, щоб Ґаара йшов саме назустріч ворогам, які полюють на нього, і хочуть, щоб Бакі супроводжував їх. Бакі згадує попередню позицію ради щодо Ґаари, але не може приєднатися: йому доручено іншу місію. Тому трійка Суни вирушає без свого наставника."
