    legacy_ids: ["V10-000214"]
    title: "Рада Суни вирішує переслідувати викрадачів Мацурі"
    text: "Після вторгнення Четвірки Небесних Символів і викрадення Мацурі Бакі бере участь у нараді старших шинобі Суни. Саме він пропонує звернутися до Конохи по допомогу, а рада погоджується відправити Ґаару, Темарі й Канкуро переслідувати викрадачів."
