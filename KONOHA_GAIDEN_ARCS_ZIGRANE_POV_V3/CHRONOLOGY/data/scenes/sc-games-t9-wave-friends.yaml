  title: Кіта, Рен і Сора зустрічають Наруто після Країни Хвиль
  text: 'Трійка приходить до шпиталю після повернення Команди 7, але всередину їх не допускають. Згодом вони зустрічаються з Наруто в Ічіраку. Він їсть пораненою після місії рукою обережніше та повертається до загибелі Хаку й Забузи. Друзі не перетворюють розмову на змагання подвигами: для них це перша близька зустріч із наслідками справжнього бою.'
