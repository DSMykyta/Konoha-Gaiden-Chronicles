    text: "Поки Наруто тренується з Джираєю, Ірука проводить для учнів Академії урок про Хокаґе біля Монумента. Хірузен приєднується до класу й пояснює дітям, що сила Хокаґе потрібна для захисту дорогих людей; серед тих, кого він називає дорогими, — Конохамару й усі мешканці Конохи."
