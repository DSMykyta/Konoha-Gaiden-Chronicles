  - id: "ev-y0-0122-shikamaru-spots-naruto"
    title: "Шикамару помічає Наруто біля Саске"
    text: "Шикамару помічає Наруто, який підкрадається до Саске, і впізнає його; Наруто намагається змусити Шикамару мовчати."
    prose: |-
      У дальньому кінці проходу майнула помаранчева куртка.
      
      Наруто притиснувся до стіни й визирнув за ріг. Попереду пройшов Саске.
      
      — Наруто? — озвався Шикамару.
      
      Наруто сіпнувся, озирнувся й одразу приклав палець до губ.
      
      Шикамару підняв брову.
      
      Наруто ще раз показав: тихо.
      
      Потім зник за рогом услід за Саске.
