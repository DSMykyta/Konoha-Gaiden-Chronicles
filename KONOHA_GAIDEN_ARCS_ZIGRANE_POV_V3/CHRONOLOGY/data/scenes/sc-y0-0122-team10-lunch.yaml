  - id: "ev-y0-0122-team10-lunch-banter"
    title: "Іно намагається керувати новою Командою 10"
    text: "На перерві Іно заявляє Шикамару й Чоджі, що як члени однієї команди вони мають слухати її. Чоджі пропонує якось сходити разом на барбекю, а Шикамару реагує без ентузіазму."
    prose: |-
      Неподалік Іно стояла перед Шикамару й Чоджі, упершись руками в боки.
      
      — Раз ми тепер команда, слухатимете мене.
      
      Шикамару сперся спиною на стіну.
      
      Чоджі заглянув у свій пакет.
      
      — Можемо якось сходити на барбекю.
      
      — Це твій план на командну роботу? — Іно повернулася до нього.
      
      Чоджі знизав плечима й поклав до рота ще одну чипсину.
      
      Шикамару прикрив очі.
      
      — Клопітно.
      
      Іно різко повернулася до нього, але він уже дивився вбік.
