  title: Команда 7 бачить роботу Ібікі
  text: 'Дорогою до Ібікі команда опиняється біля кімнати допиту саме тоді, коли відчиняються двері. Геніни випадково бачать наслідки жорсткого фізичного допиту й самого Ібікі за роботою. Побачене матеріалізує те, про що Какаші розповідав їм біля багаття: тепер вони на власні очі бачать інший спосіб добування інформації, відмінний від методів Мікати.'
