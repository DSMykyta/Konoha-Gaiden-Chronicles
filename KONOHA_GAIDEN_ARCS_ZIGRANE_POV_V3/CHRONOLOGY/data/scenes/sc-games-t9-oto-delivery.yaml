  text: Спільна доставка документів веде Команди 9 і 10 через три пости. Дорогою вони зустрічають майбутніх учасників іспиту зі Звуку; звичайний службовий маршрут дає учням відчути присутність інших селищ. Після роботи Асума призначає додаткову вправу на наступний день. Командування Командою 9 при цьому залишається в Райдо.
