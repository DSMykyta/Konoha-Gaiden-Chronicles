  - id: "ev-y0-0122-sakura-insults-naruto"
    title: "Сакура говорить про Наруто, думаючи, що перед нею Саске"
    text: "Замаскований Наруто питає Сакуру, що вона думає про Наруто. Сакура називає його надокучливим і говорить, що хоче визнання Саске; вони майже цілуються, але біль у животі змушує Наруто раптово втекти до туалету."
    prose: |-
      — А що ти думаєш про Наруто? — запитав він.
      
      Сакура скривилася.
      
      Вона назвала Наруто надокучливим, заговорила швидше й підійшла до «Саске» ще ближче. Їхні обличчя опинилися майже поруч.
      
      У животі Наруто голосно забурчало.
      
      Він зігнувся, притис долоню до живота й відскочив назад.
      
      — Зараз повернуся!
      
      За мить він уже біг коридором до туалету.
    origin: "M"
