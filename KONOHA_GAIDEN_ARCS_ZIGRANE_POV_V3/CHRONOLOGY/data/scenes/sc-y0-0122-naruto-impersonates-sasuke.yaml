      - {entity_id: "c-sakura", role: "focus", mode: "physical"}
      - {entity_id: "c-sasuke", role: "portrayed", mode: "remote"}
    evidence_ids: ["evd-manga-team7-formation"]
  - id: "ev-y0-0122-sakura-insults-naruto"
    title: "Сакура говорить про Наруто, думаючи, що перед нею Саске"
    text: "Замаскований Наруто питає Сакуру, що вона думає про Наруто. Сакура називає його надокучливим і говорить, що хоче визнання Саске; вони майже цілуються, але біль у животі змушує Наруто раптово втекти до туалету."
    prose: |-
      — Я тебе всюди шукала.
      
      Наруто в подобі Саске притулився плечем до стіни.
      
      — А Наруто?
      
      Обличчя Сакури скривилося.
      
      — Він? Постійно лізе куди не треба. Кричить, заважає...
      
      Вона махнула рукою й заговорила швидше.
      
      Наруто не перебивав.
      
      Сакура зробила ще півкроку. Відстань між ними скоротилася до кількох сантиметрів.
      
      Вона підняла підборіддя.
      
      Наруто подався вперед.
      
      У нього голосно забурчало в животі.
      
      Він завмер, зігнувся навпіл і притис долоню до живота.
      
      — Що з тобою?
      
      Наруто вже відступав.
      
      — Зараз повернуся!
      
      За секунду він біг коридором, тримаючись за живіт.
    origin: "M"
    extent: "interval"
