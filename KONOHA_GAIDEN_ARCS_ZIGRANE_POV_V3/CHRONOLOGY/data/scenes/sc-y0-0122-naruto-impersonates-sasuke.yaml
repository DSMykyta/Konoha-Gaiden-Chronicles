  - id: "ev-y0-0122-naruto-restrains-sasuke"
    title: "Наруто зв’язує Саске"
    text: "Наруто нападає на Саске під час перерви. Після короткої оманливої розв’язки з підміною він використовує тіньових клонів, перемагає Саске, зв’язує йому руки та ноги й затикає рот, щоб видати себе за нього."
    prose: |-
      Саске зайшов до порожньої кімнати. У відчиненому вікні майнула помаранчева куртка.
      
      Наруто вскочив усередину.
      
      За мить між ними піднялася хмара диму. Коли вона розійшлася, Саске стояв над зв’язаним Наруто.
      
      Фігура на підлозі луснула хмарою диму.
      
      Кілька Наруто одночасно кинулися з різних боків.
      
      Коротка сутичка закінчилася біля стіни. Справжній Саске сидів на підлозі зі зв’язаними руками й ногами; рот був перетягнутий тканиною.
      
      Наруто склав печатку.
    origin: "M"
    extent: "interval"
    display_rank: 100
    involvement:
