  - id: "ev-y0-0122-naruto-impersonates-sasuke"
    title: "Наруто під виглядом Саске говорить із Сакурою"
    text: "Наруто використовує Перетворення, набуває вигляду Саске й знаходить Сакуру, яка все ще шукає справжнього Саске."
    prose: |-
      Хмара диму накрила Наруто з голови до ніг. Коли вона розійшлася, перед зв’язаним Саске стояв другий Саске.

      Наруто в його подобі поправив комір і вийшов у коридор. Сакура показалася за поворотом майже одразу; побачивши його, вона пришвидшила крок.

      — Саске!

      Наруто розвернувся до неї. Сакура підійшла зовсім близько.
    origin: "M"
