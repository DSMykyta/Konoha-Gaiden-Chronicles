  - id: "ev-y0-0122-naruto-confronts-sasuke"
    title: "Наруто знову кидається на Саске"
    text: "Після туалету Наруто натрапляє на Саске й знову створює тіньових клонів, але новий напад болю в животі зриває сутичку."
    prose: |-
      Двері туалету відчинилися.
      
      Наруто вийшов у коридор і майже одразу побачив Саске.
      
      — Ти!
      
      Навколо Наруто з хлопками з’явилися тіньові клони. Вони рушили вперед.
      
      Наруто раптом зупинився, схопився за живіт і зігнувся.
      
      Клони зникли.
      
      Він розвернувся й побіг назад до туалету. Саске залишився посеред коридору.
    origin: "A"
    extent: "interval"
    display_rank: 500
    involvement:
