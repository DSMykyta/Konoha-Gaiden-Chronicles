  - id: "ev-y0-0122-sakura-insults-naruto"
    title: "Сакура говорить про Наруто, думаючи, що перед нею Саске"
    text: "Замаскований Наруто питає Сакуру, що вона думає про Наруто. Сакура називає його надокучливим і говорить, що хоче визнання Саске; вони майже цілуються, але біль у животі змушує Наруто раптово втекти до туалету."
    prose: |-
      — Я тебе всюди шукала.

      Наруто в подобі Саске сперся плечем об стіну.

      — А Наруто?

      Сакура скривилася.

      — Він тільки й робить, що лізе куди не треба. Кричить, заважає... Йому ж удома ніхто нічого не скаже. У нього немає батьків.

      Вона махнула рукою й підійшла ще ближче. Наруто мовчав.

      Сакура підняла підборіддя. Між ними лишилося кілька сантиметрів; Наруто подався вперед.

      У нього голосно забурчало в животі.

      Він завмер, зігнувся й притис долоню до живота.

      — Що з тобою?

      Наруто вже відступав.

      — Зараз повернуся!

      За секунду він біг коридором, тримаючись за живіт.
