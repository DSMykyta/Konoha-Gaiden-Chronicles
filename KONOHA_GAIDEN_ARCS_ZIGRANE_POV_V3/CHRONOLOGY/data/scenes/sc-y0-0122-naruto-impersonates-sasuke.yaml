  - id: "ev-y0-0122-naruto-confronts-sasuke"
    title: "Наруто знову кидається на Саске"
    text: "Після туалету Наруто натрапляє на Саске й знову створює тіньових клонів, але новий напад болю в животі зриває сутичку."
    prose: |-
      Двері туалету грюкнули об стіну.
      
      Наруто вийшов у коридор, витираючи рот рукавом, і відразу побачив Саске.
      
      — Ти!
      
      Саске зупинився.
      
      Навколо Наруто один за одним хлопнули тіньові клони.
      
      Вони рушили вперед.
      
      Наруто зробив два кроки й раптом зігнувся, обхопивши живіт.
      
      Клони один за одним розвіялися.
      
      Саске мовчки дивився, як Наруто розвернувся й побіг назад до туалету.
    origin: "A"
    extent: "interval"
    display_rank: 500
    involvement:
      - {entity_id: "c-naruto", role: "focus", mode: "physical"}
      - {entity_id: "c-sasuke", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-sakura-kind-to-naruto"
    title: "Сакура намагається бути добрішою до Наруто"
    text: "Сакура знаходить Наруто й доброзичливіше кличе його повертатися до класу. Наруто підозрює, що це Саске перетворився на Сакуру, але черговий напад болю в животі знову перериває його реакцію."
    prose: |-
      Коли Наруто знову вийшов, Сакура стояла неподалік.
      
      Вона не підвищувала голосу.
      
      — Наруто. Ходімо назад у клас.
      
      Він зупинився.
      
      Сакура зробила крок до нього.
      
      Наруто примружився й відступив.
      
      — Саске? Це ти?
      
      — Що?
      
      Він підняв руки, ніби готувався скласти печатку.
      
      Живіт знову забурчав.
      
      Наруто скривився, опустив руки й утретє помчав назад.
      
      Сакура провела його поглядом.
      
      До кінця перерви коридори спорожніли. Учні знову зібралися в класі й чекали біля своїх парт.
    origin: "A"
