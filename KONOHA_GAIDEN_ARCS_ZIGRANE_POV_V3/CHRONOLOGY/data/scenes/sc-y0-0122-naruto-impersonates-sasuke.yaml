events:
  - id: "ev-y0-0122-naruto-restrains-sasuke"
    title: "Наруто зв’язує Саске"
    text: "Наруто нападає на Саске під час перерви. Після короткої оманливої розв’язки з підміною він використовує тіньових клонів, перемагає Саске, зв’язує йому руки та ноги й затикає рот, щоб видати себе за нього."
    prose: |-
      Саске звернув у порожню кімнату.
      
      За ним у дверях з’явився Наруто.
      
      — Гей.
      
      Саске розвернувся.
      
      Вони кинулися один на одного майже одночасно. Перший удар пройшов повз, другий Наруто прийняв на передпліччя. Саске штовхнув його до стіни.
      
      Наруто луснув хмарою диму.
      
      Саске встиг повернути голову — з двох боків уже летіли клони.
      
      Кімнату на кілька секунд заповнили тупіт, удари й білі спалахи розвіяних копій.
      
      Коли дим осів, Саске сидів біля стіни. Руки й ноги були стягнуті мотузкою, рот перетягнутий тканиною.
      
      Наруто присів перед ним.
      
      — Тільки тихо.
      
      Саске рвонув руками. Мотузка не піддалася.
      
      Наруто випростався й склав печатку.
    origin: "M"
    extent: "interval"
    display_rank: 100
    involvement:
