  - id: "ev-y0-0122-naruto-confronts-sasuke"
    title: "Наруто знову кидається на Саске"
    text: "Після туалету Наруто натрапляє на Саске й знову створює тіньових клонів, але новий напад болю в животі зриває сутичку."
    prose: |-
      Двері туалету грюкнули об стіну. Наруто вийшов у коридор і відразу побачив Саске.

      — Ти!

      Саске зупинився. Навколо Наруто один за одним хлопнули тіньові клони й рушили вперед.

      Наруто зробив два кроки, раптом зігнувся й обхопив живіт. Клони один за одним розвіялися.

      Він розвернувся й побіг назад до туалету. Саске лишився посеред коридору.
    origin: "A"
    extent: "interval"
    display_rank: 500
    involvement:
