  - id: "ev-y0-0122-naruto-impersonates-sasuke"
    title: "Наруто під виглядом Саске говорить із Сакурою"
    text: "Наруто використовує Перетворення, набуває вигляду Саске й знаходить Сакуру, яка все ще шукає справжнього Саске."
    prose: |-
      Дим закрив його з голови до ніг.
      
      Коли він розвіявся, на місці Наруто стояв Саске.
      
      Він вийшов у коридор.
      
      Сакура показалася попереду. Вона зупинилася, щойно побачила знайоме обличчя, і швидко підійшла ближче.
      
      — Саске!
      
      Наруто в його подобі повернувся до неї.
    origin: "M"
    extent: "interval"
    display_rank: 200
    involvement:
