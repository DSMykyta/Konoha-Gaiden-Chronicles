  - id: "ev-y0-0122-sasuke-confronts-sakura"
    title: "Саске звільняється й говорить із Сакурою"
    text: "Справжній Саске звільняється, зустрічає Сакуру й питає, де Наруто. Сакура, думаючи про попередню розмову, зневажливо пояснює поведінку Наруто тим, що він росте без батьків. Саске різко каже, що вона не розуміє самотності, і називає її надокучливою; після цього Сакура починає інакше дивитися на власне ставлення до Наруто."
    prose: |-
      У порожній кімнаті мотузка впала на підлогу.
      
      Саске стягнув тканину з рота, потер зап’ястя й вийшов у коридор.
      
      Сакура побачила його першою.
      
      — Саске?
      
      Він зупинився.
      
      — Де Наруто?
      
      Сакура підійшла ближче й почала пояснювати. У її словах знову прозвучало, що Наруто росте без батьків і тому поводиться як заманеться.
      
      Саске не рухався.
      
      Коли вона закінчила, він опустив брови.
      
      — Не говори про це так.
      
      Сакура замовкла.
      
      — Ти не знаєш, що таке бути самому.
      
      Він пройш повз неї, зробив кілька кроків і кинув через плече:
      
      — Ти надокучлива.
      
      Сакура залишилася посеред коридору. Її руки повільно опустилися вздовж тіла.
      
      Саске зник за поворотом.
    origin: "M"
