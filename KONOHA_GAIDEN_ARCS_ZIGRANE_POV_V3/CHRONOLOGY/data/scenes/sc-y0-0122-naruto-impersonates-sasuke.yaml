events:
  - id: "ev-y0-0122-naruto-restrains-sasuke"
    title: "Наруто зв’язує Саске"
    text: "Наруто нападає на Саске під час перерви. Після короткої оманливої розв’язки з підміною він використовує тіньових клонів, перемагає Саске, зв’язує йому руки та ноги й затикає рот, щоб видати себе за нього."
    prose: |-
      Саске звернув у порожню кімнату. Наруто прослизнув за ним.

      — Гей.

      Саске розвернувся, і вони кинулися один на одного. Саске збив Наруто з ніг — той луснув хмарою диму.

      Саске встиг лише повернути голову. Клони налетіли з двох боків; кімнату на кілька секунд заповнили тупіт, короткі удари й білі спалахи розвіяних копій.

      Коли дим осів, Саске сидів біля стіни зі стягнутими мотузкою руками й ногами та тканиною на роті. Він рвонув руками, але мотузка не піддалася.

      Наруто випростався перед ним і склав печатку.
    origin: "M"
