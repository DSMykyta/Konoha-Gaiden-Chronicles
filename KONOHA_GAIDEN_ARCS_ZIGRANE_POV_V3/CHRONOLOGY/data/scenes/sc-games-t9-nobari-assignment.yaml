  text: 'Після тренування Куренай приводить трійку до розподільчої. Нобарі чекає у формі джоніна із сувоєм: вона має супроводити Команду 9 на медичний D-ранг. Асума пояснює, що в сусідньому поселенні стабільним пораненим бракує допомоги місцевих лікарів. Для Кіти це перше завдання з матір’ю як польовим керівником. Команда готується й вирушає з нею до воріт.'
