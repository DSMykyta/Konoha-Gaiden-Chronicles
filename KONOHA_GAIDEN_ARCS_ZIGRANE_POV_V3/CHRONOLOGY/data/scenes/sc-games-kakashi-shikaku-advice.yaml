  text: Какаші приходить до будинку Шікаку, і за партією в шьоґі розповідає про Юміко та невдалі спроби заговорити з нею. Шікаку радить зустріч у звичайному місці, де буде й знайома їй Сакура. Какаші бере цю пораду до уваги. Після місії Іви він використає звичайний D-ранг навпроти будинку учениці, щоб спробувати поговорити з Юміко.
