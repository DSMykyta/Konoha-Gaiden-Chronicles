events:
  - id: "ev-y0-0122-iruka-explains-squads"
    title: "Ірука пояснює подальший розподіл генінів"
    text: "Ірука пояснює випускникам, що вони працюватимуть трійками під керівництвом джонінів і що склади підібрані для балансу сил та здібностей."
    prose: |-
      Ірука поклав список на кафедру й постукав пальцями по столу.
      
      — Від сьогодні ви геніни. Далі працюватимете командами по троє під керівництвом джоніна.
      
      По класу прокотився шепіт.
      
      Ірука додав, що склади вже визначені й підібрані так, щоб команди були врівноважені. Кілька учнів одразу почали озиратися на сусідні парти.
      
      Ірука опустив погляд до аркуша.
    origin: "A"
    extent: "interval"
    display_rank: 50
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-kita-sees-jonin"
      title: "Кіта бачить трьох джонінів перед Академією"
      text: "Кіта дивиться з вікна класу на трьох джонінів перед Академією; двоє говорять між собою, третій стоїть осторонь."
      prose: |-
        Кіта повернув голову до вікна.
        
        Перед Академією стояли троє шинобі в зелених жилетах. Двоє розмовляли біля входу. Третій тримався трохи осторонь.
        
        Ірука провів пальцем униз по списку.
        
        Кіта повернувся до кафедри.
      origin: "P"
      extent: "interval"
      display_rank: 100
      involvement:
        - entity_id: "c-kita"
            role: "focus"
            mode: "physical"
      evidence_ids:
        - "evd-team9-announcement"
        - "evd-project-jonin-identities"
  - id: "ev-y0-0122-team7-announced"
      title: "Оголошено Команду 7"
      text: "Ірука називає Наруто, Сакуру й Саске Командою 7; Наруто радіє, почувши ім’я Сакури, Сакура засмучується через Наруто, а після імені Саске її настрій різко змінюється."
      prose: |-
        — Команда сім. Наруто Узумакі.
        
        Наруто випростався.
        
        — Сакура Харуно.
        
        — Є! — Наруто підскочив над партою.
        
        Сакура опустила голову на руки.
        
        — Саске Учіха.
        
        Сакура різко піднялася. Наруто повернувся до Саске й стиснув зуби.
        
        Кіта сидів поруч із Кібою. Він нахилився до нього, не відводячи очей від Наруто й Саске.
        
        — Наруто з Саске буде.
        
        Кіба глянув у той самий бік.
        
        Ірука вже читав далі.
      origin: "M"
      extent: "interval"
      display_rank: 200
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-naruto"
            role: "participant"
            mode: "physical"
        - entity_id: "c-sasuke"
            role: "participant"
            mode: "physical"
        - entity_id: "c-sakura"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-7"
      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team8-announced"
      title: "Оголошено Команду 8"
      text: "Ірука називає Хінату, Кібу й Шіно Командою 8; Хіната розуміє, що не потрапила в команду Наруто."
      prose: |-
        — Команда вісім. Хіната Х’юґа.
        
        — Т-так.
        
        — Кіба Інузука. Шіно Абураме.
        
        Кіба випростався на місці. Шіно лишився сидіти нерухомо. Хіната перевела погляд через клас у бік Наруто й одразу опустила його на парту.
        
        Ірука не зупинився.
      origin: "M"
      extent: "interval"
      display_rank: 300
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-hinata"
            role: "participant"
            mode: "physical"
        - entity_id: "c-kiba"
            role: "participant"
            mode: "physical"
        - entity_id: "c-shino"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-8"
      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team9-announced"
      title: "Оголошено Команду 9"
      text: "У канонічному місці оголошення Команди 9 Ірука називає Хаяші Кіту, Тецу Рена і Ямано Сору. Сора одразу щось занотовує в блокнот."
      prose: |-
        — Команда дев’ять. Хаяші Кіта. Тецу Рен. Ямано Сора.
        
        Кіта підняв голову.
        
        Сора, не випускаючи олівця, записала кілька слів у блокнот.
        
        — Наставник — Наміаші Райдо.
        
        Олівець Сори знову торкнувся паперу.
        
        Рен повернув голову ліворуч, потім праворуч.
      origin: "P"
      extent: "interval"
      display_rank: 400
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-kita"
            role: "participant"
            mode: "physical"
        - entity_id: "c-ren"
            role: "participant"
            mode: "physical"
        - entity_id: "c-sora"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-9"
      evidence_ids:
        - "evd-team9-announcement"
  - id: "ev-y0-0122-ren-asks-kita"
      title: "Рен з’ясовує, хто такий Кіта"
      text: "Рен голосно питає, хто Хаяші; Кіба показує на Кіту."
      prose: |-
        — Хаяші — це хто?
        
        Кіба підняв руку й показав пальцем на Кіту поруч із собою.
        
        Рен перевів погляд на нього.
        
        Кіта зустрів його погляд. Сора ще раз щось записала.
        
        Ірука назвав наступну команду.
      origin: "P"
      extent: "interval"
      display_rank: 500
      involvement:
        - entity_id: "c-ren"
            role: "focus"
            mode: "physical"
        - entity_id: "c-kita"
            role: "focus"
            mode: "physical"
      evidence_ids:
        - "evd-team9-announcement"
  - id: "ev-y0-0122-ino-shikamaru-banter"
    title: "Іно й Шикамару сперечаються через Саске"
    text: "Після оголошення попередніх команд Іно сердиться через те, що Сакура потрапила до Саске. Шикамару не розуміє захоплення Саске; Іно відповідає, що не хотіла б опинитися з ним в одній команді."
    prose: |-
      Іно нахилилася через ряд у бік Сакури й Саске.
      
      — От пощастило.
      
      Шикамару підняв голову з парти й глянув на Саске.
      
      — І що ви всі в ньому знайшли?
      
      Іно повернулася до нього.
      
      — Тобі не зрозуміти. Я б із тобою в одній команді точно не хотіла.
      
      Шикамару знову сперся щокою на долоню.
      
      Ірука зробив паузу над наступним рядком.
    origin: "A"
    extent: "interval"
    display_rank: 550
    involvement:
      - {entity_id: "c-ino", role: "focus", mode: "physical"}
      - {entity_id: "c-shikamaru", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-team10-announced"
      title: "Оголошено Команду 10"
      text: "Ірука називає Іно, Шикамару й Чоджі Командою 10. Шикамару відразу нагадує Іно її щойно сказане небажання бути з ним в одній команді; Іно невдоволена складом."
      prose: |-
        — Команда десять. Іно Яманака. Шикамару Нара. Чоджі Акімічі.
        
        Шикамару повільно повернув голову до Іно.
        
        — Схоже, ми все-таки в одній команді.
        
        Іно завмерла на секунду, потім різко відвернулася. Чоджі дістав із пакета ще одну жменю чипсів.
        
        Ірука дочитав список до кінця.
      origin: "M"
      extent: "interval"
      display_rank: 600
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-ino"
            role: "participant"
            mode: "physical"
        - entity_id: "c-shikamaru"
            role: "participant"
            mode: "physical"
        - entity_id: "c-choji"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-10"
      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-naruto-questions-team7"
    title: "Наруто питає, чому його поставили із Саске"
    text: "Після завершення розподілу Наруто протестує проти команди із Саске. Ірука пояснює, що Саске має найкращий результат серед випускників, Наруто — найгірший, і їх поставили разом для балансу. Саске й Наруто знову починають сваритися, Ірука їх зупиняє та оголошує перерву до знайомства з джонінами."
    prose: |-
      Наруто одразу підняв руку.
      
      — Ірука-сенсей! Чому я з ним?
      
      Він ткнув пальцем у Саске.
      
      Ірука відповів, що Саске має найкращий результат серед випускників, а Наруто — найгірший, тому їх поставили в одну команду для балансу.
      
      У класі засміялися.
      
      Наруто рвонувся вперед через парту. Саске підвівся назустріч.
      
      — Досить! — Ірука вдарив долонею по кафедрі.
      
      Обидва зупинилися.
      
      Ірука оголосив перерву до приходу наставників.
      
      Стільці заскреготіли по підлозі. Учні потягнулися до дверей. Сакура вийшла в коридор однією з перших.
    origin: "A"
    extent: "interval"
    display_rank: 700
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}
      - {entity_id: "c-naruto", role: "focus", mode: "physical"}
      - {entity_id: "c-sasuke", role: "focus", mode: "physical"}
      - {entity_id: "c-sakura", role: "participant", mode: "physical"}
    focus_teams: ["team-7"]

