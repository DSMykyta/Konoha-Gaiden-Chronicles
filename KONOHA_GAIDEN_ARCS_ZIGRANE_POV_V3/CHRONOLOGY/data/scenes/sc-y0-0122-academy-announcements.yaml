    evidence_ids:
      - "evd-team9-announcement"
  - id: "ev-y0-0122-ren-asks-kita"
    title: "Рен з’ясовує, хто такий Кіта"
    text: "Рен голосно питає, хто Хаяші; Кіба показує на Кіту."
    prose: |-
      — Хаяші — це хто?
      
      Кілька голів повернулися до нього.
      
      Кіба, не підводячись, ткнув пальцем у Кіту поруч із собою.
      
      Рен перевів погляд туди.
      
      Кіта подивився у відповідь.
      
      Сора не піднімала голови від блокнота.
      
      — Далі, — кинув Ірука й опустив очі до списку.
    origin: "P"
    extent: "interval"
    display_rank: 500
    involvement:
      - entity_id: "c-ren"
        role: "focus"
        mode: "physical"
      - entity_id: "c-kita"
        role: "focus"
        mode: "physical"
    evidence_ids:
      - "evd-team9-announcement"
  - id: "ev-y0-0122-ino-shikamaru-banter"
    title: "Іно й Шикамару сперечаються через Саске"
    text: "Після оголошення попередніх команд Іно сердиться через те, що Сакура потрапила до Саске. Шикамару не розуміє захоплення Саске; Іно відповідає, що не хотіла б опинитися з ним в одній команді."
    prose: |-
      Іно, що весь цей час косилася в бік Сакури, різко видихнула через ніс.
      
      — Звісно. Їй дістався Саске.
      
      Шикамару відірвав щоку від долоні й глянув через ряд.
      
      — І що ви всі в ньому знайшли?
      
      Іно повернулася до нього.
      
      — Тобі не зрозуміти. Я б із тобою в одній команді точно не хотіла.
      
      Шикамару повільно опустив голову назад на руку.
      
      Ірука дочекався, поки вони замовкнуть.
    origin: "A"
    extent: "interval"
    display_rank: 550
    involvement:
      - {entity_id: "c-ino", role: "focus", mode: "physical"}
      - {entity_id: "c-shikamaru", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-team10-announced"
    title: "Оголошено Команду 10"
    text: "Ірука називає Іно, Шикамару й Чоджі Командою 10. Шикамару відразу нагадує Іно її щойно сказане небажання бути з ним в одній команді; Іно невдоволена складом."
    prose: |-
      — Команда десять. Іно Яманака. Шикамару Нара. Чоджі Акімічі.
      
      Шикамару повернув голову до Іно.
      
      — Що ти там щойно казала?
      
      Іно завмерла з відкритим ротом, потім різко відвернулася.
      
      Чоджі дістав із пакета ще одну чипсину й захрумтів.
      
      Кілька людей у класі засміялися.
      
      Ірука дочитав список до кінця й поклав аркуш на кафедру.
    origin: "M"
    extent: "interval"
    display_rank: 600
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-ino"
        role: "participant"
        mode: "physical"
      - entity_id: "c-shikamaru"
        role: "participant"
        mode: "physical"
      - entity_id: "c-choji"
        role: "participant"
        mode: "physical"
    focus_teams:
      - "team-10"
    evidence_ids:
      - "evd-manga-team7-formation"
  - id: "ev-y0-0122-naruto-questions-team7"
    title: "Наруто питає, чому його поставили із Саске"
    text: "Після завершення розподілу Наруто протестує проти команди із Саске. Ірука пояснює, що Саске має найкращий результат серед випускників, Наруто — найгірший, і їх поставили разом для балансу. Саске й Наруто знову починають сваритися, Ірука їх зупиняє та оголошує перерву до знайомства з джонінами."
    prose: |-
      Рука Наруто злетіла вгору раніше, ніж Ірука встиг заговорити.
      
      — Ірука-сенсей! Чому я з ним?
      
      Палець уперся просто в Саске.
      
      — Бо Саске має найкращий результат серед випускників, — відповів Ірука. — А ти — найгірший. Так команда виходить рівнішою.
      
      Клас вибухнув сміхом.
      
      Наруто підскочив.
      
      — Чого?!
      
      Саске нарешті повернувся до нього.
      
      — Тільки не заважай.
      
      — Сам не заважай!
      
      Наруто вже перегнувся через парту, Саске підвівся назустріч.
      
      Долоня Іруки грюкнула по кафедрі.
      
      — Досить!
      
      Обидва зупинилися.
      
      — Перерва. Після неї чекатимете своїх наставників тут.
      
      Стільці один за одним загуркотіли по підлозі. Клас розсипався до дверей. Сакура вислизнула в коридор однією з перших.
    origin: "A"
    extent: "interval"
    display_rank: 700
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}
      - {entity_id: "c-naruto", role: "focus", mode: "physical"}
      - {entity_id: "c-sasuke", role: "focus", mode: "physical"}
      - {entity_id: "c-sakura", role: "participant", mode: "physical"}
