events:
  - id: "ev-y0-0122-iruka-explains-squads"
    title: "Ірука пояснює подальший розподіл генінів"
    text: "Ірука пояснює випускникам, що вони працюватимуть трійками під керівництвом джонінів і що склади підібрані для балансу сил та здібностей."
    prose: |-
      Гомін ще кілька секунд перекочувався між рядами, потім стих.

      — Від сьогодні ви геніни. Далі працюватимете трійками під керівництвом джоніна.

      Клас знову зашепотівся, але Ірука вже притримав список долонею.

      — Команди складені так, щоб вирівняти сили й здібності.

      Кілька учнів одразу озирнулися на сусідні парти. Іно подалася вперед, Наруто сів рівніше. Ірука опустив очі до першого рядка.
    origin: "A"
    extent: "interval"
    display_rank: 50
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-kita-sees-jonin"
    title: "Кіта бачить трьох джонінів перед Академією"
    text: "Кіта дивиться з вікна класу на трьох джонінів перед Академією; двоє говорять між собою, третій стоїть осторонь."
    prose: |-
      Біля вікна Кіта на мить відвернувся від кафедри. У дворі перед Академією стояли троє шинобі в зелених жилетах: двоє розмовляли біля входу, третій тримався трохи осторонь.

      За спиною зашелестів папір. Кіта затримав погляд унизу ще на секунду й повернувся до класу.
    origin: "P"
    extent: "interval"
    display_rank: 100
    involvement:
      - entity_id: "c-kita"
        role: "focus"
        mode: "physical"
    evidence_ids:
      - "evd-team9-announcement"
      - "evd-project-jonin-identities"
  - id: "ev-y0-0122-team7-announced"
    title: "Оголошено Команду 7"
    text: "Ірука називає Наруто, Сакуру й Саске Командою 7; Наруто радіє, почувши ім’я Сакури, Сакура засмучується через Наруто, а після імені Саске її настрій різко змінюється."
    prose: |-
      — Команда сім. Наруто Узумакі.

      Наруто підняв голову.

      — Сакура Харуно.

      Він ударив долонею по парті й підскочив.

      — Є!

      Сакура опустила лоб на складені руки.

      — Саске Учіха.

      Сакура миттю випросталася. Наруто повернув голову до Саске; той не ворухнувся.

      Кіта нахилився до Кіби поруч.

      — Наруто з Саске буде.

      Кіба перевів погляд з одного на другого, а Ірука вже читав далі.
    origin: "M"
    extent: "interval"
    display_rank: 200
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-naruto"
        role: "participant"
        mode: "physical"
      - entity_id: "c-sasuke"
        role: "participant"
        mode: "physical"
      - entity_id: "c-sakura"
        role: "participant"
        mode: "physical"
    focus_teams:
      - "team-7"
    evidence_ids:
      - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team8-announced"
    title: "Оголошено Команду 8"
    text: "Ірука називає Хінату, Кібу й Шіно Командою 8; Хіната розуміє, що не потрапила в команду Наруто."
    prose: |-
      — Команда вісім. Хіната Х’юґа. Кіба Інузука. Шіно Абураме.

      Кіба випростався, поклавши долоні на парту. Шіно лишився нерухомим. Хіната підняла очі, ковзнула поглядом через клас до Наруто й знову опустила їх на руки.

      Палець Іруки посунувся нижче по списку.
    origin: "M"
    extent: "interval"
    display_rank: 300
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-hinata"
        role: "participant"
        mode: "physical"
      - entity_id: "c-kiba"
        role: "participant"
        mode: "physical"
      - entity_id: "c-shino"
        role: "participant"
        mode: "physical"
    focus_teams:
      - "team-8"
    evidence_ids:
      - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team9-announced"
    title: "Оголошено Команду 9"
    text: "У канонічному місці оголошення Команди 9 Ірука називає Хаяші Кіту, Тецу Рена і Ямано Сору. Наставника під час оголошення не називають. Сора одразу щось занотовує в блокнот."
    prose: |-
      — Команда дев’ять. Хаяші Кіта. Тецу Рен. Ямано Сора.

      Кіта підняв голову. На задній парті Сора підтягнула блокнот ближче й записала три імені.

      Олівець знову зашурхотів по паперу. Рен озирнувся через один ряд, потім через інший.
    origin: "P"
    extent: "interval"
    display_rank: 400
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-kita"
        role: "participant"
        mode: "physical"
      - entity_id: "c-ren"
        role: "participant"
        mode: "physical"
      - entity_id: "c-sora"
        role: "participant"
        mode: "physical"
    focus_teams:
      - "team-9"
    evidence_ids:
      - "evd-team9-announcement"
  - id: "ev-y0-0122-ren-asks-kita"
    title: "Рен з’ясовує, хто такий Кіта"
    text: "Рен голосно питає, хто Хаяші; Кіба показує на Кіту."
    prose: |-
      — Хаяші — це хто?

      Кілька голів повернулися. Кіба, не підводячись, показав пальцем на Кіту поруч із собою.

      Рен перевів погляд туди. Кіта дивився у відповідь; Сора не відірвалася від блокнота.

      Ірука дочекався тиші й продовжив.
    origin: "P"
    extent: "interval"
    display_rank: 500
    involvement:
      - entity_id: "c-ren"
        role: "focus"
        mode: "physical"
      - entity_id: "c-kita"
        role: "focus"
        mode: "physical"
    evidence_ids:
      - "evd-team9-announcement"
  - id: "ev-y0-0122-ino-shikamaru-banter"
    title: "Іно й Шикамару сперечаються через Саске"
    text: "Після оголошення попередніх команд Іно сердиться через те, що Сакура потрапила до Саске. Шикамару не розуміє захоплення Саске; Іно відповідає, що не хотіла б опинитися з ним в одній команді."
    prose: |-
      Іно весь цей час косилася в бік Сакури й Саске.

      — Звісно. Їй дістався Саске.

      Шикамару відірвав щоку від долоні й глянув через ряд.

      — І що ви всі в ньому знайшли?
      — Тобі не зрозуміти. Я б із тобою в одній команді точно не хотіла.

      Шикамару знову сперся щокою на руку. Ірука опустив очі на наступний рядок.
    origin: "A"
    extent: "interval"
    display_rank: 550
    involvement:
      - {entity_id: "c-ino", role: "focus", mode: "physical"}
      - {entity_id: "c-shikamaru", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-team10-announced"
    title: "Оголошено Команду 10"
    text: "Ірука називає Іно, Шикамару й Чоджі Командою 10. Шикамару відразу нагадує Іно її щойно сказане небажання бути з ним в одній команді; Іно невдоволена складом."
    prose: |-
      — Команда десять. Іно Яманака. Шикамару Нара. Чоджі Акімічі.

      Шикамару повернув голову до Іно.

      — Що ти там щойно казала?

      Іно завмерла, потім різко відвернулася. Чоджі дістав із пакета ще одну чипсину й захрумтів; по класу прокотився сміх.

      Ірука дочитав список до кінця й поклав аркуш на кафедру.
    origin: "M"
    extent: "interval"
    display_rank: 600
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-ino"
        role: "participant"
        mode: "physical"
      - entity_id: "c-shikamaru"
        role: "participant"
        mode: "physical"
