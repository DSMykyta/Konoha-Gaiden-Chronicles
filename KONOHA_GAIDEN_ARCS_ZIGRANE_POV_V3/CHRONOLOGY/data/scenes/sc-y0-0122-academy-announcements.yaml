    evidence_ids:
      - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team8-announced"
    title: "Оголошено Команду 8"
    text: "Ірука називає Хінату, Кібу й Шіно Командою 8; Хіната розуміє, що не потрапила в команду Наруто."
    prose: |-
      — Команда вісім. Хіната Х’юґа. Кіба Інузука. Шіно Абураме.
      
      Кіба випростався й поклав долоні на парту. Шіно сидів нерухомо. Хіната підняла очі, ковзнула поглядом через клас у бік Наруто й одразу опустила їх на свої руки.
      
      Ірука перегорнув край аркуша великим пальцем.
    origin: "M"
    extent: "interval"
    display_rank: 300
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-hinata"
