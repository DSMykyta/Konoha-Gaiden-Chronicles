      evidence_ids:
        - "evd-team9-announcement"
  - id: "ev-y0-0122-ren-asks-kita"
      title: "Рен з’ясовує, хто такий Кіта"
      text: "Рен голосно питає, хто Хаяші; Кіта піднімає руку й відповідає."
      origin: "P"
      extent: "interval"
      display_rank: 500
      involvement:
        - entity_id: "c-ren"
            role: "focus"
            mode: "physical"
        - entity_id: "c-kita"
            role: "focus"
            mode: "physical"
      evidence_ids:
        - "evd-team9-announcement"
  - id: "ev-y0-0122-ino-shikamaru-banter"
    title: "Іно й Шикамару сперечаються через Саске"
    text: "Після оголошення попередніх команд Іно сердиться через те, що Сакура потрапила до Саске. Шикамару не розуміє захоплення Саске; Іно відповідає, що не хотіла б опинитися з ним в одній команді."
    origin: "A"
    extent: "interval"
    display_rank: 550
    involvement:
      - {entity_id: "c-ino", role: "focus", mode: "physical"}
      - {entity_id: "c-shikamaru", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-team10-announced"
      title: "Оголошено Команду 10"
      text: "Ірука називає Іно, Шикамару й Чоджі Командою 10. Шикамару відразу нагадує Іно її щойно сказане небажання бути з ним в одній команді; Іно невдоволена складом."
      origin: "M"
      extent: "interval"
      display_rank: 600
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-ino"
            role: "participant"
            mode: "physical"
        - entity_id: "c-shikamaru"
            role: "participant"
            mode: "physical"
        - entity_id: "c-choji"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-10"
      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-naruto-questions-team7"
    title: "Наруто питає, чому його поставили із Саске"
    text: "Після завершення розподілу Наруто протестує проти команди із Саске. Ірука пояснює, що Саске має найкращий результат серед випускників, Наруто — найгірший, і їх поставили разом для балансу. Саске й Наруто знову починають сваритися, Ірука їх зупиняє та оголошує перерву до знайомства з джонінами."
    origin: "A"
    extent: "interval"
    display_rank: 700
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}
      - {entity_id: "c-naruto", role: "focus", mode: "physical"}
      - {entity_id: "c-sasuke", role: "focus", mode: "physical"}
      - {entity_id: "c-sakura", role: "participant", mode: "physical"}
    focus_teams: ["team-7"]

