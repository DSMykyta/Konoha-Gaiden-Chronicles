events:
  - id: "ev-y0-0122-iruka-explains-squads"
    title: "Ірука пояснює подальший розподіл генінів"
    text: "Ірука пояснює випускникам, що вони працюватимуть трійками під керівництвом джонінів і що склади підібрані для балансу сил та здібностей."
    prose: |-
      — На місця.
      
      Гомін ще кілька секунд котився між рядами, але поступово стих. Ірука поклав аркуш на кафедру.
      
      — Від сьогодні ви геніни. Далі працюватимете трійками під керівництвом джонінів.
      
      У класі знову зашепотілися.
      
      — Команди вже складені. Ми розподілили вас так, щоб вирівняти сили й здібності.
      
      Хтось одразу озирнувся через плече. Іно нахилилася вперед. Наруто сів рівніше.
      
      Ірука притримав список долонею й повів пальцем униз по першому стовпчику.
    origin: "A"
    extent: "interval"
    display_rank: 50
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-kita-sees-jonin"
    title: "Кіта бачить трьох джонінів перед Академією"
    text: "Кіта дивиться з вікна класу на трьох джонінів перед Академією; двоє говорять між собою, третій стоїть осторонь."
    prose: |-
      Біля вікна Кіта на мить відвернувся від кафедри.
      
      У дворі перед Академією стояли троє шинобі в зелених жилетах. Двоє розмовляли біля входу; третій тримався осторонь, спиною до стіни.
      
      За спиною Ірука вже почав читати імена.
      
      Кіта ще секунду дивився вниз, потім повернувся до класу.
    origin: "P"
    extent: "interval"
    display_rank: 100
    involvement:
      - entity_id: "c-kita"
        role: "focus"
        mode: "physical"
    evidence_ids:
      - "evd-team9-announcement"
      - "evd-project-jonin-identities"
  - id: "ev-y0-0122-team7-announced"
    title: "Оголошено Команду 7"
    text: "Ірука називає Наруто, Сакуру й Саске Командою 7; Наруто радіє, почувши ім’я Сакури, Сакура засмучується через Наруто, а після імені Саске її настрій різко змінюється."
    prose: |-
      — Команда сім. Наруто Узумакі.
      
      Наруто підняв голову.
      
      — Сакура Харуно.
      
      Він ударив долонею по парті й підскочив.
      
      — Є!
      
      Сакура опустила лоб на складені руки.
      
      Ірука продовжив:
      
      — Саске Учіха.
      
      Сакура миттю випросталася. Наруто повільно повернув голову до Саске. Той навіть не змінив пози.
      
      Поруч із Кібою Кіта нахилився ближче й тихо кинув:
      
      — Наруто з Саске буде.
      
      Кіба перевів погляд із одного на другого.
      
      Ірука вже читав наступний рядок.
    origin: "M"
    extent: "interval"
    display_rank: 200
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-naruto"
        role: "participant"
        mode: "physical"
      - entity_id: "c-sasuke"
        role: "participant"
        mode: "physical"
      - entity_id: "c-sakura"
        role: "participant"
