  - id: "ev-y0-0122-team9-announced"
    title: "Оголошено Команду 9"
    text: "У канонічному місці оголошення Команди 9 Ірука називає Хаяші Кіту, Тецу Рена і Ямано Сору. Сора одразу щось занотовує в блокнот."
    prose: |-
      — Команда дев’ять. Хаяші Кіта. Тецу Рен. Ямано Сора.
      
      Кіта підняв голову.
      
      На задній парті Сора переставила блокнот ближче до краю й записала три імені.
      
      — Наставник — Наміаші Райдо.
      
      Олівець знову зашурхотів по паперу.
      
      Рен озирнувся ліворуч, потім через інший ряд.
    origin: "P"
    extent: "interval"
    display_rank: 400
    involvement:
      - entity_id: "c-iruka"
        role: "focus"
        mode: "physical"
      - entity_id: "c-kita"
        role: "participant"
        mode: "physical"
      - entity_id: "c-ren"
        role: "participant"
        mode: "physical"
      - entity_id: "c-sora"
        role: "participant"
        mode: "physical"
