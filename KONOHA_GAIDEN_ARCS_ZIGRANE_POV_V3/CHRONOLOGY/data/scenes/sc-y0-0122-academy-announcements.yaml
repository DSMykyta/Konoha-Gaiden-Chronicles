title: "Оголошення команд у класі Академії"
description: >-
  Ірука пояснює принцип формування генінських трійок та оголошує нові склади. Реакції Наруто, Сакури, Саске й решти випускників відкривають перші конфлікти; серед офіційних команд Кіта, Рен і Сора дізнаються, що працюватимуть разом.
