      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team9-announced"
      title: "Оголошено Команду 9"
      text: "У канонічному місці оголошення Команди 9 Ірука називає Хаяші Кіту, Тецу Рена і Ямано Сору. Сора одразу щось занотовує в блокнот."
      origin: "P"
      extent: "interval"
      display_rank: 400
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-kita"
            role: "participant"
            mode: "physical"
