events:
  - id: "ev-y0-0122-iruka-explains-squads"
    title: "Ірука пояснює подальший розподіл генінів"
    text: "Ірука пояснює випускникам, що вони працюватимуть трійками під керівництвом джонінів і що склади підібрані для балансу сил та здібностей."
    origin: "A"
    extent: "interval"
    display_rank: 50
    involvement:
      - {entity_id: "c-iruka", role: "focus", mode: "physical"}

  - id: "ev-y0-0122-kita-sees-jonin"
      title: "Кіта бачить трьох джонінів перед Академією"
      text: "Кіта дивиться з вікна класу на трьох джонінів перед Академією; двоє говорять між собою, третій стоїть осторонь."
      origin: "P"
      extent: "interval"
      display_rank: 100
      involvement:
        - entity_id: "c-kita"
            role: "focus"
            mode: "physical"
      evidence_ids:
        - "evd-team9-announcement"
        - "evd-project-jonin-identities"
  - id: "ev-y0-0122-team7-announced"
      title: "Оголошено Команду 7"
      text: "Ірука називає Наруто, Сакуру й Саске Командою 7; Наруто радіє, почувши ім’я Сакури, Сакура засмучується через Наруто, а після імені Саске її настрій різко змінюється."
      origin: "M"
      extent: "interval"
      display_rank: 200
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-naruto"
            role: "participant"
            mode: "physical"
        - entity_id: "c-sasuke"
            role: "participant"
            mode: "physical"
        - entity_id: "c-sakura"
            role: "participant"
            mode: "physical"
      focus_teams:
        - "team-7"
      evidence_ids:
        - "evd-manga-team7-formation"
  - id: "ev-y0-0122-team8-announced"
      title: "Оголошено Команду 8"
      text: "Ірука називає Хінату, Кібу й Шіно Командою 8; Хіната розуміє, що не потрапила в команду Наруто."
      origin: "M"
      extent: "interval"
      display_rank: 300
      involvement:
        - entity_id: "c-iruka"
            role: "focus"
            mode: "physical"
        - entity_id: "c-hinata"
            role: "participant"
            mode: "physical"
