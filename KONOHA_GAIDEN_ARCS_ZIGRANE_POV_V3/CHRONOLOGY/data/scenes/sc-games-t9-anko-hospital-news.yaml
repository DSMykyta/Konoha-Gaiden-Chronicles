  title: Команда 9 дізнається про тривале лікування Анко
  text: 'Після двох ранків очікування на полі Ірука приводить Команду 9 до резиденції. Адміністрація повідомляє: Анко повернулася з місії вночі, її стан стабільний, але польова робота неможлива щонайменше три тижні. Трійці пропонують тимчасового наставника з оплачуваними D-рангами або самостійні заняття без місій; розподілятися між іншими загонами учні не хочуть. Вони обирають тимчасове керівництво, щоб залишитися разом і не втратити заробіток.'
