name: SITE tests

on:
  push:
    branches: [main, feature/interval-capsule-timeline]
    paths:
      - 'SITE/**'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/data/**'
      - 'KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/CHRONOLOGY/data/**'
      - '.github/workflows/site-tests.yml'
  workflow_dispatch:

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Vercel Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SITE/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix SITE ci
      - name: Check scripts
        run: npm --prefix SITE run check
      - name: Build chronology and run all regression tests
        run: npm --prefix SITE test
      # npm test deliberately runs the long DOM integration first. If that
      # fails, run the independent suites anyway so one broken scenario
      # never hides unrelated regressions.
      - name: Run remaining unit suites after integration failure
        if: failure()
        working-directory: SITE
        run: node --test tests/*.test.mjs
