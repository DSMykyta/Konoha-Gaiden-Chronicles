name: SITE tests

on:
  push:
    branches: [main]
    paths:
      - 'SITE/**'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/data/**'
      - 'KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/CHRONOLOGY/data/**'
      - '.github/workflows/site-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SITE/**'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/data/**'
      - 'KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/CHRONOLOGY/data/**'
      - '.github/workflows/site-tests.yml'
  workflow_dispatch:

concurrency:
  group: site-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Vercel Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SITE/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix SITE ci
      - name: Install Chromium for browser regressions
        run: npm --prefix SITE exec -- playwright install chromium
      - name: Check, build, unit tests and real-browser regressions
        run: npm --prefix SITE run test:ci
      - name: Run independent unit suites if the combined check failed
        if: failure()
        working-directory: SITE
        run: node --test tests/*.test.mjs
