name: Capsule timeline prototype checks
on:
  push:
    branches:
      - feature/interval-capsule-timeline
    paths:
      - 'SITE/**'
      - '.github/workflows/capsule-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SITE/package-lock.json
      - run: npm --prefix SITE ci
      - name: Inventory remaining unknown scene locations
        run: node SITE/scripts/audit-scene-locations.mjs
      - run: npm --prefix SITE run check
      - name: Install Chromium for prototype smoke
        run: npm --prefix SITE exec -- playwright install chromium
      - name: Build browser preview
        run: npm --prefix SITE run build
      - name: Smoke-test all four hierarchy scales in Chromium
        run: node SITE/scripts/capsule-browser.mjs
      - name: Save capsule screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capsule-preview-22-january
          path: SITE/tmp/capsule-screenshots/*.png
          if-no-files-found: warn
      - run: npm --prefix SITE test
      - name: Run independent tests even if integrated tests fail
        if: failure()
        run: cd SITE && node --test tests/*.test.mjs
      - name: Validate YAML chronology
        if: always()
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python 00_MAIN_WORK_FOLDER/CHRONOLOGY/validate_timeline.py
          python 00_MAIN_WORK_FOLDER/CHRONOLOGY/validate_shippuden.py
