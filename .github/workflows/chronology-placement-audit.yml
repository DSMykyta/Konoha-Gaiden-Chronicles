name: Chronology placement audit

on:
  # Avoid spending GitHub Actions minutes on every narrative commit.
  # A manual run audits all current YAML data without deploying SITE.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chronology-placement-audit.yml'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/placement_solver.py'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/placement-windows.yaml'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/tests/test_placement_solver.py'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/data/time-anchors.yaml'
      - '00_MAIN_WORK_FOLDER/CHRONOLOGY/data/scenes/*waterfall*.yaml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install validation and optimization dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'ortools>=9.12,<10'
      - name: Validate chronology structure
        run: python 00_MAIN_WORK_FOLDER/CHRONOLOGY/validate_timeline.py
      - name: Run chronology optimizer regression tests
        run: python -m unittest discover -s 00_MAIN_WORK_FOLDER/CHRONOLOGY/tests -p 'test_placement_solver.py' -v
      - name: Produce chronology report from actual YAML
        if: success()
        run: |
          python 00_MAIN_WORK_FOLDER/CHRONOLOGY/placement_solver.py \
            --report chronology-placement-audit.md \
            --json chronology-placement-audit.json
      - name: Save report as downloadable artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chronology-placement-audit
          path: |
            chronology-placement-audit.md
            chronology-placement-audit.json
          if-no-files-found: warn
