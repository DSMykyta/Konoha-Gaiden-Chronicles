name: Build Narutopedia source

on:
  push:
    paths:
      - 'KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/SOURCES/narutopedia/.import/trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch and validate all 720 Narutopedia episode summaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import threading
          import time
          import unicodedata
          from datetime import datetime, timezone
          from urllib.parse import quote, unquote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup, Tag

          ROOT = 'https://naruto.fandom.com'
          API = ROOT + '/api.php'
          LIST_PAGE = 'List of Animated Media'
          BASE = 'KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/SOURCES/narutopedia'
          OUT = BASE + '/narutopedia_synopses_COMPLETE.json'
          WORKERS = 6
          tls = threading.local()

          def session():
              if not hasattr(tls, 's'):
                  s = requests.Session()
                  s.headers.update({'User-Agent': 'Konoha-Gaiden-Chronicles source builder/1.0'})
                  tls.s = s
              return tls.s

          def api(params, tries=8):
              q = {'format': 'json', 'formatversion': 2, 'maxlag': 5, **params}
              last = None
              for attempt in range(1, tries + 1):
                  try:
                      r = session().get(API, params=q, timeout=45)
                      if r.status_code in (429, 500, 502, 503, 504):
                          raise RuntimeError(f'HTTP {r.status_code}')
                      r.raise_for_status()
                      d = r.json()
                      if 'error' in d:
                          raise RuntimeError(d['error'].get('info') or d['error'].get('code'))
                      return d
                  except Exception as e:
                      last = e
                      if attempt == tries:
                          raise
                      time.sleep(min(15, attempt * 1.5))
              raise last

          def clean(text=''):
              text = html.unescape(str(text)).replace('\u00a0', ' ').replace('\r', '')
              text = re.sub(r'[ \t]+\n', '\n', text)
              text = re.sub(r'\n[ \t]+', '\n', text)
              text = re.sub(r'[ \t]{2,}', ' ', text)
              text = re.sub(r'\n{3,}', '\n\n', text)
              return text.strip()

          def norm(text=''):
              text = unicodedata.normalize('NFD', clean(text))
              text = ''.join(c for c in text if unicodedata.category(c) != 'Mn')
              return text.lower().strip()

          def section_index(sections, *names):
              wanted = {norm(x) for x in names}
              for s in sections:
                  if norm(s.get('line', '')) in wanted:
                      return s['index']
              raise RuntimeError(f'Section not found: {names}')

          def section_html(page, index):
              d = api({'action': 'parse', 'page': page, 'prop': 'text', 'section': index, 'redirects': 1})
              return d['parse']['text']

          def page_title_from_href(href):
              if not href:
                  return None
              u = urlparse(urljoin(ROOT, href))
              marker = '/wiki/'
              if marker not in u.path:
                  return None
              title = unquote(u.path.split(marker, 1)[1]).replace('_', ' ').strip()
              if not title or any(title.startswith(p) for p in ('File:', 'Category:', 'Special:', 'Template:', 'Help:', 'User:', 'Talk:')):
                  return None
              return title

          def parse_episode_table(section, series, expected):
              soup = BeautifulSoup(section, 'html.parser')
              found = {}
              for row in soup.find_all('tr'):
                  cells = row.find_all(['th', 'td'], recursive=False)
                  if len(cells) < 2:
                      continue
                  number_idx = None
                  number = None
                  for i, cell in enumerate(cells[:3]):
                      m = re.fullmatch(r'\s*(\d{1,3})\s*', clean(cell.get_text(' ', strip=True)))
                      if m:
                          n = int(m.group(1))
                          if 1 <= n <= expected:
                              number_idx, number = i, n
                              break
                  if number is None:
                      continue
                  chosen = None
                  page_title = None
                  title_cell = None
                  for cell in cells[number_idx + 1:]:
                      for a in cell.find_all('a', href=True):
                          candidate = page_title_from_href(a.get('href'))
                          if candidate:
                              chosen, page_title, title_cell = a, candidate, cell
                              break
                      if page_title:
                          break
                  if not page_title:
                      continue
                  title = clean(chosen.get_text(' ', strip=True)) or clean(title_cell.get_text(' ', strip=True))
                  title = title.strip('“”"')
                  found[number] = {
                      'series': series,
                      'episode': number,
                      'title': title,
                      'page_title': page_title,
                      'url': ROOT + '/wiki/' + quote(page_title.replace(' ', '_'), safe="/:!()'–…"),
                  }
              missing = [n for n in range(1, expected + 1) if n not in found]
              if missing:
                  raise RuntimeError(f'{series}: found {len(found)}/{expected}; missing {missing}')
              return [found[n] for n in range(1, expected + 1)]

          def get_episode_lists():
              d = api({'action': 'parse', 'page': LIST_PAGE, 'prop': 'sections', 'redirects': 1})
              sections = d['parse']['sections']
              ni = section_index(sections, 'Naruto: Original')
              si = section_index(sections, 'Naruto: Shippūden', 'Naruto: Shippuden')
              naruto = parse_episode_table(section_html(LIST_PAGE, ni), 'Naruto', 220)
              shippuden = parse_episode_table(section_html(LIST_PAGE, si), 'Naruto: Shippuden', 500)
              print(f'Index verified: Naruto {len(naruto)}/220, Shippuden {len(shippuden)}/500', flush=True)
              return naruto, shippuden

          def heading_name(tag):
              clone = BeautifulSoup(str(tag), 'html.parser')
              for e in clone.select('.mw-editsection'):
                  e.decompose()
              return norm(clone.get_text(' ', strip=True))

          def extract_named_section(full_html):
              soup = BeautifulSoup(full_html, 'html.parser')
              root = soup.select_one('.mw-parser-output') or soup
              target = None
              target_level = None
              target_name = None
              for h in root.find_all(re.compile(r'^h[1-6]$')):
                  name = heading_name(h)
                  if name in ('synopsis', 'summary'):
                      target = h
                      target_level = int(h.name[1])
                      target_name = 'Synopsis' if name == 'synopsis' else 'Summary'
                      break
              if target is None:
                  return None, None
              blocks = []
              node = target.next_sibling
              while node is not None:
                  nxt = node.next_sibling
                  if isinstance(node, Tag):
                      if re.fullmatch(r'h[1-6]', node.name or '') and int(node.name[1]) <= target_level:
                          break
                      for bad in node.select('.mw-editsection, sup.reference, script, style, noscript'):
                          bad.decompose()
                      if node.name == 'p':
                          t = clean(node.get_text(' ', strip=True))
                          if t:
                              blocks.append(t)
                      elif node.name in ('ul', 'ol'):
                          items = [clean(li.get_text(' ', strip=True)) for li in node.find_all('li', recursive=False)]
                          items = [x for x in items if x]
                          if items:
                              blocks.append('\n'.join('- ' + x for x in items))
                      elif node.name == 'blockquote':
                          t = clean(node.get_text(' ', strip=True))
                          if t:
                              blocks.append(t)
                  node = nxt
              text = clean('\n\n'.join(blocks))
              return target_name, text or None

          def fetch_episode(ep):
              try:
                  d = api({'action': 'parse', 'page': ep['page_title'], 'prop': 'text|revid', 'redirects': 1})
                  section, text = extract_named_section(d['parse']['text'])
                  if not text:
                      raise RuntimeError('Synopsis/Summary section not found or empty')
                  return {
                      **ep,
                      'synopsis_found': True,
                      'synopsis': text,
                      'revision_id': d['parse'].get('revid'),
                      'error': None,
                      'source_section': section,
                  }
              except Exception as e:
                  return {**ep, 'synopsis_found': False, 'synopsis': None, 'revision_id': None, 'error': str(e)}

          naruto_index, shippuden_index = get_episode_lists()

          def process(items, label):
              out = [None] * len(items)
              done = 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  futures = {ex.submit(fetch_episode, ep): i for i, ep in enumerate(items)}
                  for future in concurrent.futures.as_completed(futures):
                      i = futures[future]
                      out[i] = future.result()
                      done += 1
                      status = '✓' if out[i]['synopsis_found'] else '✗'
                      print(f'[{label}] {done}/{len(items)} {status} #{out[i]["episode"]:03d}', flush=True)
              return out

          naruto = process(naruto_index, 'Naruto')
          shippuden = process(shippuden_index, 'Shippuden')
          failures = [
              {'series': x['series'], 'episode': x['episode'], 'title': x['title'], 'url': x['url'], 'error': x['error']}
              for x in [*naruto, *shippuden] if not x['synopsis_found']
          ]
          n_ok = sum(x['synopsis_found'] for x in naruto)
          s_ok = sum(x['synopsis_found'] for x in shippuden)
          output = {
              'metadata': {
                  'source': 'Narutopedia',
                  'source_site': ROOT,
                  'source_episode_list': ROOT + '/wiki/List_of_Animated_Media',
                  'language': 'en',
                  'extracted_section': 'Synopsis/Summary',
                  'retrieved_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
                  'attribution': 'Synopsis/Summary text retrieved from Narutopedia / Fandom. Community content is available under CC BY-SA unless otherwise noted.',
                  'purpose': 'Private chronology research/reference for Konoha Gaiden.',
                  'accepted_sections': ['Synopsis', 'Summary'],
              },
              'stats': {
                  'naruto_expected': 220,
                  'naruto_found': len(naruto),
                  'naruto_synopsis_found': n_ok,
                  'shippuden_expected': 500,
                  'shippuden_found': len(shippuden),
                  'shippuden_synopsis_found': s_ok,
                  'total_expected': 720,
                  'total_episode_pages': len(naruto) + len(shippuden),
                  'total_synopsis_found': n_ok + s_ok,
                  'failures': failures,
              },
              'naruto': naruto,
              'shippuden': shippuden,
          }
          if n_ok != 220 or s_ok != 500 or failures:
              raise SystemExit(f'Validation failed: Naruto {n_ok}/220; Shippuden {s_ok}/500; failures={len(failures)}')
          with open(OUT, 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('Validated 720/720 episodes', flush=True)
          PY
          rm -rf KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/SOURCES/narutopedia/.import

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A KONOHA_GAIDEN_ARCS_ZIGRANE_POV_V3/SOURCES/narutopedia
          git commit -m 'Add complete Narutopedia episode synopses source'
          git push
