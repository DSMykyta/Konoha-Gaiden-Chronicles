name: One-time character rename Mikata to Tokara
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-mikata-to-tokara-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Rename character in tracked text and reference paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          pairs = [
              ("МІКАТ", "ТОКАР"), ("Мікат", "Токар"), ("мікат", "токар"),
              ("МИКАТ", "ТОКАР"), ("Микат", "Токар"), ("микат", "токар"),
              ("MIKATA", "TOKARA"), ("Mikata", "Tokara"), ("mikata", "tokara"),
              ("ミカタ", "トカラ"),
          ]
          def rename_string(s):
              for before, after in pairs:
                  s = s.replace(before, after)
              return s

          files = [Path(p.decode()) for p in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if p]
          changed, renamed, embedded = [], [], []
          excluded = ("00_MAIN_WORK_FOLDER/SOURCES/subtitles/", ".github/workflows/rename-mikata-to-tokara-once.yml")
          binary = {".png", ".jpg", ".jpeg", ".psd", ".woff2", ".zip", ".docx", ".xlsx", ".gif", ".webp", ".mp3", ".mp4", ".pdf"}
          for path in files:
              original = path.as_posix()
              if original.startswith(excluded):
                  continue
              if path.suffix.lower() in {".docx", ".xlsx", ".zip"}:
                  try:
                      with zipfile.ZipFile(path) as z:
                          found = [n for n in z.namelist() if (n.endswith(".xml") or n.endswith(".rels")) and any(b.encode("utf-8") in z.read(n) for b,_ in pairs)]
                          if found:
                              embedded.append((original, found[:5]))
                  except (ValueError, zipfile.BadZipFile):
                      pass
                  continue
              if path.suffix.lower() in binary:
                  continue
              raw = path.read_bytes()
              if b"\0" in raw:
                  continue
              try:
                  content = raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              new_content = rename_string(content)
              if new_content != content:
                  path.write_bytes(new_content.encode("utf-8"))
                  changed.append((original, sum(content.count(before) for before,_ in pairs)))
              new_name = rename_string(original)
              if new_name != original:
                  target = Path(new_name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      raise RuntimeError(f"Rename target already exists: {target}")
                  path.rename(target)
                  renamed.append((original, new_name))
          if embedded:
              raise RuntimeError(f"Name appears inside binary Office/ZIP documents, manual handling needed: {embedded}")
          # Exclude original third-party subtitles from renaming and Git history.
          unresolved = []
          for path in [Path(p.decode()) for p in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if p]:
              if path.as_posix().startswith(excluded) or path.suffix.lower() in binary or not path.exists():
                  continue
              b = path.read_bytes()
              if b"\0" in b:
                  continue
              try:
                  s = b.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              if rename_string(s) != s or rename_string(path.as_posix()) != path.as_posix():
                  unresolved.append(path.as_posix())
          if unresolved:
              raise RuntimeError(f"Unresolved old names: {unresolved[:30]}")
          print(f"Text files updated: {len(changed)}, occurrences: {sum(n for _,n in changed)}")
          for path, n in changed:
              print(f"EDIT {path} ({n})")
          print(f"Paths renamed: {len(renamed)}")
          for a,b in renamed:
              print(f"RENAME {a} -> {b}")
          PY
      - name: Check chronology validation
        continue-on-error: true
        shell: bash
        run: |
          python3 00_MAIN_WORK_FOLDER/CHRONOLOGY/validate_timeline.py
          python3 00_MAIN_WORK_FOLDER/CHRONOLOGY/validate_shippuden.py
      - name: Commit rename and delete one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/rename-mikata-to-tokara-once.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rename Yugiri Mikata to Yugiri Tokara throughout project'
          git push origin HEAD:main
