name: Repair Tokara canon identity once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tokara-text-audit-once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Correct childhood descriptions and obsolete substitution notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          replacements = {
           "Iniichi Team/00_CAMPAIGN_INDEX.md": [
             ("Юґірі — дванадцятирічний блондин із сірими очима та короткою косою", "Юґірі — дванадцятирічний генін із коротким сіро-каштановим волоссям без коси та сірими очима"),
             ("Юґірі заміщує Токару в користувацькій гілці", "Юґірі Токара — канонічний генін із команди Ібікі й Хаяте; прізвище Юґірі та подальша біографія — авторські доповнення"),
             ("у дванадцять років світле волосся заплетене в коротку косу", "у дванадцять років коротке сіро-каштанове волосся без коси"),
           ],
           "00_MAIN_WORK_FOLDER/GAMES/INIICHI_TEAM/00_INDEX.md": [
             ("Тут йому дванадцять: світла коротка коса, сірі очі", "Тут йому дванадцять: коротке сіро-каштанове волосся без коси, сірі очі"),
           ],
           "00_MAIN_WORK_FOLDER/GAMES/INIICHI_TEAM/01_CHRONOLOGY.md": [
             ("За покоління до основних подій збірки: Іноїчі, Ібікі та Хаяте тут — щойно випущені діти, а Юґірі Токара — їхній ровесник.", "За покоління до основних подій збірки: Ібікі, Хаяте та Юґірі Токара тут — щойно випущені геніни, а Яманака Іноїчі — їхній дорослий наставник."),
           ],
           "00_MAIN_WORK_FOLDER/05_MASTER_ZVIT.md": [
             ("Іноїчі, Ібікі, Хаяте — діти; Юґірі Токара — їхній ровесник.", "Ібікі, Хаяте та Юґірі Токара — юні геніни; Яманака Іноїчі — їхній дорослий наставник."),
           ],
           "Iniichi Team/03_CHARACTERS_AND_KNOWLEDGE.md": [
             ("дванадцятирічний хлопець; блондин; сірі очі; світле волосся заплетене в коротку косу", "дванадцятирічний хлопець; коротке сіро-каштанове волосся без коси; сірі очі"),
           ],
           "Iniichi Team/05_RETRIEVAL_INDEX.md": [
             ("коротка коса зі світлого волосся Юґірі", "коротке сіро-каштанове волосся Юґірі"),
             ("дитяча зачіска Юґірі | заплетена коротко", "дитяча зачіска Юґірі | коротке, без коси"),
           ],
           "Iniichi Team/01_LIVE_STATE.md": [
             ("одяг кандидата; коротка світла коса; малий рюкзак поруч", "одяг кандидата; коротке сіро-каштанове волосся без коси; малий рюкзак поруч"),
           ],
           "Iniichi Team/07_RAW_SCENE_LOG.md": [
             ("Коротка коса Юґірі ледь діставала коміра.", "Коротке сіро-каштанове волосся Юґірі намокло під дощем."),
           ],
           "00_MAIN_WORK_FOLDER/GAMES/INIICHI_TEAM/ARCS/arc 01 [Жетон і зникла скриня].txt": [
             ("КОМАНДА ІНОЇЧІ — ДИТИНСТВО ЮҐІРІ МІКАТИ", "КОМАНДА ІНОЇЧІ — ДИТИНСТВО ЮҐІРІ ТОКАРИ"),
             ("Юґірі Токара — дванадцятирічний блондин із сірими очима, чия коротка світла коса ледь діставала коміра.", "Юґірі Токара — дванадцятирічний хлопець із коротким сіро-каштановим волоссям і сірими очима."),
           ],
           "Kalendar_Konoha/SOURCE_LOGS/konoha_kalendar_chat_gpt5_6.txt": [
             ("Токара (oc)", "Токара"),
           ],
          }

          changes=[]
          for name, rules in replacements.items():
              p=Path(name)
              s=p.read_text(encoding="utf-8")
              old=s
              for before,after in rules:
                  n=s.count(before)
                  if n!=1:raise RuntimeError(f"Expected one occurrence of {before!r} in {name}, got {n}")
                  s=s.replace(before,after,1)
              if s!=old:
                  p.write_text(s,encoding="utf-8")
                  changes.append((name,len(rules)))
          # Fix genuinely missed name mentions, not substrings in unrelated verbs
          rx=re.compile(r'(?<![^\W\d_])(?:МІКАТИ|МІКАТА|Мікати|Міката|мікати|міката|Mikata|MIKATA)(?![^\W\d_])',re.U)
          variants={"МІКАТИ":"ТОКАРИ","МІКАТА":"ТОКАРА","Мікати":"Токари","Міката":"Токара","мікати":"токари","міката":"токара","Mikata":"Tokara","MIKATA":"TOKARA"}
          updated=[]; count=0
          for raw in subprocess.check_output(["git","ls-files","-z"]).split(b'\0'):
              if not raw:continue
              p=Path(raw.decode("utf-8"))
              if not p.is_file() or p.suffix.lower() in {".png",".jpg",".jpeg",".psd",".woff2",".zip",".docx",".xlsx",".pdf",".gif",".webp"}:continue
              if "SOURCES/subtitles/" in p.as_posix() or p.as_posix().startswith(".github/workflows/"):continue
              try:s=p.read_text(encoding="utf-8")
              except (UnicodeDecodeError,OSError):continue
              t,n=rx.subn(lambda m:variants[m.group()],s)
              if n:
                  p.write_text(t,encoding="utf-8")
                  updated.append((str(p),n))
                  count+=n

          # Check what matters; adult braid descriptions intentionally remain
          for name in [
            "Iniichi Team/00_CAMPAIGN_INDEX.md",
            "Iniichi Team/01_LIVE_STATE.md",
            "Iniichi Team/03_CHARACTERS_AND_KNOWLEDGE.md",
            "Iniichi Team/05_RETRIEVAL_INDEX.md",
            "00_MAIN_WORK_FOLDER/GAMES/INIICHI_TEAM/00_INDEX.md",
            "00_MAIN_WORK_FOLDER/GAMES/INIICHI_TEAM/ARCS/arc 01 [Жетон і зникла скриня].txt",
          ]:
              s=Path(name).read_text(encoding="utf-8")
              bad=("коротка світла коса","коротка коса","заплетена коротко","дванадцятирічний блондин")
              if any(v in s for v in bad):
                  raise RuntimeError(f"Uncorrected childhood description: {name}")
          for p in [Path("Iniichi Team/00_CAMPAIGN_INDEX.md"),Path("00_MAIN_WORK_FOLDER/GAMES/INIICHI_TEAM/01_CHRONOLOGY.md"),Path("00_MAIN_WORK_FOLDER/05_MASTER_ZVIT.md")]:
              s=p.read_text(encoding="utf-8")
              if "Юґірі заміщує Токару" in s or "Іноїчі, Ібікі, Хаяте — діти" in s or "Іноїчі, Ібікі та Хаяте тут — щойно випущені діти" in s:
                  raise RuntimeError(f"Uncorrected identity/mentor contradiction: {p}")
          print("EXPLICIT_CORRECTIONS",changes)
          print("OLD_NAME_CLEANUP",updated,"COUNT",count)
          PY
      - name: Commit corrections and remove temporary audit workflow
        shell: bash
        run: |
          rm .github/workflows/tokara-text-audit-once.yml
          git add -A
          git -c core.whitespace=-blank-at-eol diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct young Tokara appearance and remove rename contradictions'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1