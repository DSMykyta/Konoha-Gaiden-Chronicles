  title: Кіта, Рен і Сора зустрічають Наруто після Країни Хвиль
  text: Після повернення Команди 7 друзі не можуть потрапити до Наруто в шпиталь і зустрічають його згодом в Ічіраку. Права рука Наруто перебинтована, тому він їсть лівою. Між порціями він згадує Хаку, його крижані дзеркала та загибель обох шинобі на мосту. Кіба тримає його за руку, Акамару кладе морду на коліно, а Аяме відвертається до котлів. Кіта, Рен і Сора слухають друга, який повернувся з першого справжнього бою.
