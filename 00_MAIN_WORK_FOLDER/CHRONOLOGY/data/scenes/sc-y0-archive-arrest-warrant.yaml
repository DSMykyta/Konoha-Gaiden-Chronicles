  title: Хірузен санкціонує затримання після доповіді Мікати
  text: 'Міката подає Хірузену зібрану справу: фотографії передачі сувою, перелік виведених матеріалів і графік зустрічей. Какаші ознайомлюється з доказами присутності зв’язкового Іви та участі старшої працівниці архіву. Хірузен підписує ордер і затверджує операцію Відділу розвідки та допитів. Какаші має перекрити зовнішній периметр так, щоб під час затримання ніхто не залишив будівлю; Міката забезпечить роботу всередині.'
