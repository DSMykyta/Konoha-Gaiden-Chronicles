  text: 'Какаші бере D-ранг № 412: прибрати подвір’я пана Хіґураші та винести старі меблі. Адреса лежить навпроти будинку Сакури й балкона Юміко. Учні працюють увесь день, а наставник чекає нагоди побачити жінку. Сакура зрештою пояснює, що Юміко поїхала до батьків; її відсутність у місті не була відповіддю на поведінку Какаші.'
