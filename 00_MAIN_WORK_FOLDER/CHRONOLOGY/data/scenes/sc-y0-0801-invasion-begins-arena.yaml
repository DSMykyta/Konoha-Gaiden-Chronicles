- id: ev-y0-0801-aoba-breaks-genjutsu-identifies-kabuto
  title: Аоба знімає гендзюцу й викриває Кабуто
  text: Аоба розриває сонне гендзюцу на арені й помічає, що джерелом техніки є Кабуто, замаскований під шинобі АНБУ Конохи.
    Після викриття він переходить до відкритого бою з нападниками; в аніме його атаку деталізовано вогняною технікою
    проти кількох ворогів.
