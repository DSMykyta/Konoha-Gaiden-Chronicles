- id: ev-y0-0801-raido-wounded-by-sound-four
  title: Четвірка Звуку тяжко ранить Райдо
  text: Коли Орочімару атакує Хірузена, Райдо намагається втрутитися. Четвірка Звуку, замаскована під охоронців Казекаґе,
    атакує Райдо; він дістає тяжкі поранення і втрачає свідомість, через що не може допомогти Хокаґе.
