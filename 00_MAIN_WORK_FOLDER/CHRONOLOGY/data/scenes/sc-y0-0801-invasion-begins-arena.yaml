- id: ev-y0-0801-genma-confronts-baki-dispatches-sasuke
  title: Ґенма переходить від іспиту до оборони Конохи
  text: Коли напад стає очевидним, Ґенма з’ясовує, чи за ним стоїть Орочімару, і сходиться з Бакі. Після відступу пораненого
    Ґаари він говорить Саске, що іспит для нього закінчено, оцінює його як уже достатньо підготовленого для рівня чуніна
    й наказує діяти як шинобі Конохи — переслідувати Ґаару. Ґенма не дає Бакі зупинити Саске й продовжує бій із ним.
