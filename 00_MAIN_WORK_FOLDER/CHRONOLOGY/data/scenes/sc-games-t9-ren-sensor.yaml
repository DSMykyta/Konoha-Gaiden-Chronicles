  text: 'Під час гри із зав’язаними очима Рен відстежує Кібу й Акамару. Тихий блінк Кіти та прихований крок Сори допомагають відділити це сприйняття від звичайного слуху. Рен уперше отримує ясний доказ власної здібності, яку раніше не міг назвати. Радість пов’язана не лише з користю для бою: він перестає бачити себе найповільнішим у трійці.'
