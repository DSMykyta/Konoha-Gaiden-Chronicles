  title: Саске викриває другу підміну; Орочімару залякує його й Сакуру
  text: Другий підроблений Наруто безпомилково повторює пароль. Саске розуміє, що справжній Наруто його не запам’ятав би.
    Нападник постає як генін Трави Шіоре, ковтає сувій і нав’язує Саске та Сакурі видіння смерті. Саске опановує себе й відводить
    Сакуру від безпосередньої атаки, але нападник знову їх наздоганяє.
