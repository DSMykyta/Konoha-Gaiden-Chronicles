  text: Команда приходить до кабінету куратора полоненого. Діти одразу відчувають сильний дискомфорт від спокійної, але психологічно тиснучої манери Токари. Наруто відволікається на яскраво-рожеве гумове жабеня серед похмурого службового кабінету, Сакура інстинктивно тримається ближче до Какаші, а Саске насторожується й закривається.
