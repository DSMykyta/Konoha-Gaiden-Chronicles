  title: Наруто виманює справжню Команду Оборо нічним боєм клонів
  text: Розпізнавши ілюзорні клони, Наруто маскує свої тіньові клони під товаришів і б’ється всю ніч, поки справжні Саске,
    Сакура й Кабуто відпочивають. Коли Оборо, Каґарі та Мубі виходять добити нібито виснажену групу, їх оточують. Кабуто зазнає
    поранення, захищаючи Наруто й створюючи нагоду для його атаки. Попри витрату чакри Наруто збиває всіх трьох генінів Дощу.
