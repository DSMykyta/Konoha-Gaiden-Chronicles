  title: Кіба повертається додому
  text: 'Сам не помітивши як, Кіта доходить до вулиць біля кварталу клану Інузука. Там він бачить Кібу й Акамару, які саме повертаються після дня зі своєю командою. Кіба помічає Кіту, перекидається з ним кількома словами й швидко забігає додому; за кілька хвилин знову виходить до нього.'
