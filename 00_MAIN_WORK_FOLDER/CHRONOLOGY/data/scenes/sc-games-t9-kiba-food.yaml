  title: Кіта блукає Конохою
  text: 'Після випробування на Полі 9 Кіта не поспішає додому. Його не відпускає провал у бою й слова Райдо про те, що він ще подумає, чи брати Команду 9. Кіта без мети ходить вулицями Конохи, дедалі більше віддаляючись від тренувальних полів, поки день переходить у вечір.'
