  title: Коноха пропонує Іві обмін полоненого
  text: Після завершення допиту Рада відмовляється від страти шпигуна й погоджується використати його в обміні. Хірузен відкриває дипломатичний канал із Країною Землі, а Ібікі залишає чоловіка ізольованим під вартою до підтвердження домовленості. Перемовини визначають зустрічний предмет передачі, прикордонну точку й безпечний порядок конвоювання. Архівна операція вже завершена; нова мета — передати живого полоненого в межах угоди.
