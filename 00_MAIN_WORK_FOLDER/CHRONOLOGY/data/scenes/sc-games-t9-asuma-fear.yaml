  text: Після відмови від понаднормового D-рангу Кіта приходить на погоджене особисте заняття. Асума говорить із ним про страх помилки й про те, як рахувати власний ресурс. Він добровільно дає долоню для короткої вогняної перевірки; Кіта потім пробує лікувати опік, але ще не може повністю відновити шкіру. Наприкінці Асума дає йому пляшку води. Урок поєднує практику з підтримкою після важкого тижня.
