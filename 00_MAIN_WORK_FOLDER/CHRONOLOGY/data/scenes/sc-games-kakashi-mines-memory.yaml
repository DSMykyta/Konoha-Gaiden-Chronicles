  text: 'Тензо руйнує основу шахт так, щоб це виглядало як природний зсув. Міката виходить із табору та переносить зліпок пережитого прикриття в пам’ять справжнього Дайкі. Какаші залишає найманця в правдоподібному місці після п’яної сварки й падіння. Група ховає біологічні сліди перетворення та відходить: участь Конохи має залишитися невидимою.'
