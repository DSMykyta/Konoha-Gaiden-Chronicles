  title: Какаші оплачує спільний вечір після шахт
  text: Увечері Ґенма запрошує колег до ізакаї за рахунок Какаші. До групи після шахт долучаються Асума, Куренай, Райдо, Нобарі, Анко, Аоба, Ірука, Ґай та Ебісу. Міката вже повернувся після відновлення. Вони жартують про прикриття та операцію, а Какаші ухиляється від запитань про Юміко. Вечір закінчує небезпечний вихід, тоді як ранкова доповідь ще попереду.
