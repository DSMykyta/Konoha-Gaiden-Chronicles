  text: Після тренування Команди 7 Сакура називає Какаші ім’я Юміко й пояснює, що вони сусідки. Вона також зізнається, що Юміко розпитувала її про наставника після перших двох зустрічей, а її власні слова про запізнення, книжку та дивний погляд могли налякати жінку. Какаші тепер пов’язує її реакції з цією розмовою та недавнім затриманням працівниць архіву.
