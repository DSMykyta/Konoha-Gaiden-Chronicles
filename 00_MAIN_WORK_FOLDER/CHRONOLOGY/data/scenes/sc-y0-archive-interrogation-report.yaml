  title: Ібікі передає Хірузену результати допиту Івівця
  text: Ібікі зводить перевірені відомості з допиту зв’язкового та передає Хірузену службовий звіт. Коноха отримала потрібні дані про ворожого посередника й архівний канал, тому подальше утримання полоненого вже не потрібне для продовження цієї операції. Шпигун живий і залишається під охороною; рішення про його долю переходить зі слідчої процедури до політичного й дипломатичного рівня.
