  title: Токара починає працювати в архіві під цивільним прикриттям
  text: Токара входить до цивільного реєстру як новий працівник і вбудовується у звичну обробку документів. Під прикриттям повсякденної роботи він перевіряє, які фонди відкривають, хто має доступ до закритих медичних карток і як оформлюють передачу матеріалів за межі сектора. Його увага сходиться на старшій архівістці, через яку проходять потрібні пакети. Какаші забезпечує зовнішню частину операції, поки всередині Токара збирає підтвердження й не дає підозрюваній помітити перевірку.
