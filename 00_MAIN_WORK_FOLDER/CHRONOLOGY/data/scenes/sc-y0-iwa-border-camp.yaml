- id: ev-y0-iwa-naruto-asks-mentor
  title: Наруто звертається до Какаші як до дорослого наставника
  text: Пізніше, коли Саске й Сакура вже сплять, Наруто залишається з Какаші на нічній варті й ставить йому особисті питання про дорослішання та власне тіло. Какаші відповідає спокійно й без насмішок, фактично вперше дозволяючи Наруто звертатися до нього не лише як до командира, а і як до старшого чоловіка, якому можна поставити незручне особисте питання.
