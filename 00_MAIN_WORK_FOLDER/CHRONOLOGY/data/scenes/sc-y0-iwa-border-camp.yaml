  title: Команда обговорює долю полоненого
  text: 'Біля багаття Наруто, Сакура й Саске повертаються до поведінки переданого Іві шпигуна. Какаші пояснює, що у Відділі розвідки та допитів використовують різні способи зламу: фізичний тиск, техніки роботи зі свідомістю та психологічні методи Мікати. Він прямо пов''язує поведінку полоненого з роботою Мікати й пояснює дітям, чому людина може бути фізично неушкодженою, але фактично втратити здатність чинити опір.'
