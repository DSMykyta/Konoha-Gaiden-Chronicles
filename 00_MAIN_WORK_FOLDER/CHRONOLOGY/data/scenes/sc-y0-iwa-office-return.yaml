  title: Анко направляє Команду 7 до Ібікі
  text: Команда повертається до кабінету Мікати із сувоєм Іви, але замість нього знаходить Анко. Вона спочатку дозволяє собі грубий коментар про відсутнього Мікату й лише потім помічає трьох генінів за спиною Какаші. Анко повідомляє, що Міката працює під прикриттям і не повернеться найближчим часом, тому прийняти сувій може Ібікі на нижньому рівні Відділу.
