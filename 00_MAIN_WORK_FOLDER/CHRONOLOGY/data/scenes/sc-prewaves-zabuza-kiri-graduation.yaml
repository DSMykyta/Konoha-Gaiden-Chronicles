title: "Юний Забуза зриває кривавий випускний іспит у Кірі"
description: "У добу Кривавого Туману випускники Академії Кіріґакуре змушені битися між собою на смерть. Забуза, який сам ще не навчався в Академії, вбиває понад сотню кандидатів, після чого цей порядок випускних випробувань скасовують. Під час першого бою з ним Какаші пізніше розповість про цю подію Наруто, Саске й Сакурі."
