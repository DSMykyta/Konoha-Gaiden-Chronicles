schema_version: 1
arcs:
- id: arc-y0-scroll-of-seals
  continuity_id: main
  title: Наруто і Сувій Печатей
  description: >-
    Після витівки на Монументі Хокаґе Наруто знову опиняється між прагненням привернути увагу й осудом села, яке приховує від нього правду про Дев’ятихвостого. Провал випускного іспиту робить його вразливим до обману Мідзукі: викрадений Сувій Печатей стає приманкою для зради. Ірука рятує учня, визнає його особистість, а Наруто захищає наставника новою технікою та здобуває протектор геніна. Наступне знайомство з Конохамару показує, що обом хлопцям доведеться добиватися визнання власними силами.
  period_id: part-i
  kind: canonical
- id: arc-y0-genin-formation
  continuity_id: main
  title: Розподіл на команди
  description: >-
    Після випуску юні шинобі Конохи отримують перші команди й наставників. Суперництво Наруто із Саске та захоплення Сакури Саске роблять Команду 7 внутрішньо роз’єднаною ще до першої спільної місії; водночас складаються Команди 8 і 10. [[project|У розширеній історії Ірука також оголошує Команду 9 з Кітою, Реном і Сорою, а їхнім наставником стає Райдо.]] Запізнілий Какаші вислуховує цілі трьох учнів, а під час випробування з двома дзвіночками змушує їх зрозуміти, що перемога окремого бійця не дорівнює успіху команди. Паралельні події інших команд збережено у власних сюжетних лініях.
  period_id: part-i
  kind: canonical
- id: arc-y0-chunin-exams
  continuity_id: main
  title: Іспит на чуніна
  redirect_ids: [arc-games-t9-chunin]
  description: >-
    Після повернення Команди 7 з Країни Хвиль Коноха приймає генінів з інших селищ на іспит на чуніна. Випускники Академії вперше бачать, скільки суперників існує за межами їхнього звичного кола: Ґаара, Темарі, Канкуро, Рок Лі та команда Звуку. Наставники висувають підлеглих, Ірука сумнівається в їхній готовності, а Какаші залишає учням особистий вибір. Перевірка біля реєстрації та зустріч із Кабуто передують письмовому етапу Ібікі; потім кандидати вирушають до Лісу Смерті, проходять попередні бої, тренуються до фіналу та опиняються в центрі вторгнення. Події різних команд і паралельні дії наставників відбуваються в одному світі й розміщені на спільній часовій осі.
  description_project: >-
    В інтегрованій хронології Команда 9 проходить той самий іспит
    одночасно з іншими кандидатами. Райдо заявляє її на нараді,
    а Кіта, Рен і Сора мають власні моменти всередині спільних етапів.
  period_id: part-i
  kind: canonical

