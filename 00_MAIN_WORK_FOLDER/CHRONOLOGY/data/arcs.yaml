  description: >-
    Суна проводить позачерговий іспит перед Четвертою війною. Після порятунку команди Конохамару
    Наруто сам виходить на арену як генін. Конохамару змагається з ним, демонструє нові техніки й
    нарешті завдає удару. Наруто використовує Режим мудреця всупереч правилам; перемогу
    присуджують Конохамару, який отримує ранг чуніна.
  period_id: shippuden
  kind: alternate
