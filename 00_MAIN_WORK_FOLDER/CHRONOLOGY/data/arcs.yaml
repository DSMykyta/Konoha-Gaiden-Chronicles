- id: arc-s2-second-chunin-exams
  continuity_id: main
  title: Другий іспит на чуніна — Шляхи друзів
  description: >-
    Цунаде й Ґаара домовляються провести спільний іспит у Конохі та Суні. Поки Наруто навчається в Джираї,
    його друзі проходять письмове випробування Шикамару, змагаються за сувої у Пустелі Демонів і стикаються
    з прихованою змовою проти джінчурікі. Неджі рятує Ґаару й Фу; після скасування фінальних боїв комісія
