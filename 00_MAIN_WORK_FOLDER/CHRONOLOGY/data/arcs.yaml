- id: arc-y0-land-of-waves
  continuity_id: main
  period_id: part-i
  kind: canonical
  title: Країна Хвиль
  description: >-
    Після низки дрібних доручень Команда 7 отримує першу місію за межами Конохи: супроводити мостобудівника Тадзуну до Країни Хвиль. Напади найманців викривають справжню небезпеку завдання та владу Ґато над заляканими мешканцями. Перша сутичка із Забузою змушує Наруто, Саске й Сакуру вчитися довіряти Какаші й одне одному, а тренування контролю чакри готують їх до нового бою. Історії Хаку, Забузи, Інарі та його родини розкривають ціну відданості, втрати й спротиву. На мосту долі супротивників і захисників перетинаються; після загибелі Забузи й Хаку мешканці знаходять мужність захистити власне майбутнє, а завершений міст отримує ім’я Наруто.

