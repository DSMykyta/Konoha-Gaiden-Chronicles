  period_id: part-i
  kind: project
- id: arc-games-kakashi-team9-escort
  continuity_id: main
  title: Команда 9 — ескорт
  description: Какаші тимчасово очолює ескорт із Командою 9, яку вже перевіряв під час відсутності Райдо. Новий тест і недоречний жарт ускладнюють взаємодію. Засідка, нічліг і спільний привал показують йому, як трійка підтримує одне одного в роботі.
  period_id: part-i
  kind: project
- id: arc-games-kakashi-after-valley
  continuity_id: main
  title: Після Долини Завершення
  description: Какаші повертає пораненого Наруто й переживає провал погоні. Службова робота та особиста втеча від Юміко приводять його до виснаження, а розмова у Нобарі знову ставить питання про зниклу Команду 9.
  period_id: part-i
  kind: project
