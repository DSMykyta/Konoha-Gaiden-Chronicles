  continuity_id: alt-waterfall-novel
  period_id: part-i
  kind: alternate
  title: 'Суїєн і Вода Героїв'
  description: 'Суїєн намагається захопити Воду Героїв, шантажуючи Шібукі життями мешканців Такіґакуре. Сенджі й Наруто чинять опір нападникам; боротьба завершується небезпечними наслідками використання води та затриманням спільників Суїєна.'
- id: arc-y0-iwa-prisoner
  continuity_id: main
  title: Полонений Іви
  description: Команда 7 отримує завдання доставити допитаного шпигуна Іви до північного кордону Країни Вогню для обміну. Перед виходом Міката таємно попереджає Какаші про можливе втручання Кореня. Дорогою учні бачать наслідки психологічного зламу полоненого, завершують обмін і після повернення стикаються вже з фізичними методами Відділу розвідки та допитів.
  period_id: part-i
  kind: project
- id: arc-y0-team9-archive3b
  continuity_id: main
  title: Архів, сектор 3-Б
  description: Після кількох тижнів тренувань, складів і доставок Команда 9 отримує D-рангову роботу в архівному корпусі з обмеженим доступом. Під час перенесення стелажів Райдо, Кіта, Рен і Сора виявляють небезпечну схованку в секторі 3-Б. Нестача однієї одиниці вантажу та свіжий слід у пилу змушують зупинити списання. Команду виводять із сектора й проводять через знезараження, а перевірка знахідки переходить до адміністрації та фахівців.
  period_id: part-i
  kind: project
- id: arc-y0-archive-leak
  continuity_id: main
  title: Справа архіву
  description: Зупинене після знахідки Команди 9 списання запускає перевірку архівного корпусу. За старим медичним маркуванням виявляють викрадені матеріали, навмисно захищені небезпечним забрудненням, а звірка документів виводить розвідку на витік із цивільного реєстру. Хірузен доручає Какаші забезпечити зовнішню частину операції, а Мікаті — проникнути в архів під прикриттям. Зібрані докази дозволяють затримати старшу архівістку, її співучасниць і зв’язкового Іви; після допиту Коноха погоджує обмін полоненого на кордоні.
  period_id: part-i
  kind: project
- id: arc-games-t9-first-skills
  continuity_id: main
  title: Перші тренування Команди 9
  description: Після перевірки Райдо учні пробують механічні ляльки, позичені чакропровідні клинки та перші медичні вправи. Іщін приносить кожному власну зброю. Сора вчиться координувати трійку, а складські D-ранги дають команді першу платню.
  period_id: part-i
  kind: project
- id: arc-games-t9-thread-blink
  continuity_id: main
  title: Чакронитка і перший блінк
  description: Після архівної роботи команда розвиває власні прийоми. Кіта вчиться контролювати нитку, переживає небезпечні спроби з вогнем і вперше переміщується на коротку відстань; Асума підтримує ці вправи, поки Райдо залишається наставником.
  period_id: part-i
  kind: project
- id: arc-games-t9-preexam
  continuity_id: main
  title: Передіспитові тижні
  description: Команда підтримує дружбу з генінами інших загонів і перевіряє, що вміє перед міжнародним іспитом. Сенсорика Рена, прихований рух Сори та блінк Кіти поступово стають частинами спільної роботи.
  period_id: part-i
  kind: project
- id: arc-games-t9-anko-transfer
  continuity_id: main
  title: Передача Команди 9 Анко
  description: Відразу після провалу другого етапу живий Хірузен передає Команду 9 Анко. Райдо повертається до охорони; наступного ранку вона
    перевіряє витривалість, особисті прийоми та взаємодію трійки.
  period_id: part-i
  kind: project
- id: arc-games-t9-nobari-medical-mission
  continuity_id: main
  title: Місія Нобарі
  description: Нобарі супроводжує Команду 9 на медичний D-ранг у сусіднє поселення. Трійка допомагає польовому шпиталю,
    лікар показує результат роботи Кіти, а після повернення Нобарі розповідає про місію наставникам.
  period_id: part-i
  kind: project
- id: arc-games-t9-death-forest-fence
  continuity_id: main
  title: Огорожа Лісу Смерті
  description: Команда 9 перевіряє периметр Лісу Смерті, розробляє схему підміни й дізнається, що через поранення Анко їй знову потрібен тимчасовий керівник.
  period_id: part-i
  kind: project
- id: arc-games-t9-touno-asuma
  continuity_id: main
  title: Тоуно, Асума і перша пляшка
  description: Тоуно тимчасово веде Команду 9 й вимірює її ресурси, але порушення домовленостей руйнує співпрацю. Асума допомагає Кіті з вогнем, страхом і безпечним контролем чакри; після відмови Тоуно трійка зберігає спільні заняття з іншими командами.
  period_id: part-i
  kind: project
- id: arc-games-t9-anko-return
  continuity_id: main
  title: Повернення Анко і нові межі чакри
  description: Після лікування Анко повертається до Команди 9. Трійка перевіряє Б-4 на рухомій цілі, а Кіта продовжує вітер і небезпечні спроби з віддаленим вогнем під наглядом дорослих.
  period_id: part-i
  kind: project
- id: arc-games-t9-tanigawa
  continuity_id: main
  title: Танігава — перша кров
  description: Доставка медикаментів перетворюється на постановочну засідку. Команда завдає тяжких поранень знайомим шинобі й допомагає їх стабілізувати. Повернувшись, учні та дорослі намагаються осмислити наслідки непропорційної відповіді на напад.
  period_id: part-i
  kind: project
- id: arc-games-t9-long-base2
  continuity_id: main
  title: Довга місія — База 2
  description: Запечатаний наказ відправляє Команду 9 без постійного наставника на довгий невідомий маршрут. На Базі 2 трійка стикається з лабораторними дослідами, полоненим із Проклятою Печаткою та необхідністю приховати сліди операції.
  period_id: part-i
  kind: project
- id: arc-games-t9-long-base18
  continuity_id: main
  title: Довга місія — База 18
  description: На третьому місяці маршруту команда ліквідовує центральний лабораторний комплекс. Прокляті досліди, масова загибель полонених і знищення бази стають частиною досвіду, з яким трійка має жити далі.
  period_id: part-i
  kind: project
- id: arc-games-kakashi-yumiko-first
  continuity_id: main
  title: Юміко — перші зустрічі
  description: Випадкові зустрічі з Юміко показують Какаші мирне життя з незручного для нього боку. Після архівної операції його особиста увага вже не зводиться до звичайної спостережливості, але він намагається не використати службову силу для знайомства.
  period_id: part-i
  kind: project
- id: arc-games-kakashi-after-iwa
  continuity_id: main
  title: Після місії Іви — будинок навпроти
  description: Після конвою Команда 7 повертається до звичайних D-рангів. Какаші бере роботу поруч із будинком Сакури, але відсутність Юміко не дозволяє перетворити місію на очікуване знайомство.
  period_id: part-i
  kind: project
- id: arc-games-kakashi-yumiko-return
  continuity_id: main
  title: Повернення Юміко
  description: Юміко повертається від батьків і зустрічає Какаші за обідом. Він називає свої звичні дні, але ще не вміє відділити просте запрошення від надмірного внутрішнього очікування.
  period_id: part-i
  kind: project
- id: arc-games-kakashi-shukuba
  continuity_id: main
  title: Шукуба — передача розвідданих
  description: Команда 7 вирушає до Шукуби під цивільним прикриттям і отримує від Мікати дані про приховане постачання. Після повернення виникає окремий слід до адміністративних документів і нове завдання щодо найманців Іви.
  period_id: part-i
  kind: project
- id: arc-games-kakashi-iwa-mines
  continuity_id: main
  title: Шахти Іви та обвал
