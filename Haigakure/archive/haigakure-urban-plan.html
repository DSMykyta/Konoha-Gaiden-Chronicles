<div id="haigakure-plan">
  <style>
    #haigakure-plan {
      width: 100%;
      color: var(--foreground);
    }
    #haigakure-plan .plan-heading {
      margin: 0 0 0.25rem;
    }
    #haigakure-plan .plan-note {
      margin: 0 0 0.75rem;
      color: var(--muted-foreground);
    }
    #haigakure-plan .plan-map {
      display: block;
      width: 100%;
      min-width: 640px;
      height: auto;
      color: var(--foreground);
    }
    #haigakure-plan .map-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }
    #haigakure-plan .boundary {
      fill: color-mix(in srgb, var(--muted) 24%, transparent);
      stroke: var(--border);
      stroke-width: 4;
    }
    #haigakure-plan .forest-buffer {
      fill: color-mix(in srgb, var(--viz-series-6) 8%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-6) 55%, var(--border));
      stroke-width: 2;
      stroke-dasharray: 8 7;
    }
    #haigakure-plan .clan-zone {
      fill: color-mix(in srgb, var(--viz-series-2) 18%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-2) 72%, var(--border));
      stroke-width: 2;
    }
    #haigakure-plan .civilian-belt {
      fill: color-mix(in srgb, var(--viz-series-6) 11%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-6) 45%, var(--border));
      stroke-width: 2;
      stroke-dasharray: 6 7;
      fill-rule: evenodd;
    }
    #haigakure-plan .civic-zone {
      fill: color-mix(in srgb, var(--viz-series-1) 17%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-1) 72%, var(--border));
      stroke-width: 2;
    }
    #haigakure-plan .research-zone {
      fill: color-mix(in srgb, var(--viz-series-3) 18%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-3) 72%, var(--border));
      stroke-width: 2;
    }
    #haigakure-plan .trade-zone {
      fill: color-mix(in srgb, var(--viz-series-4) 18%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-4) 72%, var(--border));
      stroke-width: 2;
    }
    #haigakure-plan .security-zone {
      fill: color-mix(in srgb, var(--viz-series-5) 17%, transparent);
      stroke: color-mix(in srgb, var(--viz-series-5) 72%, var(--border));
      stroke-width: 2;
    }
    #haigakure-plan .reserve-zone {
      fill: color-mix(in srgb, var(--muted) 28%, transparent);
      stroke: var(--muted-foreground);
      stroke-width: 2;
      stroke-dasharray: 7 6;
    }
    #haigakure-plan .main-road {
      fill: none;
      stroke: color-mix(in srgb, var(--viz-series-4) 75%, var(--foreground));
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #haigakure-plan .secondary-road {
      fill: none;
      stroke: var(--muted-foreground);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #haigakure-plan .ring-road {
      fill: none;
      stroke: var(--border);
      stroke-width: 4;
      stroke-dasharray: 10 7;
    }
    #haigakure-plan .checkpoint {
      fill: var(--card);
      stroke: var(--foreground);
      stroke-width: 3;
    }
    #haigakure-plan .map-label {
      fill: var(--foreground);
      font-family: inherit;
      font-size: 20px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    #haigakure-plan .map-label-small {
      fill: var(--muted-foreground);
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    #haigakure-plan .direction-label {
      fill: var(--foreground);
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      text-anchor: middle;
    }
    #haigakure-plan .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      margin-top: 0.75rem;
    }
    #haigakure-plan .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    #haigakure-plan .swatch {
      width: 0.9rem;
      height: 0.9rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      flex: 0 0 auto;
    }
    #haigakure-plan .swatch-clan { background: color-mix(in srgb, var(--viz-series-2) 38%, transparent); }
    #haigakure-plan .swatch-civilian { background: color-mix(in srgb, var(--viz-series-6) 32%, transparent); }
    #haigakure-plan .swatch-civic { background: color-mix(in srgb, var(--viz-series-1) 38%, transparent); }
    #haigakure-plan .swatch-research { background: color-mix(in srgb, var(--viz-series-3) 38%, transparent); }
    #haigakure-plan .swatch-trade { background: color-mix(in srgb, var(--viz-series-4) 38%, transparent); }
    #haigakure-plan .swatch-security { background: color-mix(in srgb, var(--viz-series-5) 38%, transparent); }
    #haigakure-plan .swatch-reserve { background: color-mix(in srgb, var(--muted) 55%, transparent); }
    @media (max-width: 480px) {
      #haigakure-plan .minor-label { display: none; }
    }
  </style>
