<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Інтерактивна хронологія: персонажі, події та їхні зв’язки.">
  <title>Хронологія</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/js-yaml.min.js" defer></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Навігація та персонажі">
    <div class="side-header"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6c6 0 7 12 18 12M3 12c7 0 11 0 18 0M3 18C9 18 10 6 21 6"/></svg></span><span class="brand">Хронологія</span><button class="icon-button close-sidebar" data-action="sidebar" aria-label="Закрити бічну панель" data-icon="panel"></button></div>
    <button class="side-search" data-action="search"><span data-icon="search"></span><span>Знайти подію</span><kbd>⌘ K</kbd></button>
    <div class="side-section"><div class="section-heading"><span>Персонажі</span><button class="text-button" id="clear-selection">Скинути</button></div><label class="sr-only" for="character-search">Пошук персонажа</label><input id="character-search" class="character-search" placeholder="Знайти персонажа…" autocomplete="off"></div>
    <div id="characters" class="character-list"><div class="loading-lines"><i></i><i></i><i></i></div></div>
    <div class="side-bottom"><button class="side-link" data-action="records"><span data-icon="list"></span><span>Усі записи</span><span class="count" id="record-count">—</span></button><button class="side-link" data-action="source"><span data-icon="database"></span><span>Дані хронології</span></button><div class="sync-status"><span id="sync-status">Завантаження…</span><button class="icon-button" id="refresh" aria-label="Оновити дані" data-icon="refresh"></button></div></div>
  </aside>
  <div class="sidebar-scrim" data-action="sidebar"></div>
  <main>
    <header class="topbar"><div class="top-start"><button class="icon-button" data-action="sidebar" aria-label="Бічна панель" data-icon="panel"></button><span class="page-title">Хронологія</span><label class="sr-only" for="continuity">Версія історії</label><select id="continuity" class="quiet-select" aria-label="Версія історії"></select></div><div class="top-actions"><button class="icon-button mobile-search" data-action="search" aria-label="Пошук" data-icon="search"></button><button class="filter-button" data-action="filters"><span data-icon="filter"></span><span>Фільтри</span><i id="filter-count" hidden></i></button></div></header>
    <section class="workspace" aria-label="Інтерактивна хронологія">
      <div class="workspace-top"><div><h1 id="range-title">Хронологія</h1><p id="range-meta" class="muted">Завантаження даних…</p></div><div class="period-wrap"><span data-icon="calendar"></span><label class="sr-only" for="period">Перейти до періоду</label><select id="period"><option value="all">Увесь період</option></select></div></div>
      <div id="active-filters" class="active-filters" hidden></div>
      <div id="viewport" class="viewport" tabindex="0" role="region" aria-label="Лінії хронології. Плюс і мінус змінюють масштаб, стрілки переміщують, Home показує весь період.">
        <svg id="timeline" aria-label="Події та лінії персонажів"><g id="axis"></g><g id="threads"></g><g id="nodes"></g></svg>
        <div id="canvas-message" class="canvas-message" hidden></div>
        <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
      </div>
      <div class="canvas-footer"><div class="legend"><span><i class="legend-dot"></i>Участь</span><span><i class="legend-ring"></i>Присутність</span><button class="help-button" data-action="help" aria-label="Як читати хронологію">?</button></div><div class="zoom-bar"><button class="icon-button" id="zoom-out" aria-label="Віддалити" data-icon="minus"></button><button id="zoom-value" class="zoom-value" title="Повернути початковий масштаб">100%</button><button class="icon-button" id="zoom-in" aria-label="Наблизити" data-icon="plus"></button><span class="zoom-separator"></span><button class="icon-button" id="fit" aria-label="Увесь період" data-icon="fit"></button></div><span class="gesture-hint" id="gesture-hint">Перетягуйте · наближайте колесом</span></div>
      <div id="minimap" class="minimap" aria-label="Огляд усієї хронології"><svg id="mini-svg" aria-hidden="true"></svg><div id="mini-window"></div></div>
      <div class="bottom-caption"><span id="source-caption"></span><span id="visible-caption"></span></div>
    </section>
  </main>
</div>
<dialog id="detail-dialog" class="detail-dialog"><div class="dialog-top"><span id="detail-eyebrow" class="muted">Подія</span><button class="icon-button" data-close="detail-dialog" aria-label="Закрити" data-icon="close"></button></div><div id="detail-content" class="detail-content"></div></dialog>
<dialog id="search-dialog" class="search-dialog"><div class="search-top"><span data-icon="search"></span><label class="sr-only" for="search-input">Знайти у хронології</label><input id="search-input" placeholder="Подія, персонаж або місце…" autocomplete="off"><button class="icon-button" data-close="search-dialog" aria-label="Закрити пошук" data-icon="close"></button></div><div id="search-results" class="search-results"></div></dialog>
<dialog id="filter-dialog" class="filter-dialog"><div class="dialog-top"><h2>Фільтри</h2><button class="icon-button" data-close="filter-dialog" aria-label="Закрити фільтри" data-icon="close"></button></div><div class="filter-fields"><label>Команда<select id="filter-team"></select></label><label>Походження<select id="filter-origin"></select></label><label>Місце<select id="filter-location"></select></label><label>Джерело<select id="filter-source"></select></label><label>Вибрані персонажі<select id="filter-mode"><option value="context">Показати разом із контекстом</option><option value="only">Показати тільки вибраних</option></select></label></div><div class="filter-footer"><button id="reset-filters" class="soft-button">Скинути все</button><button class="primary-button" data-close="filter-dialog">Готово</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
