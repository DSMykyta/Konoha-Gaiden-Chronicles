<style>

<script>
(async function(){

const rootReach={};function reaches(a,b){const k=a+"|"+b;if(rootReach[k]!=null)return rootReach[k];const seen=new Set([a]),qq=[a];while(qq.length){const x=qq.shift();if(x===b)return rootReach[k]=true;for(const n of edges.get(x)||[])if(!seen.has(n)){seen.add(n);qq.push(n)}}return rootReach[k]=false}

const maxX=Math.max(...Object.values(layout).map(l=>l.x+l.w))+90,maxY=Math.max(...Object.values(layout).map(l=>l.y+l.h))+70,map=document.getElementById("map"),mini=document.getElementById("mini");map.setAttribute("viewBox","0 0 "+maxX+" "+maxY);mini.setAttribute("viewBox","0 0 "+maxX+" 72");mini.querySelector(".bg").setAttribute("width",maxX);mini.querySelector(".bg").setAttribute("height",72);

const rg=document.getElementById("routes"),mrg=document.getElementById("miniRoutes"),labg=document.getElementById("labels"),hidden={};

function show(s,e){document.querySelectorAll(".event").forEach(x=>x.classList.toggle("active",x.dataset.id===e.id));document.getElementById("empty").classList.add("hide");document.getElementById("detail").classList.add("show");document.getElementById("right").classList.add("open");const pill=document.getElementById("pill");pill.textContent=e.origin;pill.style.background=e.origin==="M"?"linear-gradient(135deg,#ffb35f,#ff4f91)":e.origin==="P"?"linear-gradient(135deg,#5ce4ff,#ae68ff)":e.origin==="A"?"linear-gradient(135deg,#65f3a6,#48a8ff)":"linear-gradient(135deg,#d5d9e5,#7b8292)";document.getElementById("dTitle").textContent=e.title;document.getElementById("dText").textContent=e.text;const focus=[...new Set(e.involvement.filter(i=>i.mode==="physical"&&(i.role==="focus"||i.role==="participant")).map(i=>i.entityId))].filter(id=>byId[id]);document.getElementById("focus").replaceChildren(...focus.map(chip));document.getElementById("present").replaceChildren(...presentScene(s).map(chip));document.getElementById("src").textContent=s.source.file+" · "+s.source.sha.slice(0,10)}
document.getElementById("status").textContent=data.scenes.length+" сцен · "+data.scenes.reduce((n,s)=>n+s.events.length,0)+" подій · "+entities.length+" сутностей";
const stage=document.getElementById("stage"),world=document.getElementById("world"),vp=document.getElementById("viewport");let zoom=1,panX=0,panY=0,drag=false,sx=0,sy=0,spx=0,spy=0;
function fitScale(){const r=stage.getBoundingClientRect();return Math.min(1.15,Math.max(.35,Math.min((r.width-30)/maxX,(r.height-30)/maxY)))}
function apply(){world.setAttribute("transform","translate("+panX+" "+panY+") scale("+zoom+")");document.getElementById("zoom").textContent=Math.round(zoom*100)+"%";const r=stage.getBoundingClientRect(),vw=Math.min(maxX,r.width/zoom),vx=Math.max(0,-panX/zoom);vp.setAttribute("x",vx);vp.setAttribute("width",vw);vp.setAttribute("y",3);vp.setAttribute("height",66)}
function fit(){zoom=fitScale();const r=stage.getBoundingClientRect();panX=(r.width-maxX*zoom)/2;panY=(r.height-maxY*zoom)/2;apply()}
stage.addEventListener("wheel",e=>{e.preventDefault();const r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,bx=(mx-panX)/zoom,by=(my-panY)/zoom,n=Math.max(.25,Math.min(3.2,zoom*Math.exp(-e.deltaY*.0012)));panX=mx-bx*n;panY=my-by*n;zoom=n;apply()},{passive:false});stage.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".event"))return;drag=true;sx=e.clientX;sy=e.clientY;spx=panX;spy=panY;stage.classList.add("dragging");stage.setPointerCapture(e.pointerId)});stage.addEventListener("pointermove",e=>{if(drag){panX=spx+e.clientX-sx;panY=spy+e.clientY-sy;apply()}});stage.addEventListener("pointerup",()=>{drag=false;stage.classList.remove("dragging")});document.getElementById("fit").onclick=fit;let motion=true;document.getElementById("motion").onclick=function(){motion=!motion;const a=document.querySelector("#wave animate");if(a){motion?a.beginElement():a.endElement()}this.textContent=motion?"≈ Хвиля":"— Статично"};window.addEventListener("resize",fit);fit();
})().catch(err=>{document.getElementById("status").textContent="Data error: "+err.message});
</script>
