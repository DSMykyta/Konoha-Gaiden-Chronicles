- id: ev-y0-kakashi-releases-uninvolved-archivists
  title: Какаші відпускає непричетних архівісток
  text: Після того як охоронці відводять двох співучасниць, у коридорі залишаються четверо жінок, серед них Юміко. Вони чекають нового затримання, але Какаші припиняє перевірку й дозволяє їм повернутися до робочих місць. Доступ до закритого сектора тимчасово обмежено до розпорядження Хокаґе. Юміко, так само налякана ситуацією, швидко вклоняється й іде за колегами. Какаші не використовує її особову справу для приватного знайомства та здає документи назад до адміністрації.
