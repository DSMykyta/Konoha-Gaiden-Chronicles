- id: ev-y0-kakashi-identifies-archive-accomplices
  title: Какаші відокремлює двох співучасниць архівного витоку
  text: 'Після затримання старшої архівістки Какаші отримує особові справи шістьох працівниць, яких охорона залишила в коридорі. Дві старші жінки реагують на його появу значно гостріше за решту: вони знали про позастатутні передачі документів. Хатаке прямо констатує їхню обізнаність, і обидві перестають приховувати свою причетність. Він наказує чунінам відвести їх у різні камери й оформити як співучасниць, відділяючи їх від працівниць, на яких доказів немає.'
