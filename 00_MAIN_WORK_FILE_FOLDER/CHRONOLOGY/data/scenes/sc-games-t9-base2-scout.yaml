  title: Команда 9 входить у дві будівлі Бази 2
  text: 'На світанку Рен відчуває п’ятьох у більшому будинку, а в меншому команда очікує двох за попередніми спостереженнями. Кіта й Рен знаходять там чотирьох сплячих охоронців і вбивають їх. Потім трійка входить у більшу будівлю: Сора усуває жінку, яка тягнеться до зброї, хлопці — двох чоловіків. У наступній кімнаті Кіта вбиває беззбройного дослідника з піднятими руками; Рен не встигає його зупинити.'
