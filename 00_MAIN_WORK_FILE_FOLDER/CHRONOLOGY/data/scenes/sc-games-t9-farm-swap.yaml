  text: 'Після доставки трьох важких пакунків команда повертається фермерським маршрутом. Тоуно без попередження влаштовує засідку. Коли один нападник заходить Рену за спину, Кіта міняється з ним місцями: нападник опиняється високо й далеко від команди та травмується при падінні. Сора відлякує другого кунаєм. Після виснажливого повернення Рен мусить нести Кіту; довіра до такого способу перевірки зруйнована.'
