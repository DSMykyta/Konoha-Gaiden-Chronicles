description: >-
  Рок Лі зупиняє Команду 7 перед іспитом та пропонує Саске поєдинок, щоб перевірити сили проти Учіхи. Спершу Наруто пробує битися замість Саске, але програє за кілька секунд. Шарінґан допомагає Саске бачити рухи Лі, однак тіло не встигає відреагувати на швидке тайдзюцу. Нінґаме перериває небезпечний прийом, після чого Ґай сварить Лі, називає Какаші своїм суперником і йде. Лі визнає, що Неджі сильніший за нього.
