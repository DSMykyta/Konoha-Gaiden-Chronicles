  text: 'Нобарі помічає мокру пов’язку й приховані опіки на руках Кіти. Він зізнається, що кілька вечорів повторював вогняну вправу без нагляду. Нобарі знову дістає той самий конспект, який показувала після перевірки Райдо, і цього разу передає його синові: тепер він має уважно читати про тканини та контроль чакри. Вона забороняє продовжувати небезпечні самостійні спроби.'
