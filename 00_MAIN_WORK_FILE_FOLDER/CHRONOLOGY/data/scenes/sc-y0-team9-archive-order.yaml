- id: ev-y0-team9-receives-archive-order
  title: Команда 9 отримує роботу в архівному корпусі
  text: 'Після складів, доставок і кількох тижнів роботи з Райдо команда отримує D-рангове доручення на об’єкті з обмеженим доступом. Потрібно звірити реєстраційні списки, промаркувати коробки за роками та допомогти перенести частину технічного архіву. Райдо нагадує, що доступ до корпусу дали з огляду на його звіт про учнів: наступного ранку вони працюватимуть з обліком під його наглядом, а не досліджуватимуть закриті матеріали.'
