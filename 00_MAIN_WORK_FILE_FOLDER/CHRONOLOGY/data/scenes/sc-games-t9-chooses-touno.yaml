  text: О сьомій ранку до трійки приходить чунін Тоуно Ібікі з паперами й секундоміром. Він уточнює, що не є Моріно Ібікі, й знайомиться з профілями учнів. Тоуно має вести їхні D-ранги на час лікування Анко. Команда зберігає свій склад і графік, але ще не знає, як новий наставник працюватиме з їхніми особистими прийомами.
