  title: Рен ділиться сливами з Кітою після сварки
  text: На складі Сора знаходить сливи, про які Рен говорив увесь довгий маршрут. Він свариться з Кітою, який скуштував першим, і не розмовляє з ним під час збору припасів. Після спалення комплексу трійка сідає біля річки. Рен сам простягає Кіті сливу й посуває торбу так, щоб усі могли брати. За звичними жартами вони знову повертаються до спільної розмови.
