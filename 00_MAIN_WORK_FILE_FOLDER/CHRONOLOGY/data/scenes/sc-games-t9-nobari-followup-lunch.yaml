  title: Шестеро генінів діляться їжею й дитячими історіями
  text: Рен приносить онігірі Іщіна. За обідом Кіба й Кіта згадують жуків, яких їли з Наруто біля річки; Шіно розпитує,
    що це були за жуки. Рен розповідає про змію на риболовлі. Акамару краде шматок омлету Хінати, діти пропонують
    обмін їжею. Куренай сидить за деревом.
