  title: Фіналісти жеребкують пари фіналу
  text: 'Хірузен оголошує місяць підготовки до фіналу, призначеного в календарі проєкту на 1 серпня. Жереб визначає пари:
    Наруто — Неджі, Ґаара — Саске, Канкуро — Шіно, Досу — Шикамару; переможець останньої пари має зустрітися з Темарі.
    На запитання Шикамару Хірузен пояснює, що підвищення залежить від оцінки якостей чуніна, а не лише перемоги в турнірі.'
