  title: На Базі 18 Команда 9 знищує полонених і проводить дослід
  text: Кіта виводить полонених із камер до зали під обіцянку безпеки, а Рен відбирає десятьох для лабораторії. Після цього Кіта вбиває людей у залі. Сора, яка вже знищила персонал лабораторії, проводить досліди з міткою за участю обох хлопців. Активація випалює чакросистему; Кіта вбиває піддослідного, який намагається втекти, а Сора — тих, хто лишився. Порятунку полонених не відбувається.
