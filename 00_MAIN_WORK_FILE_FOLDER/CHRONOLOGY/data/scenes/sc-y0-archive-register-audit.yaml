  title: Перевірка пов’язує схованку з порушеннями архівного доступу
  text: Інспектор зіставляє приховані матеріали з описами фондів, накладними на списання та записами про доступ до закритих документів. Стара бірка не пояснює актуальні матеріали у схованці, а журнали містять розходження між дозволеними операціями й фактичним рухом паперів. Перевірку розширюють з технічного сектора на інші частини архівного корпусу. Сліди ведуть до родинних метрик і медичних відомостей, які зберігають у цивільному реєстрі, тому до справи підключають Відділ розвідки та допитів.
