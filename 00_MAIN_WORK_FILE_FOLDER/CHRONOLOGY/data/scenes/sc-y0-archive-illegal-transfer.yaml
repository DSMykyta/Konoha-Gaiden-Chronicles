- id: ev-y0-mikata-records-transfer-to-iwa-contact
  title: Міката фіксує передачу сувою зв’язковому Іви
  text: 'За кілька робочих змін Міката складає списки матеріалів і графік підозрілих зустрічей. Під час однієї з передач він фотографує старшу архівістку, яка віддає запечатаний сувій зв’язковому з Країни Землі. Спостереження залишається прихованим: зв’язкового поки не затримують, щоб не зірвати одночасну ізоляцію джерела витоку й не дати знищити архівні докази. Фотографії разом із документальними списками стають підставою для санкції Хокаґе.'
