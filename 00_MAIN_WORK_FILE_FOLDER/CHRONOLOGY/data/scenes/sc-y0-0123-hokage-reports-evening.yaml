  - id: "ev-y0-0123-kurenai-joins-nobari-asuma"
    title: "Куренай приєднується до Нобарі й Асуми"
    text: |-
      Куренай безшумно підходить до них і забирає в Нобарі кілька сувоїв, щоб розвантажити їй руки. Нобарі одразу пожвавлюється й питає, чи вони обоє сьогодні здають результати своїх команд. Розмова переходить до першого дня з випускниками: Куренай згадує вправи Команди 8 на вистежування, Асума бурчить у відповідь на її шпильку про «серйозний командний тест» Десятої, а Нобарі слухає їх уже з усмішкою, ніби на мить повернулася в часи, коли вони самі були молодшими.

      Погляд Нобарі падає на настінний годинник. Вона різко згадує про копії для Хокаґе, забирає сувої в Куренай і майже бігцем рушає далі. Уже на ходу кидає подяку й випадково звертається до Асуми надто по-дружньому — «Асума-кун». Коли вона зникає за рогом, Куренай не втримується й починає тихо дражнити його тим самим звертанням. Асума відмахується, наполягаючи, що Нобарі просто обмовилася. Саме тоді з протилежного кінця коридору до них наближаються ще двоє.
