events:
  - id: "ev-y0-0123-asuma-catches-nobari-folder"
    title: "Асума допомагає Нобарі з паперами"
    text: |-
      У вечірньому коридорі резиденції Хокаґе майже порожньо. Асума чекає своєї черги зі звітом Команди 10, притулившись до стіни з незапаленою сигаретою в зубах. З-за рогу поспіхом виходить Нобарі, навантажена сувоями й текою з бланками; вона перечіпляється об край доріжки, і верхня тека вислизає з рук. Асума встигає перехопити її майже біля самої підлоги й повертає на стос.

      Нобарі дякує й, трохи ніяковіючи, питає, чи він теж прийшов через нових генінів. Асума відповідає, що здає звіт по Десятій. Вона скаржиться на кінець місяця, копії й паперову роботу для Третього, намагаючись одночасно втримати весь стос. Їхня коротка розмова вже переходить у звичний старий ритм, коли поруч лунає голос Куренай.
