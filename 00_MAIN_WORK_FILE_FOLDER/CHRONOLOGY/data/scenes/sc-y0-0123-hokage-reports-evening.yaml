  - id: "ev-y0-0123-kakashi-raido-arrive-reports"
    title: "Какаші й Райдо приходять оформити проходження команд"
    text: |-
      До Асуми й Куренай підходять Какаші та Райдо. Какаші ще дорогою читає свою книжку, а Райдо має вигляд людини, яка за один день устигла втомитися від трьох новоспечених генінів сильніше, ніж від звичайної місії. На запитання Асуми Какаші коротко підтверджує, що вони теж ідуть до Третього офіційно оформляти результати: його трійця пройшла.

      Райдо сухо додає, що його теж. Потім, потираючи перенісся, згадує сьогоднішній бій: один із учнів мало не зачепив його Катоном у паніці, інший намагався взяти джоніна прямим тараном. Куренай сміється, що звучить це як чудова команда, і нагадує, що її геніни весь ранок дисципліновано ігнорували Команду 9 разом із замаскованим Райдо. Після цього четверо наставників залишають коридор і прямують оформлювати результати першого дня.
