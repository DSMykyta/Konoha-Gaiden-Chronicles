  title: Розвідка встановлює витік із цивільного реєстру
  text: 'Після звірки архівних доступів і походження прихованих документів Ібікі отримує підтвердження: назовні передають дані про родоводи, генетичні лінії та приховані медичні показники родин шинобі. Шпитальний канал перевірено окремо й виключено; джерело знаходиться в Головному архіві цивільної реєстрації. Для відкритого обшуку відомостей ще недостатньо: у корпусі працюють цивільні, а винні можуть знищити докази. Ібікі готує для Хірузена матеріали на приховану операцію.'
