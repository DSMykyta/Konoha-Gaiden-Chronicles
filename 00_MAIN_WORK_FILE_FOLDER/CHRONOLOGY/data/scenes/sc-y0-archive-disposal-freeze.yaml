  title: Адміністрація архіву зупиняє списання й відкриває перевірку
  text: 'Після виходу Команди 9 адміністраторка фіксує чотири знайдені одиниці вантажу, стару бірку на п’ять і слід до коридору вивезення. Сектор 3-Б опечатують, рух майна на списання заморожують, а накладні та журнал доступу вилучають для звірки. Госпітальна група забезпечує карантин, поки інспектор перевірки бере під контроль облік знахідки. Розбіжність не списують на давню помилку: потрібно встановити, що було винесено та хто мав доступ до схованки.'
