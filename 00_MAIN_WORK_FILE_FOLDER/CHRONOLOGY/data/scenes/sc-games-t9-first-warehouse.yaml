  text: На першому оплачуваному D-ранзі Команда 9 впорядковує вантажі південного складу. Райдо переносить ящики разом з учнями, стежить за безпекою й пояснює порядок роботи. Рен бере важче, а Кіта й Сора допомагають організувати перенесення. Після завершення наставник веде трійку до резиденції, щоб здати роботу й отримати платню.
