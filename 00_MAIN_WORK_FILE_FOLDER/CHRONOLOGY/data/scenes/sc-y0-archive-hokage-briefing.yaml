- id: ev-y0-hiruzen-assigns-archive-investigation
  title: Хірузен доручає Какаші й Мікаті справу архівного витоку
  text: 'Хірузен передає Какаші матеріали перевірки й пояснює, що крадуть закриті родинні та медичні дані. Шпиталь уже перевірений, тому шукати джерело потрібно в цивільному реєстраційному архіві. Відкритий рейд дасть винним час знищити документи й поставить під підозру десятки непричетних працівників. Какаші отримує зовнішнє керівництво: логістику, перехоплення та силове забезпечення майбутнього затримання. До кабінету приєднується Міката; він має зайти в архів під виглядом нового цивільного співробітника й зібрати докази зсередини.'
