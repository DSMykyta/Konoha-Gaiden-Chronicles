title: "Забуза зазнає поразки в заколоті проти Мідзукаґе"
description: "Задовго до сутички з Командою 7 Забуза намагається вбити Мідзукаґе й силою змінити владу Кіріґакуре, але терпить поразку. Він тікає з батьківщини з уцілілими послідовниками, лишається ніндзя-відступником і потребує грошей на повернення та нову спробу захопити владу. Какаші розповідає про ці обставини Забузі під час бою на мосту; точні дата замаху та місце Хаку в цю мить не відомі."
