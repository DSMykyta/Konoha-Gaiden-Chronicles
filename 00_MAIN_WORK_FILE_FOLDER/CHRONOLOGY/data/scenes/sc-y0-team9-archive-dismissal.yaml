  title: Адміністраторка усуває Команду 9 від архівної справи
  text: 'Біля виходу з внутрішнього двору команду чекає адміністраторка. Вона сухо наказує учням: вони нічого не бачили й нічого не знають. Її погляд затримується на Сориному блокноті, після чого жінка повертається до корпусу, не даючи пояснень. Для дітей це виглядає як спроба приховати їхню знахідку; доступу до результатів перевірки вони не отримують.'
