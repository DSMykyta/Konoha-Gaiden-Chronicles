  title: Кіта визначає вітер і вогонь на чакровому папері
  text: 'На особистому занятті Асума розповідає Кіті про навчання в Храмі Вогню й про Чіріку, який навчив його вітряних лез. На прохання учня він дає чакровий папір: той одночасно розривається й згорає. Асума визначає дві природи, вітер і вогонь, та ставить наступне завдання — провести вітер уздовж клинка. Після спарингу він повідомляє Куренай про результат, але ще не звітує Хокаґе.'
