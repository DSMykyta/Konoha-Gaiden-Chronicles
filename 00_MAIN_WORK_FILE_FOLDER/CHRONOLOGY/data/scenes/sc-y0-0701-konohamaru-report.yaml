  title: Конохамару, Моегі й Удон беруть інтерв’ю в Команди 7
  text: Перед входом до Лісу Смерті Наруто помічає квадратний камінь, за яким ховається трійця Конохамару. Діти виходять із
    маскування й просять інтерв’ю для шкільного репортажу. Конохамару розпитує Наруто, який переважно хвалиться; Моегі слухає
    Сакуру про техніки, Саске й Какаші; Удон розмовляє із Саске, який заперечує перебільшення Наруто. Учасники переказують
    попередні пригоди зі своїх позицій.
