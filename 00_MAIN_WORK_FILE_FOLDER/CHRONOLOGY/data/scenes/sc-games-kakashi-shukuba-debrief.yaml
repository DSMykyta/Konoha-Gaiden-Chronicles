  text: Після повернення з Шукуби Команда 7 здає Хірузену сувій із розвідданими. Какаші пояснює, як забезпечив закриту передачу та зберіг прикриття агента, і подає чек на витрати. Дані передають до Відділу розвідки та допитів для розшифрування. Вийшовши з резиденції, саме Какаші звільняє учнів від тренувань на три дні.
